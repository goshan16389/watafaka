<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" id="manifestLink">
<title>Финансы</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e1014;--panel:#161a22;--panel2:#1d222c;--panel3:#232936;--border:#262c3a;
  --text:#e7eaf0;--muted:#8b93a7;--accent:#4f8cff;--accent-d:#3a72d9;
  --green:#3ddc97;--red:#ff5c7a;--yellow:#ffcc66;--r:16px;
  --nav-h:62px;--safe-b:env(safe-area-inset-bottom,0px);--kb:0px;--vvh:100vh;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,system-ui,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;border:0;background:none}
input,textarea,select{font-family:inherit}

/* AUTH */
.auth-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 600px at 50% -10%,rgba(79,140,255,.10),transparent 60%),var(--bg);
  z-index:500;overflow-y:auto}
.auth-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);
  border-radius:20px;padding:28px 24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.auth-logo{font-size:26px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.auth-sub{color:var(--muted);font-size:14px;margin-bottom:22px;line-height:1.5}
.auth-tabs{display:flex;gap:5px;background:var(--panel2);padding:5px;border-radius:14px;margin-bottom:18px}
.auth-tab{flex:1;padding:10px;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;font-size:14px;transition:.15s}
.auth-tab.active{background:var(--panel);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.auth-field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.auth-field label{font-size:12.5px;color:var(--muted);font-weight:500}
.auth-field input{background:var(--panel2);border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;outline:none;width:100%;font-size:16px}
.auth-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
.auth-btn{width:100%;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:15px;margin-top:6px}
.auth-btn:active{transform:scale(.98)}
.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.auth-msg{margin-top:14px;padding:11px 13px;border-radius:11px;font-size:13.5px;line-height:1.45;display:none}
.auth-msg.show{display:block}
.auth-msg.err{background:rgba(255,92,122,.12);color:#ff8da1;border:1px solid rgba(255,92,122,.25)}
.auth-msg.info{background:rgba(79,140,255,.12);color:#9ec0ff;border:1px solid rgba(79,140,255,.25)}

/* LAYOUT */
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0;padding:24px 28px 80px;max-width:1080px;margin:0 auto;width:100%}

/* SIDEBAR */
.sidebar{width:228px;flex:0 0 228px;background:var(--panel);border-right:1px solid var(--border);
  padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;z-index:40}
.logo{font-size:17px;font-weight:700;padding:4px 10px 18px;display:flex;align-items:center;gap:9px}
.nav-btn{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;background:transparent;
  color:var(--muted);cursor:pointer;width:100%;text-align:left;transition:.15s;font-size:14.5px;font-weight:500}
.nav-btn i{font-style:normal;font-size:17px;width:20px;text-align:center}
.nav-btn:hover{background:var(--panel2);color:var(--text)}
.nav-btn.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 8px 20px -10px var(--accent)}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.topbar h1{font-size:23px;font-weight:700;letter-spacing:-.015em}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-add{display:none;align-items:center;justify-content:center;gap:6px;
  padding:9px 14px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;
  transition:.15s;cursor:pointer;border:0}
.topbar-add:hover{background:var(--accent-d)}
.topbar-add:active{transform:scale(.96)}
.topbar-add .plus{font-size:18px;line-height:1;margin-top:-1px}
.cur{background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:10px;
  padding:8px 12px;cursor:pointer;font-size:14px;font-weight:600;min-width:52px;text-align:center}
.user-badge{display:flex;align-items:center;gap:8px;padding:4px;background:var(--panel);
  border:1px solid var(--border);border-radius:99px;position:relative;transition:.15s}
.user-badge:hover{border-color:#39415a}
.user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#4f8cff,#7aa8ff);
  color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;text-transform:uppercase}
.sync-dot{position:absolute;top:1px;right:1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--panel);transition:background .25s}
.sync-dot.ok{background:var(--green)}
.sync-dot.syncing,.sync-dot.pending{background:var(--yellow);animation:pulse 1s infinite}
.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* CARDS */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:18px}
.card + .card{margin-top:14px}
.stats > .card + .card,
.grid2 > .card + .card{margin-top:0}
.section-title{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  font-weight:700;margin:26px 0 12px}
.section-title:first-child{margin-top:0}

/* DASHBOARD */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;grid-auto-rows:1fr}
.stats > .card{min-height:90px;display:flex;flex-direction:column;justify-content:flex-start;padding:14px 16px}
.stat .lbl{font-size:12.5px;color:var(--muted);margin:0;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.stat .val{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin:6px 0 0;flex:0 0 auto}
.stat .sub{font-size:12px;color:var(--muted);margin:auto 0 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.pos{color:var(--green)} .neg{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.cat-row{margin-bottom:14px}
.cat-row:last-child{margin-bottom:0}
.cat-head{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:7px;gap:10px}
.cat-head .amt{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#7aa8ff);
  transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar-fill.green{background:linear-gradient(90deg,#2fbf85,var(--green))}
.cat-diff{font-size:11.5px;font-weight:600;margin-left:6px}
.cat-diff.up{color:#ff8da1}
.cat-diff.down{color:var(--green)}

/* TOTAL BUDGET */
.total-budget{cursor:pointer;transition:.15s}
.total-budget:hover{border-color:#39415a}
.total-budget .cat-head{font-size:14px;font-weight:600;margin-bottom:8px}
.total-budget .sub{font-size:12.5px;color:var(--muted);margin-top:8px}

/* TX ITEM */
.tx-item{position:relative;overflow:hidden;border-bottom:1px solid var(--border)}
.tx-item:last-child{border-bottom:0}
.tx-content{position:relative;background:var(--panel);display:flex;align-items:center;gap:12px;
  padding:11px 0;transition:transform .2s ease;will-change:transform;cursor:pointer}
.tx-item.swiped .tx-content{transform:translateX(-72px)}
.tx-content.dragging{transition:none}
.tx-delete-bg{position:absolute;right:0;top:0;bottom:0;width:72px;background:var(--red);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.tx-ico{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:var(--panel2);
  display:flex;align-items:center;justify-content:center;font-size:17px}
.tx-mid{flex:1;min-width:0}
.tx-title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:12px;color:var(--muted);margin-top:1px}
.tx-amt{font-weight:600;font-size:14.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tx-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tx-tag{font-size:11px;color:var(--accent);background:rgba(79,140,255,.1);
  padding:1px 7px;border-radius:99px;display:inline-block}
.icon-btn{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:16px;
  padding:8px 10px;min-width:38px;min-height:38px;border-radius:10px;line-height:1;
  transition:.15s;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--panel2);color:var(--red)}
.icon-btn:active{transform:scale(.9)}

/* CHART */
.chart{display:flex;gap:8px;align-items:flex-end;padding:14px 0 0;min-height:140px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.chart-bar{width:100%;max-width:44px;background:linear-gradient(180deg,var(--accent),#2a5fc9);
  border-radius:6px 6px 2px 2px;min-height:4px;transition:height .4s;position:relative}
.chart-bar.current{background:linear-gradient(180deg,#ffcc66,#d99e2e)}
.chart-label{font-size:11px;color:var(--muted);text-transform:lowercase}

/* FORMS */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
input,textarea,select{background:var(--panel2);border:1.5px solid var(--border);border-radius:12px;
  padding:12px 14px;outline:none;transition:.15s;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
input::placeholder,textarea::placeholder{color:#5a6277}
textarea{resize:vertical;min-height:80px;line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:600;background:var(--panel2);
  color:var(--text);transition:.15s;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 22px -10px var(--accent)}
.btn.primary:hover{background:var(--accent-d)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn.danger{background:rgba(255,92,122,.15);color:#ff8da1}
.btn.block{width:100%}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5}

/* SEGMENTED */
.seg{display:flex;gap:5px;background:var(--panel2);padding:5px;border-radius:14px;margin-bottom:16px}
.seg-btn{flex:1;border:0;background:transparent;color:var(--muted);padding:11px;border-radius:10px;
  cursor:pointer;font-weight:600;font-size:14.5px;transition:.15s}
.seg-btn.active{background:var(--panel);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.seg-btn.active[data-type="income"],.seg-btn.active[data-sheet-type="income"],.seg-btn.active[data-rec-type="income"]{color:var(--green)}
.seg-btn.active[data-type="expense"],.seg-btn.active[data-sheet-type="expense"],.seg-btn.active[data-rec-type="expense"]{color:var(--red)}

/* AMOUNT */
.amount-wrap{position:relative;margin-bottom:12px}
.amount-input{width:100%;font-size:34px;font-weight:700;letter-spacing:-.02em;padding:14px 58px 14px 18px;
  background:var(--panel2);border:1.5px solid var(--border);border-radius:16px;-moz-appearance:textfield}
.amount-input::-webkit-outer-spin-button,.amount-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.amount-cur{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:20px;font-weight:600;pointer-events:none}

/* QUICK AMOUNTS */
.quick-amounts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.quick-btn{background:var(--panel2);border:1.5px solid var(--border);border-radius:10px;
  padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--muted);transition:.15s;
  cursor:pointer;min-width:56px;text-align:center}
.quick-btn:hover{background:var(--panel3);color:var(--text);border-color:var(--accent)}
.quick-btn:active{transform:scale(.95)}

/* CATEGORY GRID */
.cat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:14px}
@media (max-width:340px){.cat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cat-cell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:13px;
  background:var(--panel2);border:1.5px solid transparent;transition:.15s;min-height:68px;justify-content:center;min-width:0}
.cat-cell:active{transform:scale(.94)}
.cat-cell .ci{font-size:22px;line-height:1}
.cat-cell .cn{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.15;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;padding:0 2px}
.cat-cell.active{background:rgba(79,140,255,.14);border-color:var(--accent)}
.cat-cell.active .cn{color:var(--text);font-weight:600}
.cat-cell.custom-cat .cn{color:var(--accent);font-weight:600}
.cat-cell.cat-add{background:transparent;border:1.5px dashed var(--border)}
.cat-cell.cat-add .cn{color:var(--accent);font-weight:600}
.cat-cell.cat-add:hover{background:rgba(79,140,255,.06);border-color:var(--accent)}

/* EMOJI PICKER */
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:12px}
@media (max-width:340px){.emoji-grid{grid-template-columns:repeat(6,1fr)}}
.emoji-btn{padding:6px 0;border-radius:8px;background:var(--panel);border:1.5px solid transparent;
  font-size:17px;line-height:1;cursor:pointer;transition:.12s}
.emoji-btn:hover{background:var(--panel3);border-color:var(--accent)}
.emoji-btn.active{border-color:var(--accent);background:rgba(79,140,255,.14)}
.new-cat-form{display:none;margin:0 0 14px;padding:14px;background:var(--panel2);border-radius:14px;
  border:1px solid var(--border)}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{border:1.5px solid var(--border);background:var(--panel2);color:var(--muted);padding:9px 14px;
  border-radius:99px;cursor:pointer;font-size:13.5px;font-weight:500;transition:.15s}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chips-scroll{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;-ms-overflow-style:none;padding-bottom:4px;margin-bottom:10px}
.chips-scroll::-webkit-scrollbar{display:none}
.chips-scroll > .chip{flex:0 0 auto;white-space:nowrap}
.chips-scroll.has-overflow{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}

/* TAGS INPUT */
.tags-input-wrap{display:flex;flex-direction:column;gap:8px}
.tags-selected{display:flex;flex-wrap:nowrap;gap:6px;min-height:0;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;-ms-overflow-style:none;padding-bottom:2px}
.tags-selected::-webkit-scrollbar{display:none}
.tags-selected:empty{display:none}
.tags-selected.has-overflow{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}
.tag-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(79,140,255,.15);
  color:var(--accent);border:1px solid rgba(79,140,255,.3);border-radius:99px;
  padding:5px 11px;font-size:12.5px;font-weight:600;flex:0 0 auto;white-space:nowrap}
.tag-chip button{color:inherit;font-size:14px;line-height:1;padding:0 0 0 2px;cursor:pointer;
  background:transparent;border:0;opacity:.7}
.tag-chip button:hover{opacity:1}
.tags-suggest{display:flex;flex-wrap:nowrap;gap:6px;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;-ms-overflow-style:none;padding-bottom:2px}
.tags-suggest::-webkit-scrollbar{display:none}
.tags-suggest:empty{display:none}
.tags-suggest.has-overflow{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}
.tag-suggest{background:var(--panel2);border:1px solid var(--border);border-radius:99px;
  padding:5px 11px;font-size:12.5px;color:var(--muted);cursor:pointer;transition:.15s;
  flex:0 0 auto;white-space:nowrap}
.tag-suggest:hover{background:var(--panel3);color:var(--text);border-color:var(--accent)}

/* SEARCH */
.tx-search{margin-bottom:12px;position:relative}
.tx-search input{padding-left:38px}
.tx-search::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:14px;pointer-events:none;opacity:.6}

/* CONTEXT MENU */
.ctx-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--panel2);
  border-radius:12px;width:100%;text-align:left;font-weight:500;font-size:15px;
  margin-bottom:8px;transition:.15s;cursor:pointer;border:0;color:inherit}
.ctx-item:hover{background:var(--panel3)}
.ctx-item.danger{color:#ff8da1}
.ctx-item .ico{font-size:20px;width:24px;text-align:center}

/* GOALS */
.goal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.goal-title{font-size:17px;font-weight:700;letter-spacing:-.01em}
.goal-deadline{font-size:12.5px;color:var(--muted);margin-top:3px}
.goal-nums{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:8px;gap:10px}
.goal-nums b{font-weight:700;font-variant-numeric:tabular-nums}
.goal-plan{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);
  margin-top:14px;padding-top:14px;border-top:1px dashed var(--border)}
.goal-plan b{color:var(--text);font-variant-numeric:tabular-nums}
.forecast{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);
  display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.forecast b{color:var(--text)}
.auto-save-row{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;
  background:var(--panel2);border-radius:12px;cursor:pointer;font-size:13.5px;transition:.15s;border:1.5px solid transparent}
.auto-save-row:hover{background:var(--panel3)}
.auto-save-row.on{border-color:rgba(79,140,255,.4);background:rgba(79,140,255,.08)}
.auto-save-row .label{flex:1}
.auto-save-row .status{color:var(--accent);font-weight:700}
.deposit-row{display:flex;gap:8px;margin-top:12px}
.deposit-row input{flex:1}
.subgoals{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border)}
.subgoal{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;background:var(--panel2);
  margin-bottom:7px;transition:.15s;border:1px solid transparent}
.subgoal input[type=checkbox]{width:19px;height:19px;flex:0 0 19px;accent-color:var(--green);cursor:pointer;padding:0}
.subgoal .t{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subgoal .a{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.subgoal-actions{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.subgoal.done .t{color:var(--green);text-decoration:line-through}
.subgoal.done .a{color:var(--green)}
.subgoal.spent{background:rgba(61,220,151,.06);border-color:rgba(61,220,151,.2)}

  const any = cats.some(c => (usage[c.id] || 0) > 0);
  if (!any) return cats.slice();
  return cats.slice().sort((a, b) => (usage[b.id] || 0) - (usage[a.id] || 0));
}

function getAllTags() {
  const s = new Set();
  state.transactions.forEach(t => (t.tags || []).forEach(tag => s.add(tag)));
  return [...s].sort();
}

function txDisplay(x) {

function normalizeState() {

  state.goals = state.goals || [];
  state.notes = state.notes || [];
  state.budgets = state.budgets || {};
  state.recurring = state.recurring || [];

  if (!Array.isArray(state.customCats.expense)) state.customCats.expense = [];

  state.monthlyBudget = Number(state.monthlyBudget) || 0;
  state.goals.forEach(g => {
    if (g.archived === undefined) g.archived = false;
    if (g.archivedAt === undefined) g.archivedAt = null;
    if (g.virtual === undefined) g.virtual = false;
    (g.subgoals || []).forEach(s => { if (s.spentAt === undefined) s.spentAt = null; });
  });
  normalizeRpg();
  normalizeGame();

function goalBreakdown(g) {
  const deposits = Number(g.deposits) || 0;
  const target   = Number(g.target) || 0;
  const saved    = Math.min(target, deposits);
  const remaining = Math.max(0, target - saved);
  return { deposits, saved, remaining, target };
}
function goalSaved(g) { return goalBreakdown(g).saved; }
function activeGoals()   { return state.goals.filter(g => !g.archived); }
function archivedGoals() { return state.goals.filter(g => g.archived); }

function blankState() {
  return { transactions: [], goals: [], notes: [], currency: state.currency || '€',
    budgets: {}, monthlyBudget: 0, recurring: [], categoryUsage: {},
    customCats: { expense: [], income: [] }, rpg: null, game: null };
}

function applySavings(list, dateStr) {
  const today = dateStr || todayStr();
  let writtenCount = 0;
  list.forEach(item => {
    const g = state.goals.find(x => x.id === item.goalId);
    if (!g) return;
    g.deposits = (Number(g.deposits) || 0) + item.amount;
    if (g.virtual) return;
    state.transactions.push({
      id: uid(),
      type: 'expense',
      amount: item.amount,
      category: 'savings',
      goalId: g.id,
      note: `В цель «${g.title}»`,
      date: today,
      tags: slugTag(g.title) ? [slugTag(g.title)] : [],
      auto: !!item.auto,
      createdAt: new Date().toISOString(),
    });
    writtenCount++;
  });
  if (writtenCount > 0) {
    state.categoryUsage['savings'] = (state.categoryUsage['savings'] || 0) + writtenCount;
  }
  save();
}

let uiPeriod = 'month';
function periodRange() {
  const now = new Date();
  if (uiPeriod === 'month') {
    return { start: new Date(now.getFullYear(), now.getMonth(), 1),
             end: new Date(now.getFullYear(), now.getMonth()+1, 1, 0,0,0,0),
             label: 'этот месяц' };
  }
  if (uiPeriod === 'prev') {
    return { start: new Date(now.getFullYear(), now.getMonth()-1, 1),
             end: new Date(now.getFullYear(), now.getMonth(), 1, 0,0,0,0),
             label: 'прошлый месяц' };
  }
  return { start: new Date(0), end: new Date(8640000000000000), label: 'всё время' };
}
function inPeriod(dateStr, r) {
  const d = new Date(dateStr + 'T00:00:00');
  return d >= r.start && d < r.end;
}

let syncTimer = null;
let syncState = 'ok';
let lastPushTimestamp = null;
let lastPushAt = 0;
let realtimeChannel = null;

function setSyncStatus(s) {
  syncState = s;
  const dot = $('#syncDot');
  if (!dot) return;
  dot.className = 'sync-dot ' + s;
  dot.title = s === 'ok' ? 'Синхронизировано' :
              s === 'pending' ? 'Ожидает сохранения' :
              s === 'syncing' ? 'Сохраняю…' : 'Ошибка синхронизации';
}
function save() {
  saveLocal();
  if (!currentUser) return;
  setSyncStatus('pending');
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushToCloud, 700);
}
async function pushToCloud() {
  if (!currentUser) return;
  setSyncStatus('syncing');
  const ts = new Date().toISOString();
  const snapshot = JSON.parse(JSON.stringify(state));
  const { error } = await sb.from('user_data').upsert({
    user_id: currentUser.id, data: snapshot, updated_at: ts,
  }, { onConflict: 'user_id' });
  if (error) { console.warn('push error', error); setSyncStatus('error'); return; }
  lastPushTimestamp = ts;
  lastPushAt = Date.now();
  setSyncStatus('ok');
}
async function pullFromCloud() {
  if (!currentUser) return { found: false };
  const { data, error } = await sb.from('user_data')
    .select('data').eq('user_id', currentUser.id).maybeSingle();
  if (error) { console.warn('pull error', error); return { found: false, error }; }
  if (data && data.data && typeof data.data === 'object') {
    state = Object.assign(blankState(), data.data);
    normalizeState();
    saveLocal();
    return { found: true };
  }
  return { found: false };
}

/* =====================================================================
   REALTIME
   ===================================================================== */
function subscribeRealtime() {
  if (!currentUser || realtimeChannel) return;
  realtimeChannel = sb.channel('user_data_rt')
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'user_data', filter: `user_id=eq.${currentUser.id}` },
      (payload) => {
        if (syncState !== 'ok') return;
        if (lastPushAt && Date.now() - lastPushAt < 2000) return;
        const remote = payload.new?.data;
        if (!remote || typeof remote !== 'object') return;
        state = Object.assign(blankState(), remote);
        normalizeState();
        saveLocal();
        render();
      })
    .subscribe();
}
function unsubscribeRealtime() {
  if (realtimeChannel) { try { sb.removeChannel(realtimeChannel); } catch(e) {} realtimeChannel = null; }
}

/* =====================================================================
   RECURRING
   ===================================================================== */
function runRecurring() {
  normalizeRpg();
  normalizeGame();
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  let changed = false;
  (state.recurring || []).forEach(r => {
    if (!r.active) return;
    if (r.lastRun === ym) return;
    if (now.getDate() < (r.dayOfMonth || 1)) return;
    const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    const day = Math.min(r.dayOfMonth, daysInMonth);
    const dateStr = `${ym}-${String(day).padStart(2,'0')}`;
    state.transactions.push({
      id: uid(), type: r.type, amount: r.amount, category: r.category,
      note: r.note || '', date: dateStr, createdAt: new Date().toISOString(),
      recurringId: r.id, tags: [],
    });
    state.categoryUsage[r.category] = (state.categoryUsage[r.category] || 0) + 1;
    r.lastRun = ym;
    changed = true;
  });
  if (changed) save();
}

   SHARED GOALS
   ===================================================================== */
async function loadSharedGoals() {
  if (!currentUser) { sharedGoals = []; return; }
  const { data: goals, error } = await sb.from('shared_goals').select('*')
    .order('created_at', { ascending: false });
  if (error) { console.warn('shared goals load', error); return; }
  if (!goals || !goals.length) { sharedGoals = []; saveLocalShared(); return; }
  const ids = goals.map(g => g.id);
  const [mRes, dRes] = await Promise.all([
    sb.from('shared_goal_members').select('*').in('goal_id', ids),
    sb.from('shared_goal_deposits').select('*').in('goal_id', ids).order('date', { ascending: false }),
  ]);
  const members = mRes.data || [];
  const deposits = dRes.data || [];
  sharedGoals = goals.map(g => {
    const gm = members.filter(m => m.goal_id === g.id);
    const gd = deposits.filter(d => d.goal_id === g.id);
    return { ...g, members: gm, deposits: gd,
      total: gd.reduce((a, d) => a + Number(d.amount || 0), 0) };
  });
  saveLocalShared();
}

  const t = e.target;
  if (!(t instanceof HTMLInputElement || t instanceof HTMLTextAreaElement)) return;
  setTimeout(() => {
    const body = t.closest('.sheet-body');
    if (!body) return;
    const tr = t.getBoundingClientRect();
    const br = body.getBoundingClientRect();
    if (tr.bottom > br.bottom - 24) {
      body.scrollBy({ top: tr.bottom - br.bottom + 48, behavior: 'smooth' });
    } else if (tr.top < br.top + 24) {
      body.scrollBy({ top: tr.top - br.top - 48, behavior: 'smooth' });
    }
  }, 350);
});

if (window.visualViewport) {
  const vv = window.visualViewport;
  const root = document.documentElement;
  let lastKb = -1, lastVvh = -1;
  const update = () => {
    const kb  = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    const vvh = Math.round(vv.height);
    if (kb === lastKb && vvh === lastVvh) return;
    lastKb = kb; lastVvh = vvh;
    root.style.setProperty('--kb', kb + 'px');
    root.style.setProperty('--vvh', vvh + 'px');
  };
  vv.addEventListener('resize', update);
  vv.addEventListener('scroll', update);
  update();
}

   ===================================================================== */
function attachHorizontalWheel(el) {
  if (!el || el._hwMounted) return;
  el._hwMounted = true;

  const updateOverflow = () => {
    const has = el.scrollWidth > el.clientWidth + 1;
    el.classList.toggle('has-overflow', has);
  };

  el.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    const canScroll = el.scrollWidth > el.clientWidth;
    if (!canScroll) return;
    const atStart = el.scrollLeft <= 0;
    const atEnd   = el.scrollLeft + el.clientWidth >= el.scrollWidth - 1;
    if ((e.deltaY < 0 && atStart) || (e.deltaY > 0 && atEnd)) return;
    e.preventDefault();
    el.scrollLeft += e.deltaY;
  }, { passive: false });

  el.addEventListener('scroll', updateOverflow, { passive: true });
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(updateOverflow);
    ro.observe(el);
    el._hwRO = ro;
  }
  setTimeout(updateOverflow, 0);
  updateOverflow();
}

function normalizeRpg() {
  if (!state.rpg) state.rpg = {};
  const r = state.rpg;
  r.xp = Number(r.xp) || 0;
  r.achievements = r.achievements || {};
  r.streak = r.streak || { current: 0, best: 0, lastDate: null };
  r.quests = r.quests || { date: null, list: [] };
  r.stats = r.stats || {};
  r.stats.daysTracked = r.stats.daysTracked || 0;
  r._dailyCounts = r._dailyCounts || { tx:0, income:0, expense:0, deposit:0, tag:0 };
  rollQuests();
}

function awardXP(amount) {
  normalizeRpg();
  const before = levelFromXp(state.rpg.xp);
  state.rpg.xp += amount;
  const after = levelFromXp(state.rpg.xp);
  if (after > before) setTimeout(() => toast(`⭐ Уровень ${after}!`, false), 500);
  checkAchievements();
}

function checkAchievements() {
  normalizeRpg();
  const unlocked = [];
  ACHIEVEMENTS.forEach(a => {
    if (state.rpg.achievements[a.id]) return;
    try { if (a.check(state)) {
      state.rpg.achievements[a.id] = new Date().toISOString();
      unlocked.push(a);
    }} catch(e) {}
  });
  if (unlocked.length) {
    state.rpg.xp += unlocked.length * 25;
    unlocked.forEach((a, i) => setTimeout(() => toast(`${a.icon} ${a.name}`, false), 700 + i * 550));
  }
}

function touchStreak() {
  normalizeRpg();
  const today = todayStr();
  const s = state.rpg.streak;
  if (s.lastDate === today) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yest = y.toISOString().slice(0,10);
  s.current = (s.lastDate === yest) ? s.current + 1 : 1;
  s.lastDate = today;
  if (s.current > s.best) s.best = s.current;
  state.rpg.stats.daysTracked = (state.rpg.stats.daysTracked || 0) + 1;
  awardXP(XP_REWARDS.streakDay);
}

const QUEST_POOL = [
  { id:'q_tx3', text:'Запиши 3 операции', target:3, get:s => s.rpg?._dailyCounts?.tx || 0 },
  { id:'q_income', text:'Запиши доход', target:1, get:s => s.rpg?._dailyCounts?.income || 0 },
  { id:'q_expense', text:'Запиши расход', target:1, get:s => s.rpg?._dailyCounts?.expense || 0 },
  { id:'q_deposit', text:'Отложи в цель', target:1, get:s => s.rpg?._dailyCounts?.deposit || 0 },
  { id:'q_tag', text:'Добавь тег к операции', target:1, get:s => s.rpg?._dailyCounts?.tag || 0 },
];
function rollQuests() {
  const today = todayStr();
  if (state.rpg.quests.date === today) return;
  const pool = [...QUEST_POOL].sort(() => Math.random() - 0.5);
  state.rpg.quests = { date: today, list: pool.slice(0,3).map(q => ({ id:q.id, done:false })) };
  state.rpg._dailyCounts = { tx:0, income:0, expense:0, deposit:0, tag:0 };
}
function bumpDaily(key, by=1) {
  normalizeRpg();
  state.rpg._dailyCounts[key] = (state.rpg._dailyCounts[key] || 0) + by;
  checkQuests();
}
function checkQuests() {
  normalizeRpg();
  (state.rpg.quests.list || []).forEach(q => {
    if (q.done) return;
    const def = QUEST_POOL.find(x => x.id === q.id);
    if (!def) return;
    if (def.get(state) >= def.target) {
      q.done = true;
      state.rpg.xp += 30;
      setTimeout(() => toast(`✅ Квест: ${def.text}`, false), 500);
    }
  });
}

const CARD_PRICE = { common:100, rare:300, epic:800 };

function normalizeGame() {
  if (!state.game || state.game.version !== 3) {
    const oldG = state.game || {};
    state.game = {
      version: 3,
      gold: Number(oldG.gold) || 0,
      upgrades: {
        atk:  Number(oldG.upgrades?.atk)  || 0,
        hp:   Number(oldG.upgrades?.hp)   || 0,
        mana: Number(oldG.upgrades?.mana) || 0,
      },
      stats: {
        totalDamage: Number(oldG.stats?.totalDamage) || 0,
        bossesKilled: Number(oldG.stats?.bossesKilled) || 0,
        enemiesKilled: Number(oldG.stats?.enemiesKilled) || 0,
        actions: Number(oldG.stats?.actions) || 0,
        kills: oldG.stats?.kills || {},
      },
      dragonSlain: !!oldG.dragonSlain,
      unlockedBosses: Math.max(1, Number(oldG.unlockedBosses) || 1),
      collection: ['strike', 'block', 'heal'],
      deck: ['strike', 'block', 'heal', null, null],
      battle: null,
    };
  }
  const g = state.game;
  g.collection = g.collection || ['strike','block','heal'];
  g.deck = Array.isArray(g.deck) ? g.deck.slice(0,5) : ['strike','block','heal',null,null];
  while (g.deck.length < 5) g.deck.push(null);
  if (!g.battle) return;
  const b = g.battle;
  b.cds = b.cds || {};
  b.log = b.log || [];
  if (typeof b.nextMult !== 'number') b.nextMult = 1;
  if (typeof b.reflect !== 'number') b.reflect = 0;
  if (typeof b.stun !== 'number') b.stun = 0;
  if (typeof b.expose !== 'number') b.expose = 0;
  if (typeof b.burnTurns !== 'number') b.burnTurns = 0;
  if (typeof b.burnDmg !== 'number') b.burnDmg = 0;
  if (typeof b.shield !== 'boolean') b.shield = false;
}

function playerStats() {
  const g = state.game;
  return {
    maxHp: 150 + (g.upgrades.hp || 0) * 50,
    atk: 15 + (g.upgrades.atk || 0) * 5,
    maxMana: 5 + (g.upgrades.mana || 0) * 2,
  };
}
function upgradeCost(type) {
  const base = { atk:100, hp:80, mana:150 }[type];
  const mult = { atk:1.4, hp:1.4, mana:1.5 }[type];
  return Math.floor(base * Math.pow(mult, state.game.upgrades[type] || 0));
}
function getEnemyDef(id) {
  return ENEMIES.find(e => e.id === id) || BOSSES.find(e => e.id === id);
}

function addLog(text) {
  const b = state.game.battle;
  if (!b) return;
  b.log.unshift(text);
  if (b.log.length > 5) b.log.length = 5;
}

function startBattle(enemyType, enemyId) {
  normalizeGame();
  const def = getEnemyDef(enemyId);
  if (!def) return;
  const stats = playerStats();
  state.game.battle = {
    enemyType, enemyId,
    enemyHp: def.hp, enemyMaxHp: def.hp, enemyAtk: def.atk,
    playerHp: stats.maxHp, playerMaxHp: stats.maxHp,
    mana: Math.min(3, stats.maxMana), manaMax: stats.maxMana,
    turn: 0, cds: {}, shield: false, reflect: 0, stun: 0,
    nextMult: 1, expose: 0, burnTurns: 0, burnDmg: 0, log: [],
  };
  addLog(`⚔️ Бой начался!`);
  save();
  renderGamePanel();
}

function playCard(cardId) {
  const b = state.game.battle;
  if (!b) return;
  const card = CARD_DEFS[cardId];
  if (!card) return;
  if (b.cds[cardId] > 0) return;
  if (b.mana < card.cost) return;
  if (b.playerHp <= 0 || b.enemyHp <= 0) return;

  b.mana -= card.cost;
  const stats = playerStats();
  const eff = card.effect || {};

  const hits = eff.hits || 1;
  let totalDmg = 0;
  if (eff.damage) {
    for (let i = 0; i < hits; i++) {
      let dmg = Math.floor(stats.atk * eff.damage * b.nextMult);
      if (eff.executeThreshold && b.enemyHp / b.enemyMaxHp < eff.executeThreshold) {
        dmg = Math.floor(dmg * (eff.executeMult || 1));
      }
      dmg = Math.max(1, dmg);
      b.enemyHp = Math.max(0, b.enemyHp - dmg);
      totalDmg += dmg;
      floatDamage('boss', dmg, false);
    }
    state.game.stats.totalDamage += totalDmg;
    addLog(`${card.icon} ${card.name}: −${totalDmg}`);
    shakeElement('#bossSprite');
  }
  b.nextMult = 1;

  if (eff.lifesteal && totalDmg > 0) {
    const heal = Math.floor(totalDmg * eff.lifesteal);
    const before = b.playerHp;
    b.playerHp = Math.min(b.playerMaxHp, b.playerHp + heal);
    const real = b.playerHp - before;
    if (real > 0) { addLog(`🩸 Лайфстил: +${real}`); floatDamage('player', real, false, true); }
  }

  if (eff.heal) {
    const heal = Math.floor(b.playerMaxHp * eff.heal);
    const before = b.playerHp;
    b.playerHp = Math.min(b.playerMaxHp, b.playerHp + heal);
    const real = b.playerHp - before;
    if (real > 0) { addLog(`💚 ${card.name}: +${real}`); floatDamage('player', real, false, true); }
  }

  if (eff.shield) { b.shield = true; addLog(`🛡 Блок активен`); }
  if (eff.reflect) { b.reflect = eff.reflect; addLog(`🌀 Отражение активно`); }
  if (eff.stun) { b.stun += eff.stun; addLog(`❄️ Враг оглушён`); }
  if (eff.nextMult) { b.nextMult = eff.nextMult; addLog(`😡 След. удар ×${eff.nextMult}`); }
  if (eff.mana) { b.mana = Math.min(b.manaMax, b.mana + eff.mana); addLog(`🔮 Мана +${eff.mana}`); }
  if (eff.selfDamage) {
    const dmg = Math.floor(b.playerMaxHp * eff.selfDamage);
    b.playerHp = Math.max(0, b.playerHp - dmg);
    addLog(`💔 Урон себе: −${dmg}`);
    floatDamage('player', dmg, false);
  }
  if (eff.selfExpose) { b.expose += eff.selfExpose; }
  if (eff.burn) {
    b.burnTurns = eff.burn.turns;
    b.burnDmg = Math.floor(stats.atk * eff.burn.mult);
    addLog(`🔥 Горение ${eff.burn.turns} хода`);
  }

  if (card.cd > 0) b.cds[cardId] = card.cd;
  Object.keys(b.cds).forEach(k => {
    if (k !== cardId && b.cds[k] > 0) b.cds[k]--;
  });

  b.mana = Math.min(b.manaMax, b.mana + 1);
  b.turn++;

  if (b.enemyHp <= 0) return winBattle();
  enemyTurn();
  if (b.playerHp <= 0) return loseBattle();

  save();
  renderGamePanel();
}

function enemyTurn() {
  const b = state.game.battle;
  const e = getEnemyDef(b.enemyId);
  if (!b || !e) return;

  if (b.stun > 0) {
    b.stun--;
    addLog(`❄️ Враг пропускает ход`);
    return;
  }

  if (b.burnTurns > 0) {
    b.enemyHp = Math.max(0, b.enemyHp - b.burnDmg);
    b.burnTurns--;
    addLog(`🔥 Горение: −${b.burnDmg}`);
    floatDamage('boss', b.burnDmg, false);
    if (b.enemyHp <= 0) return winBattle();
  }

  /* 🔥 Накал: каждые 4 хода +20% к урону (стакается) */
  const rageStacks = Math.floor(b.turn / 4);
  const rageMult = 1 + rageStacks * 0.20;

  let hits = 1;
  let note = '';
  if (e.gimmick === 'double-3' && b.turn % 3 === 0) { hits = 2; note = ' (двойной!)'; }
  if (e.gimmick === 'double-4' && b.turn % 4 === 0) { hits = 2; note = ' (двойной!)'; }
  if (e.gimmick === 'rage' && b.enemyHp / b.enemyMaxHp < 0.3) { hits = 2; note = ' (в ярости!)'; }
  if (e.gimmick === 'vampire') {
    const heal = Math.floor(e.hp * 0.03);
    b.enemyHp = Math.min(e.hp, b.enemyHp + heal);
    addLog(`🧛 Вампир высасывает ${heal}`);
  }

  hits += b.expose;
  b.expose = 0;

  if (rageStacks > 0 && hits > 0) {
    note += ` · 🔥+${rageStacks*20}%`;
  }

  let totalDmg = 0;
  for (let i = 0; i < hits; i++) {
    if (b.enemyHp <= 0) break;
    const variance = 0.8 + Math.random() * 0.4;
    let dmg = Math.max(1, Math.floor(e.atk * variance * rageMult));

    if (b.reflect > 0) {
      const rd = Math.floor(dmg * b.reflect);
      b.enemyHp = Math.max(0, b.enemyHp - rd);
      addLog(`🌀 Отражено: −${rd}`);
      floatDamage('boss', rd, false);
      b.reflect = 0;
      continue;
    }
    if (b.shield) {
      b.shield = false;
      addLog(`🛡 Блок поглотил ${dmg}`);
      continue;
    }
    b.playerHp = Math.max(0, b.playerHp - dmg);
    totalDmg += dmg;
    floatDamage('player', dmg, false);
  }
  if (totalDmg > 0) {
    addLog(`💀 ${e.name}: −${totalDmg} тебе${note}`);
    shakeElement('#playerCard');
  }
  if (b.enemyHp <= 0) return winBattle();
}

function winBattle() {
  const b = state.game.battle;
  const g = state.game;
  const def = getEnemyDef(b.enemyId);
  if (!def) return;

  g.gold += def.gold;
  g.stats.actions += b.turn;
  if (b.enemyType === 'boss') {
    g.stats.bossesKilled++;
    g.stats.kills[def.id] = true;
    if (def.id === 'debt') g.dragonSlain = true;
    const idx = BOSSES.findIndex(x => x.id === def.id);
    if (idx >= 0 && idx + 1 >= g.unlockedBosses && idx + 1 < BOSSES.length) {
      g.unlockedBosses = idx + 2;
    }
    if (def.card && !g.collection.includes(def.card)) {
      g.collection.push(def.card);
      toast(`🃏 Новая карта: ${CARD_DEFS[def.card].name}!`, false);
    }
  } else {
    g.stats.enemiesKilled++;
    if (Math.random() < 0.12) {
      const pool = Object.keys(CARD_DEFS).filter(id => !g.collection.includes(id) && CARD_DEFS[id].rarity === 'common');
      if (pool.length) {
        const pick = pool[Math.floor(Math.random() * pool.length)];
        g.collection.push(pick);
        toast(`🃏 Дроп: ${CARD_DEFS[pick].name}!`, false);
      }
    }
  }

  const xp = def.xp || 0;
  if (xp) awardXP(xp);
  toast(`🏆 Победа! +${def.gold}💰 +${xp} XP`, false);
  g.battle = null;
  checkAchievements();
  save();
  renderGamePanel();
}

function loseBattle() {
  const b = state.game.battle;
  const g = state.game;
  const lost = Math.floor(g.gold * 0.15);
  g.gold = Math.max(0, g.gold - lost);
  g.stats.actions += b.turn;
  toast(`💀 Поражение... −${lost}💰`, false);
  g.battle = null;
  save();
  renderGamePanel();
}

function buyUpgrade(type) {
  normalizeGame();
  const g = state.game;
  const cost = upgradeCost(type);
  if (g.gold < cost) { toast('Не хватает золота', false); return; }
  g.gold -= cost;
  g.upgrades[type] = (g.upgrades[type] || 0) + 1;
  save(); haptic(12);
  toast('Улучшение куплено!');
  renderGamePanel();
}

function buyCard(cardId) {
  normalizeGame();
  const g = state.game;
  if (g.collection.includes(cardId)) return;
  const def = CARD_DEFS[cardId];
  if (!def) return;
  const price = CARD_PRICE[def.rarity] || 100;
  if (g.gold < price) { toast('Не хватает золота', false); return; }
  g.gold -= price;
  g.collection.push(cardId);
  save(); haptic(12);
  toast(`🃏 Куплено: ${def.name}`);
  renderGamePanel();
}

function setDeckSlot(slotIndex, cardId) {
  normalizeGame();
  const g = state.game;
  if (cardId === null || cardId === undefined) {
    g.deck[slotIndex] = null;
  } else {
    if (!g.collection.includes(cardId)) return;
    g.deck = g.deck.map((c, i) => (c === cardId && i !== slotIndex ? null : c));
    g.deck[slotIndex] = cardId;
  }
  save();
  renderGamePanel();
}

function fleeBattle() {
  if (!state.game.battle) return;
  if (!confirm('Сбежать из боя? Прогресс боя сбросится.')) return;
  state.game.battle = null;
  save();
  renderGamePanel();
}

function floatDamage(target, dmg, crit, isHeal) {
  const parent = target === 'boss'
    ? document.querySelector('#bossSpriteWrap')
    : document.querySelector('#playerCard');
  if (!parent) return;
  const el = document.createElement('div');
  el.className = 'dmg-float' + (crit ? ' crit' : '');
  if (isHeal) el.style.color = 'var(--green)';
  el.textContent = (isHeal ? '+' : (crit ? '💥 -' : '-')) + dmg;
  parent.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

function shakeElement(sel) {
  const el = document.querySelector(sel);
  if (!el) return;
  el.classList.add('shake');
  setTimeout(() => el.classList.remove('shake'), 320);
}

      .filter(x => x.type === 'expense' && sameMonth(x.date, m))
      .reduce((a, x) => a + x.amount, 0);
    return { date: m, sum };
  });
  const maxSum = Math.max(1, ...data.map(d => d.sum));
  const barH = 100;
  const avg = data.reduce((a, d) => a + d.sum, 0) / 6;
  return `

          const h = Math.max(4, Math.round(d.sum / maxSum * barH));

          const cur = i === data.length - 1;
          return `

              <div class="chart-bar ${cur ? 'current' : ''}" style="height:${h}px" title="${fmt(d.sum)}"></div>

function forecastForGoal(g) {
  const bd = goalBreakdown(g);
  if (bd.remaining <= 0) return null;
  const created = new Date(g.createdAt || new Date().toISOString());
  const now = new Date();
  const daysSinceCreated = Math.max(1, (now - created) / (1000*60*60*24));
  const monthsSinceCreated = daysSinceCreated / 30.44;
  if (monthsSinceCreated < 0.5) return null;
  if (bd.saved < 1) return null;
  const rate = bd.saved / monthsSinceCreated;
  if (rate < 1) return null;
  const monthsToFinish = bd.remaining / rate;
  const forecastDate = new Date(now.getTime() + monthsToFinish * 30.44 * 24*60*60*1000);
  const extra = 50;
  const monthsToFinishWithExtra = bd.remaining / (rate + extra);
  const savedMonths = Math.round(monthsToFinish - monthsToFinishWithExtra);
  return { forecastDate, monthsToFinish, savedMonths: savedMonths >= 1 ? savedMonths : 0 };
}

function goalCard(g, opts = {}) {
  const compact = !!opts.compact;
  const archived = !!g.archived;
  const bd = goalBreakdown(g);
  const { target, saved, remaining } = bd;
  const pct = target > 0 ? Math.min(100, saved / target * 100) : 0;
  const months = monthsUntil(g.deadline);
  const perMonth = months > 0 ? remaining / months : remaining;
  const done = remaining <= 0;
  const dl = new Date(g.deadline + 'T00:00:00');
  const dlText = isNaN(dl) ? '—' : dl.toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' });
  const subSum = (g.subgoals || []).reduce((a,s) => a + (Number(s.amount) || 0), 0);
  const forecast = (!compact && !archived) ? forecastForGoal(g) : null;
  const autoPct = Number(g.autoSavePercent) || 0;

  return `
    <div class="card" style="margin-top:14px">
      <div class="goal-head">
        <div style="min-width:0">
          <div class="goal-title">${esc(g.title)}</div>
          <div class="goal-deadline">
            ${archived ? `архивирована ${g.archivedAt ? humanDate(g.archivedAt.slice(0,10)) : ''}` : `до ${dlText} · ${months > 0 ? months + ' ' + plural(months,'месяц','месяца','месяцев') : 'срок вышел'}`}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex:0 0 auto">
          ${archived ? `<span class="archived-badge">Архив</span>` : done ? `<span class="goal-done-badge">Готово 🎉</span>` : ''}
          ${!archived ? `<button class="icon-btn" data-action="edit-goal" data-id="${g.id}" title="Редактировать">✏️</button>` : ''}
          <button class="icon-btn" data-action="del-goal" data-id="${g.id}">✕</button>
        </div>
      </div>
      <div class="goal-nums">
        <span><b>${fmt(saved)}</b> <span style="color:var(--muted)">из ${fmt(target)}</span></span>
        <span style="color:var(--muted)">${Math.round(pct)}%</span>
      </div>
      <div class="bar"><div class="bar-fill ${done ? 'green' : ''}" style="width:${pct}%"></div></div>

      <div class="goal-plan">
        ${done ? `<span>Цель закрыта 🎉</span>` :
          `<span>Осталось: <b>${fmt(remaining)}</b></span>
           <span>В месяц: <b>${fmt(perMonth)}</b></span>`}
      </div>

      ${forecast ? `
        <div class="forecast">
          <div>Прогноз закрытия: <b>${forecast.forecastDate.toLocaleDateString('ru-RU', { day:'numeric', month:'short', year:'numeric' })}</b></div>
          ${forecast.savedMonths > 0 ? `<div>Если +50 ${state.currency}/мес — <b>на ${forecast.savedMonths} ${plural(forecast.savedMonths,'месяц','месяца','месяцев')} раньше</b></div>` : ''}
        </div>
      ` : ''}

      ${!compact && !archived ? `
        <div class="auto-save-row ${autoPct > 0 ? 'on' : ''}" data-action="edit-autosave" data-id="${g.id}">
          <span style="font-size:18px">🔄</span>
          <span class="label">Авто-отчисление от доходов</span>
          <span class="status">${autoPct > 0 ? autoPct + '%' : 'Выкл'}</span>
        </div>
        <div class="auto-save-row ${g.virtual ? 'on' : ''}" data-action="toggle-virtual" data-id="${g.id}" title="Вклады в цель не будут записываться как расход">
          <span style="font-size:18px">👻</span>
          <span class="label">Виртуальная копилка</span>
          <span class="status">${g.virtual ? 'Вкл' : 'Выкл'}</span>
        </div>
      ` : ''}

      ${!compact && (g.subgoals && g.subgoals.length) ? `
        <div class="subgoals">
          <div class="section-title" style="margin:0 0 10px">Подцели</div>
          ${g.subgoals.map(s => {
            const spent = !!s.spentAt;
            const doneCls = s.done ? 'done' : '';
            const spentCls = spent ? 'spent' : '';
            return `
              <div class="subgoal ${doneCls} ${spentCls}">
                <input type="checkbox" data-action="toggle-sub" data-goal="${g.id}" data-sub="${s.id}" ${s.done ? 'checked' : ''}>
                <span class="t">${esc(s.title)}</span>
                <span class="a">${s.amount ? fmt(s.amount) : ''}</span>
                ${spent ? `<span class="spent-badge">расход ✓</span>` : ''}
                ${!archived ? `<div class="subgoal-actions">
                  ${!spent ? `<button class="icon-btn" data-action="spend-sub" data-goal="${g.id}" data-sub="${s.id}" title="Записать как расход">💸</button>` : ''}
                  <button class="icon-btn" data-action="del-sub" data-goal="${g.id}" data-sub="${s.id}">✕</button>
                </div>` : ''}
              </div>
            `;
          }).join('')}
          ${subSum > 0 ? `<div class="hint">План по подцелям: ${fmt(subSum)}${subSum > target ? ` — больше цели на ${fmt(subSum - target)}` : ''}</div>` : ''}
        </div>
      ` : ''}

      ${!compact && !archived && !(g.subgoals && g.subgoals.length) ? `
        <div class="hint">Разбей цель на подцели — виза, билеты, техника. Это чеклист, он не влияет на прогресс. Каждую можно записать как расход.</div>
      ` : ''}

      ${!compact && !archived ? `
        <form class="sub-add" data-goal="${g.id}">
          <input name="title" placeholder="Подцель: виза, билеты…" required>
          <input name="amount" type="number" step="0.01" min="0" inputmode="decimal" placeholder="Сумма" required>
          <button class="btn sm" type="submit" aria-label="Добавить подцель">+</button>
        </form>
      ` : ''}

      ${!compact && !archived && !done ? `
        <form class="deposit-row" data-goal="${g.id}" novalidate>
          <input name="amount" type="number" step="0.01" min="0"
                 inputmode="decimal" placeholder="Отложить (макс. ${fmt(remaining)})">
          <button class="btn primary sm" type="submit">Отложить</button>
        </form>
      ` : ''}

      ${!compact && !archived && done ? `
        <div class="hint" style="margin-top:12px;text-align:center;color:var(--green)">
          Цель полностью закрыта — можно убрать в архив
        </div>
      ` : ''}

      ${!compact ? `
        <div class="goal-actions">
          ${archived
            ? `<button class="btn ghost sm" data-action="unarchive-goal" data-id="${g.id}">Вернуть из архива</button>`
            : `<button class="btn ghost sm" data-action="archive-goal" data-id="${g.id}">${done ? 'В архив' : 'Архивировать'}</button>`}
        </div>
      ` : ''}
    </div>
  `;
}

function sharedGoalCard(g) {
  const total = g.total || 0;
  const remaining = Math.max(0, g.target - total);
  const pct = Math.min(100, total / g.target * 100);
  const isOwner = g.owner_id === currentUser?.id;
  const done = remaining <= 0;
  const dl = g.deadline ? new Date(g.deadline + 'T00:00:00') : null;
  const dlText = dl && !isNaN(dl) ? dl.toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' }) : '—';
  const months = g.deadline ? monthsUntil(g.deadline) : 0;
  const perMonth = months > 0 ? remaining / months : remaining;
  return `
    <div class="card" style="margin-top:14px">
      <div class="goal-head">
        <div style="min-width:0">
          <div class="goal-title">${esc(g.title)} <span class="badge" style="margin-left:6px">👥 ${g.members.length}</span></div>
          <div class="goal-deadline">до ${dlText} · ${months > 0 ? months + ' ' + plural(months,'месяц','месяца','месяцев') : 'срок вышел'}</div>
        </div>
        <button class="icon-btn" data-action="${isOwner ? 'del-shared' : 'leave-shared'}" data-id="${g.id}">✕</button>
      </div>
      <div class="goal-nums">
        <span><b>${fmt(total)}</b> <span style="color:var(--muted)">из ${fmt(g.target)}</span></span>
        <span style="color:var(--muted)">${Math.round(pct)}%</span>
      </div>
      <div class="bar"><div class="bar-fill ${done ? 'green' : ''}" style="width:${pct}%"></div></div>
      <div class="goal-plan">
        ${done ? `<span>🎉 Цель закрыта</span>` :
          `<span>Осталось: <b>${fmt(remaining)}</b></span>
           ${months > 0 ? `<span>В месяц: <b>${fmt(perMonth)}</b></span>` : ''}`}
      </div>
      <div class="subgoals" style="border-top:1px dashed var(--border)">
        <div class="section-title" style="margin:0 0 10px">Вклады</div>
        ${g.deposits.length === 0 ? `<div class="hint">Пока никто не отложил.</div>` :
          g.deposits.slice(0, 12).map(d => {
            const m = g.members.find(x => x.user_id === d.user_id);
            const name = (m?.email || '?').split('@')[0];
            return `
              <div style="display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--border)">
                <span style="flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(name)}${d.note ? ` · ${esc(d.note)}` : ''}</span>
                <span style="font-size:13px;font-variant-numeric:tabular-nums">${fmt(d.amount)}</span>
                ${d.user_id === currentUser?.id ? `<button class="icon-btn" data-action="del-shared-deposit" data-goal="${g.id}" data-id="${d.id}">✕</button>` : ''}
              </div>`;
          }).join('')}
      </div>
      <form class="deposit-row" data-shared="${g.id}" style="margin-top:12px">
        <input name="amount" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="Сумма">
        <button class="btn primary sm" type="submit">Отложить</button>
      </form>
      <button class="btn ghost sm block" data-action="show-invite" data-code="${g.invite_code}" style="margin-top:10px">
        Пригласить · код ${g.invite_code}
      </button>
    </div>
  `;
}

VIEWS.goals = () => {
  const active = activeGoals();
  const archived = archivedGoals();
  const totalTarget = active.reduce((a,g) => a + g.target, 0);
  const totalSaved  = active.reduce((a,g) => a + goalSaved(g), 0);

  return `
    <div class="chips" style="margin-bottom:16px">
      <button class="chip ${goalsView==='active'?'active':''}" data-goals-view="active">Активные (${active.length})</button>
      <button class="chip ${goalsView==='archive'?'active':''}" data-goals-view="archive">Архив (${archived.length})</button>
    </div>

    ${goalsView === 'active' ? `
      ${active.length ? `
        <div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:8px">
          <div class="card stat">
            <div class="lbl">Всего нужно</div>
            <div class="val">${fmt(totalTarget)}</div>
            <div class="sub">${active.length} ${plural(active.length,'цель','цели','целей')}</div>
          </div>
          <div class="card stat">
            <div class="lbl">Уже отложено</div>
            <div class="val pos">${fmt(totalSaved)}</div>
            <div class="sub">${totalTarget ? Math.round(totalSaved/totalTarget*100) : 0}% от всех целей</div>
          </div>
        </div>
        <div class="section-title">Мои цели</div>
        ${active.map(g => goalCard(g)).join('')}
      ` : `
        <div class="card"><div class="empty">
          <div class="big">🎯</div>
          <p>Активных целей нет. Нажми <b>+</b> внизу — приложение само посчитает, сколько откладывать в месяц.</p>
        </div></div>
      `}
    ` : `
      ${archived.length ? `
        ${archived.map(g => goalCard(g)).join('')}
      ` : `
        <div class="card"><div class="empty">
          <div class="big">📦</div>
          <p>В архиве пусто. Сюда попадут цели, которые ты уберёшь из активных.</p>
        </div></div>
      `}
    `}

    ${goalsView === 'active' ? `
      <div class="section-title">Общие цели</div>
      ${sharedGoals.length === 0 ? `
        <div class="card"><div class="empty" style="padding:28px 16px">
          <div class="big" style="font-size:30px">👥</div>
          <p style="font-size:13.5px">Копите вместе с друзьями: создай общую цель и отправь код, или присоединись по чужому коду.</p>
          <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
            <button class="btn primary sm" data-action="new-shared">+ Создать</button>
            <button class="btn ghost sm" data-action="join-shared">Присоединиться</button>
          </div>
        </div></div>
      ` : `
        ${sharedGoals.map(g => sharedGoalCard(g)).join('')}
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn primary sm" data-action="new-shared" style="flex:1">+ Создать</button>
          <button class="btn ghost sm" data-action="join-shared" style="flex:1">Присоединиться</button>
        </div>
      `}
    ` : ''}
  `;
};

VIEWS.notes = () => {
  if (state.notes.length === 0) {
    return `
      <div class="card"><div class="empty">
        <div class="big">📝</div>
        <p>Заметки — про всё, что не деньги: что взять в поездку, какой язык подтянуть, к какому числу сделать визу.</p>
        <button class="btn primary" data-action="new-note">+ Создать заметку</button>
      </div></div>
    `;
  }
  return `
    <button class="btn primary" data-action="new-note" style="margin-bottom:16px">+ Новая заметка</button>
    ${state.notes.map(n => `
      <div class="card note-card" data-note="${n.id}">
        <button class="icon-btn note-del" data-action="del-note" data-id="${n.id}">✕</button>
        <input class="note-title" data-note-field="title" data-id="${n.id}" value="${esc(n.title)}" placeholder="Заголовок">
        <textarea data-note-field="text" data-id="${n.id}" placeholder="Текст…">${esc(n.text)}</textarea>
      </div>
    `).join('')}
  `;
};
MOUNTS.notes = () => {
  document.querySelectorAll('[data-note-field]').forEach(el => {
    el.addEventListener('input', () => {
      const n = state.notes.find(x => x.id === el.dataset.id);
      if (!n) return;
      n[el.dataset.noteField] = el.value;
      n.updated = new Date().toISOString();
      save();
    });
  });
};

VIEWS.profile = () => {
  normalizeRpg();
  const xp = state.rpg.xp;
  const level = levelFromXp(xp);
  const xpCur = xp - xpForLevel(level);
  const xpNext = xpForLevel(level + 1) - xpForLevel(level);
  const pct = xpNext > 0 ? Math.min(100, xpCur / xpNext * 100) : 100;
  const unlocked = Object.keys(state.rpg.achievements).length;
  const total = ACHIEVEMENTS.length;
  const s = state.rpg.streak;
  const quests = state.rpg.quests.list || [];

  return `
    <div class="card" style="background:linear-gradient(135deg,rgba(79,140,255,.15),rgba(122,168,255,.04))">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px">
        <div style="width:72px;height:72px;flex:0 0 72px;border-radius:50%;
          background:linear-gradient(135deg,#4f8cff,#7aa8ff);color:#fff;
          display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;
          box-shadow:0 10px 30px -8px rgba(79,140,255,.6)">${level}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:18px;font-weight:700;margin-bottom:2px">Уровень ${level}</div>
          <div style="font-size:12.5px;color:var(--muted)">${xp} XP · ещё ${Math.max(0, xpNext - xpCur)} до ур. ${level+1}</div>
        </div>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px">
      <div class="card stat">
        <div class="lbl">🔥 Серия</div>
        <div class="val">${s.current}</div>
        <div class="sub">рекорд ${s.best}</div>
      </div>
      <div class="card stat">
        <div class="lbl">🏆 Ачивки</div>
        <div class="val">${unlocked}/${total}</div>
        <div class="sub">${Math.round(unlocked/total*100)}%</div>
      </div>
      <div class="card stat">
        <div class="lbl">📅 Дней</div>
        <div class="val">${state.rpg.stats.daysTracked || 0}</div>
        <div class="sub">с приложением</div>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="section-title" style="margin-top:0">Квесты на сегодня</div>
      ${quests.length === 0 ? `<div class="hint">Квесты появятся после первой операции.</div>` :
        quests.map(q => {
          const def = QUEST_POOL.find(x => x.id === q.id);
          if (!def) return '';
          const cur = Math.min(def.get(state), def.target);
          return `
            <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
              <div style="font-size:20px">${q.done ? '✅' : '⏳'}</div>
              <div style="flex:1;min-width:0">
                <div style="font-size:14px;${q.done ? 'text-decoration:line-through;color:var(--green)' : ''}">${def.text}</div>
                <div class="hint" style="margin:2px 0 0">${cur}/${def.target} · +30 XP</div>
              </div>
            </div>`;
        }).join('')}
    </div>

    <div class="section-title">Достижения</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px">
      ${ACHIEVEMENTS.map(a => {
        const un = !!state.rpg.achievements[a.id];
        return `
          <div class="card" style="padding:12px 8px;text-align:center;
            ${un ? 'border-color:rgba(79,140,255,.4);background:rgba(79,140,255,.06)' : 'opacity:.4'}"
            title="${esc(a.desc)}">
            <div style="font-size:26px;margin-bottom:6px">${a.icon}</div>
            <div style="font-size:11.5px;font-weight:600;line-height:1.2">${esc(a.name)}</div>
          </div>`;
      }).join('')}
    </div>

    <div class="card" style="margin-top:14px">
      <div class="section-title" style="margin-top:0">Как получать XP</div>
      <div class="hint" style="margin:0;line-height:1.8">
        • Операция — <b>+5 XP</b> (доход <b>+8</b>)<br>
        • Отложить в цель — <b>+12 XP</b><br>
        • Новая цель — <b>+20 XP</b><br>
        • Своя категория — <b>+15 XP</b><br>
        • Бюджет — <b>+15 XP</b><br>
        • Заметка — <b>+10 XP</b><br>
        • Регулярный — <b>+10 XP</b><br>
        • День подряд — <b>+20 XP</b><br>
        • Квест — <b>+30 XP</b><br>
        • Ачивка — <b>+25 XP</b><br>
        • Победа над боссом — <b>+60…+1800 XP</b>
      </div>
    </div>
  `;
};

let gameTab = 'battle'; // battle | deck | shop

VIEWS.game = () => {
  normalizeGame();
  const g = state.game;
  const stats = playerStats();

  if (g.battle) {
    return renderBattleScreen();
  }

  const chips = `
    <div class="chips" style="margin-bottom:16px">
      <button class="chip ${gameTab==='battle'?'active':''}" data-game-tab="battle">⚔️ Бой</button>
      <button class="chip ${gameTab==='deck'?'active':''}" data-game-tab="deck">🃏 Колода</button>
      <button class="chip ${gameTab==='shop'?'active':''}" data-game-tab="shop">🛒 Магазин</button>
    </div>
  `;

  if (gameTab === 'battle') {
    return chips + `
      <div class="card" style="background:linear-gradient(135deg,rgba(79,140,255,.12),transparent)">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <div style="font-weight:700;font-size:15px">🧙 Твой боец</div>
          <div style="font-weight:700;color:var(--yellow)">${g.gold}💰</div>
        </div>
        <div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px">
          <div><div class="hint" style="margin:0">❤️ HP</div><div style="font-weight:700;font-size:16px">${stats.maxHp}</div></div>
          <div><div class="hint" style="margin:0">⚔️ ATK</div><div style="font-weight:700;font-size:16px">${stats.atk}</div></div>
          <div><div class="hint" style="margin:0">🔮 Мана</div><div style="font-weight:700;font-size:16px">${stats.maxMana}</div></div>
        </div>
      </div>

      <div class="section-title">🎯 Кампания</div>
      <div class="card" style="padding:0 18px">
        ${BOSSES.map((boss, i) => {
          const unlocked = i < g.unlockedBosses;
          const killed = g.stats.kills?.[boss.id];
          const nextToKill = unlocked && !killed;
          return `
            <div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);${!unlocked ? 'opacity:.4' : ''}">
              <div style="font-size:28px">${boss.icon}</div>
              <div style="flex:1;min-width:0">
                <div style="font-weight:600;font-size:14px">${esc(boss.name)}${killed ? ' ✓' : ''}</div>
                <div class="hint" style="margin:2px 0 0">HP ${boss.hp} · ATK ${boss.atk} · +${boss.gold}💰 +${boss.xp}XP${boss.card ? ` · 🃏` : ''}</div>
              </div>
              ${unlocked
                ? `<button class="btn ${nextToKill?'primary':'ghost'} sm" data-fight="boss" data-id="${boss.id}">Бой</button>`
                : '<span style="color:var(--muted);font-size:18px">🔒</span>'}
            </div>`;
        }).join('')}
      </div>

      <div class="section-title">🦠 Тренировка</div>
      <div class="card" style="padding:0 18px">
        ${ENEMIES.map(e => `
          <div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)">
            <div style="font-size:26px">${e.icon}</div>
            <div style="flex:1;min-width:0">
              <div style="font-weight:600;font-size:14px">${esc(e.name)}</div>
              <div class="hint" style="margin:2px 0 0">HP ${e.hp} · ATK ${e.atk} · +${e.gold}💰 +${e.xp}XP · 🃏 12%</div>
            </div>
            <button class="btn ghost sm" data-fight="enemy" data-id="${e.id}">Бой</button>
          </div>`).join('')}
      </div>

      <div class="hint" style="margin-top:14px;text-align:center">
        💡 Реальные операции дают золото: <b>+2💰</b> за расход, <b>+5💰</b> за доход, <b>+10💰</b> за вклад в цель.<br>
⏱ Каждые <b>4 хода</b> враг бьёт на <b>+20%</b> сильнее — не затягивай бой.
      </div>
    `;

  if (gameTab === 'deck') {
    return chips + `
      <div class="section-title" style="margin-top:0">Твоя колода · ${g.deck.filter(x=>x).length}/5</div>
      <div class="slot-row">
        ${g.deck.map((cardId, i) => {
          if (!cardId) return `<button class="deck-slot" data-slot="${i}"><span class="ds-plus">+</span></button>`;
          const c = CARD_DEFS[cardId];

            <span class="ds-icon">${c.icon}</span>
            <span class="ds-name">${esc(c.name)}</span>
          </button>`;
        }).join('')}
      </div>
      <div class="hint" style="margin-top:10px">Тапни слот — выбрать карту. Тапни занятый — заменить или убрать.</div>

      <div class="section-title">Коллекция · ${g.collection.length}/${Object.keys(CARD_DEFS).length}</div>

        ${Object.entries(CARD_DEFS).map(([id, c]) => {
          const owned = g.collection.includes(id);

            <div class="card-mini rarity-${c.rarity} ${owned ? '' : 'owned'}" ${owned ? `data-pool-card="${id}"` : ''}>
              <div class="cm-head">
                <span class="cm-icon">${c.icon}</span>
                <span class="cm-name">${esc(c.name)}</span>
              </div>
              <div class="cm-desc">${esc(c.desc)}</div>
              <div class="cm-cost">${c.cost > 0 ? '🔮' + c.cost : '🔮 бесплатно'}${c.cd ? ` · CD ${c.cd}` : ''}${inDeck ? ' · в колоде' : ''}</div>
            </div>`;
        }).join('')}
      </div>
    `;
  }

  return chips + `
    <div class="section-title" style="margin-top:0">Улучшения</div>
    <div class="card">
      ${renderUpgradeRow('atk', '⚔️ Атака +5', playerStats().atk)}
      ${renderUpgradeRow('hp', '❤️ Макс. HP +50', playerStats().maxHp)}
      ${renderUpgradeRow('mana', '🔮 Макс. мана +2', playerStats().maxMana)}
    </div>

    <div class="section-title">Карточки · ${g.gold}💰</div>
    <div class="card-pool">
      ${Object.entries(CARD_DEFS).map(([id, c]) => {
        const owned = g.collection.includes(id);
        const price = CARD_PRICE[c.rarity];
        const canBuy = !owned && g.gold >= price;
        return `
          <div class="card-mini rarity-${c.rarity} ${owned ? 'owned' : ''}">
            <div class="cm-head">
              <span class="cm-icon">${c.icon}</span>
              <span class="cm-name">${esc(c.name)}</span>
            </div>
            <div class="cm-desc">${esc(c.desc)}</div>
            <div class="cm-cost" style="display:flex;justify-content:space-between;align-items:center">
              <span>${c.cost > 0 ? '🔮' + c.cost : '🔮0'}${c.cd ? ` · CD ${c.cd}` : ''}</span>
              ${owned ? '<span style="color:var(--green)">✓</span>'
                : `<button class="btn ${canBuy?'primary':'ghost'} sm" style="padding:4px 8px;font-size:11px" data-buy-card="${id}" ${canBuy?'':'disabled'}>${price}💰</button>`}
            </div>
          </div>`;
      }).join('')}
    </div>
  `;
};

function renderUpgradeRow(type, label, currentValue) {
  const cost = upgradeCost(type);
  const can = state.game.gold >= cost;
  return `
    <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:14px">${label}</div>
        <div class="hint" style="margin:2px 0 0">Сейчас: ${currentValue} · Цена: ${cost}💰</div>
      </div>
      <button class="btn ${can ? 'primary' : 'ghost'} sm" data-buy-upgrade="${type}" ${can ? '' : 'disabled'}>Купить</button>
    </div>
  `;
}

function renderBattleScreen() {
  const b = state.game.battle;
  const e = getEnemyDef(b.enemyId);
  const hpPct = Math.max(0, b.playerHp / b.playerMaxHp * 100);
  const bossPct = Math.max(0, b.enemyHp / b.enemyMaxHp * 100);
  const manaPct = b.manaMax > 0 ? Math.min(100, b.mana / b.manaMax * 100) : 0;
  const isBoss = b.enemyType === 'boss';

  const statuses = [];
  if (b.shield) statuses.push('🛡');
  if (b.reflect > 0) statuses.push('🌀');
  if (b.stun > 0) statuses.push('❄️');
  if (b.nextMult > 1) statuses.push('😡×' + b.nextMult);
  if (b.burnTurns > 0) statuses.push('🔥' + b.burnTurns);

  return `
    <div class="game-arena">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px">
        <button class="btn ghost sm" id="fleeBtn">← Сбежать</button>
        <div style="font-weight:700;color:var(--yellow)">${state.game.gold}💰</div>
      </div>

      <div class="card" id="bossCard" style="background:linear-gradient(135deg,rgba(255,92,122,.12),transparent);position:relative">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px">
          <div style="font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.icon} ${esc(e.name)}${isBoss?' 💀':''}</div>
          ${(() => {
  const stacks = Math.floor(b.turn / 4);
  const rage = stacks * 20;
  return `<div style="font-size:12.5px;color:var(--muted);flex:0 0 auto">ATK ${e.atk}${rage > 0 ? ` · <span style="color:var(--red)">🔥+${rage}%</span>` : ''}</div>`;
})()}
        </div>
        <div id="bossSpriteWrap" style="text-align:center;position:relative;padding:14px 0">
          <div id="bossSprite" style="font-size:70px;line-height:1;display:inline-block;user-select:none">${e.icon}</div>
        </div>
        <div class="bar" style="height:12px"><div class="bar-fill" style="width:${bossPct}%;background:linear-gradient(90deg,#ff5c7a,#ff8da1)"></div></div>
        <div class="hint" style="margin-top:6px">💀 ${b.enemyHp} / ${b.enemyMaxHp}</div>
      </div>

      <div class="card" id="playerCard" style="background:linear-gradient(135deg,rgba(61,220,151,.12),transparent);position:relative;margin-top:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px">
          <div style="font-weight:700">🧙 Ты</div>
          <div style="font-size:14px">${statuses.join(' ')}</div>
        </div>
        <div class="bar" style="height:12px"><div class="bar-fill green" style="width:${hpPct}%"></div></div>
        <div class="hint" style="margin-top:6px">❤️ ${b.playerHp} / ${b.playerMaxHp}</div>
        <div class="bar" style="height:9px;margin-top:8px"><div class="bar-fill" style="width:${manaPct}%;background:linear-gradient(90deg,#7aa8ff,#4f8cff)"></div></div>
        <div class="hint" style="margin-top:6px">🔮 ${b.mana} / ${b.manaMax}</div>
      </div>

      ${b.log.length ? `
        <div class="card" style="margin-top:14px;padding:10px 14px">
          ${b.log.map(l => `<div style="font-size:12px;color:var(--muted);margin-bottom:2px">${l}</div>`).join('')}
        </div>
      ` : ''}

      <div class="section-title">Твой ход</div>
      <div class="battle-deck">
        ${state.game.deck.map(cardId => {
          if (!cardId) return '<div></div>';
          const c = CARD_DEFS[cardId];
          const cd = b.cds[cardId] || 0;
          const canPlay = !cd && b.mana >= c.cost;
          return `
            <button class="battle-card rarity-${c.rarity}" data-play="${cardId}" ${canPlay ? '' : 'disabled'}>
              <div class="bc-icon">${c.icon}</div>
              <div class="bc-name">${esc(c.name)}</div>
              <div class="bc-cost">${c.cost > 0 ? '🔮' + c.cost : '—'}</div>
              ${cd ? `<div class="bc-cd">${cd}</div>` : ''}
            </button>`;
        }).join('')}
      </div>
    </div>
  `;
}

MOUNTS.game = () => {

      haptic(5);

      startBattle(el.dataset.fight, el.dataset.id);
    });
  });
  document.querySelectorAll('[data-play]').forEach(el => {
    el.addEventListener('click', () => {

      playCard(el.dataset.play);
    });
  });

  document.querySelectorAll('[data-buy-upgrade]').forEach(b => {

  });

      }

        toast('Колода полна — убери карту сначала', false);
        return;
      }
      setDeckSlot(emptyIdx, cardId);
      haptic(10);
      toast('Добавлено в колоду');
    });
  });
};

function openDeckSlotSheet(slotIndex) {
  normalizeGame();
  const g = state.game;
  const current = g.deck[slotIndex];
  const html = `
    <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
    <div class="sheet-header"><h2>Слот ${slotIndex + 1}</h2>
      <button class="sheet-close" data-action="close-sheet">✕</button></div>
    <div class="sheet-body">
      ${current ? `<div class="hint" style="margin-top:0">Сейчас в слоте: <b>${esc(CARD_DEFS[current].name)}</b></div>` : ''}
      <button class="ctx-item" data-deck-pick-slot="${slotIndex}" data-deck-pick="">
        <span class="ico">🚫</span><span>Очистить слот</span>
      </button>
      <div class="section-title" style="margin:14px 0 10px">Выбрать карту</div>
      ${g.collection.map(id => {
        const c = CARD_DEFS[id];
        if (!c) return '';
        const inOtherSlot = g.deck.some((x, i) => x === id && i !== slotIndex);
        return `
          <button class="ctx-item" data-deck-pick-slot="${slotIndex}" data-deck-pick="${id}">
            <span class="ico">${c.icon}</span>
            <span style="flex:1">${esc(c.name)}${inOtherSlot ? ' <span class="hint" style="display:inline">· в слоте ' + (g.deck.findIndex(x => x === id) + 1) + '</span>' : ''}</span>
            <span class="hint" style="margin:0">${c.cost > 0 ? '🔮' + c.cost : '—'}</span>
          </button>`;
      }).join('')}
    </div>
  `;
  openSheet(html, () => {
    document.querySelectorAll('[data-deck-pick-slot]').forEach(b => {
      b.addEventListener('click', () => {
        const slot = parseInt(b.dataset.deckPickSlot);
        const cardId = b.dataset.deckPick || null;
        setDeckSlot(slot, cardId);
        closeSheet();
        haptic(8);
      });
    });
  });
}
