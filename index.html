<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" id="manifestLink">
<title>Финансы</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e1014;--panel:#161a22;--panel2:#1d222c;--panel3:#232936;--border:#262c3a;
  --text:#e7eaf0;--muted:#8b93a7;--accent:#4f8cff;--accent-d:#3a72d9;
  --green:#3ddc97;--red:#ff5c7a;--yellow:#ffcc66;--r:16px;
  --nav-h:62px;--safe-b:env(safe-area-inset-bottom,0px);--kb:0px;--vvh:100vh;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,system-ui,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;border:0;background:none}
input,textarea,select{font-family:inherit}

/* AUTH */
.auth-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 600px at 50% -10%,rgba(79,140,255,.10),transparent 60%),var(--bg);
  z-index:500;overflow-y:auto}
.auth-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);
  border-radius:20px;padding:28px 24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.auth-logo{font-size:26px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.auth-sub{color:var(--muted);font-size:14px;margin-bottom:22px;line-height:1.5}
.auth-tabs{display:flex;gap:5px;background:var(--panel2);padding:5px;border-radius:14px;margin-bottom:18px}
.auth-tab{flex:1;padding:10px;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;font-size:14px;transition:.15s}
.auth-tab.active{background:var(--panel);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.auth-field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.auth-field label{font-size:12.5px;color:var(--muted);font-weight:500}
.auth-field input{background:var(--panel2);border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;outline:none;width:100%;font-size:16px}
.auth-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
.auth-btn{width:100%;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:15px;margin-top:6px}
.auth-btn:active{transform:scale(.98)}
.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.auth-msg{margin-top:14px;padding:11px 13px;border-radius:11px;font-size:13.5px;line-height:1.45;display:none}
.auth-msg.show{display:block}
.auth-msg.err{background:rgba(255,92,122,.12);color:#ff8da1;border:1px solid rgba(255,92,122,.25)}
.auth-msg.info{background:rgba(79,140,255,.12);color:#9ec0ff;border:1px solid rgba(79,140,255,.25)}

/* LAYOUT */
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0;padding:24px 28px 80px;max-width:1080px;margin:0 auto;width:100%}

/* SIDEBAR */
.sidebar{width:228px;flex:0 0 228px;background:var(--panel);border-right:1px solid var(--border);
  padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;z-index:40}
.logo{font-size:17px;font-weight:700;padding:4px 10px 18px;display:flex;align-items:center;gap:9px}
.nav-btn{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;background:transparent;
  color:var(--muted);cursor:pointer;width:100%;text-align:left;transition:.15s;font-size:14.5px;font-weight:500}
.nav-btn i{font-style:normal;font-size:17px;width:20px;text-align:center}
.nav-btn:hover{background:var(--panel2);color:var(--text)}
.nav-btn.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 8px 20px -10px var(--accent)}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.topbar h1{font-size:23px;font-weight:700;letter-spacing:-.015em}
.topbar-right{display:flex;align-items:center;gap:8px}
.cur{background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:10px;
  padding:8px 12px;cursor:pointer;font-size:14px;font-weight:600;min-width:52px;text-align:center}
.user-badge{display:flex;align-items:center;gap:8px;padding:4px;background:var(--panel);
  border:1px solid var(--border);border-radius:99px;position:relative;transition:.15s}
.user-badge:hover{border-color:#39415a}
.user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#4f8cff,#7aa8ff);
  color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;text-transform:uppercase}
.sync-dot{position:absolute;top:1px;right:1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--panel);transition:background .25s}
.sync-dot.ok{background:var(--green)}
.sync-dot.syncing,.sync-dot.pending{background:var(--yellow);animation:pulse 1s infinite}
.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* CARDS */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:18px}
.card + .card{margin-top:14px}
.stats > .card + .card,
.grid2 > .card + .card{margin-top:0}
.section-title{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  font-weight:700;margin:26px 0 12px}
.section-title:first-child{margin-top:0}

/* DASHBOARD */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;grid-auto-rows:1fr}
.stats > .card{min-height:90px;display:flex;flex-direction:column;justify-content:flex-start;padding:14px 16px}
.stat .lbl{font-size:12.5px;color:var(--muted);margin:0;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.stat .val{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin:6px 0 0;flex:0 0 auto}
.stat .sub{font-size:12px;color:var(--muted);margin:auto 0 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.pos{color:var(--green)} .neg{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.cat-row{margin-bottom:14px}
.cat-row:last-child{margin-bottom:0}
.cat-head{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:7px;gap:10px}
.cat-head .amt{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#7aa8ff);
  transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar-fill.green{background:linear-gradient(90deg,#2fbf85,var(--green))}
.cat-diff{font-size:11.5px;font-weight:600;margin-left:6px}
.cat-diff.up{color:#ff8da1}
.cat-diff.down{color:var(--green)}

/* TOTAL BUDGET */
.total-budget{cursor:pointer;transition:.15s}
.total-budget:hover{border-color:#39415a}
.total-budget .cat-head{font-size:14px;font-weight:600;margin-bottom:8px}
.total-budget .sub{font-size:12.5px;color:var(--muted);margin-top:8px}

/* TX ITEM */
.tx-item{position:relative;overflow:hidden;border-bottom:1px solid var(--border)}
.tx-item:last-child{border-bottom:0}
.tx-content{position:relative;background:var(--panel);display:flex;align-items:center;gap:12px;
  padding:11px 0;transition:transform .2s ease;will-change:transform;cursor:pointer}
.tx-item.swiped .tx-content{transform:translateX(-72px)}
.tx-content.dragging{transition:none}
.tx-delete-bg{position:absolute;right:0;top:0;bottom:0;width:72px;background:var(--red);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.tx-ico{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:var(--panel2);
  display:flex;align-items:center;justify-content:center;font-size:17px}
.tx-mid{flex:1;min-width:0}
.tx-title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:12px;color:var(--muted);margin-top:1px}
.tx-amt{font-weight:600;font-size:14.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tx-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tx-tag{font-size:11px;color:var(--accent);background:rgba(79,140,255,.1);
  padding:1px 7px;border-radius:99px;display:inline-block}
.icon-btn{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:16px;
  padding:8px 10px;min-width:38px;min-height:38px;border-radius:10px;line-height:1;
  transition:.15s;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--panel2);color:var(--red)}
.icon-btn:active{transform:scale(.9)}

/* CHART */
.chart{display:flex;gap:8px;align-items:flex-end;padding:14px 0 0;min-height:140px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.chart-bar{width:100%;max-width:44px;background:linear-gradient(180deg,var(--accent),#2a5fc9);
  border-radius:6px 6px 2px 2px;min-height:4px;transition:height .4s;position:relative}
.chart-bar.current{background:linear-gradient(180deg,#ffcc66,#d99e2e)}
.chart-label{font-size:11px;color:var(--muted);text-transform:lowercase}

/* FORMS */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
input,textarea,select{background:var(--panel2);border:1.5px solid var(--border);border-radius:12px;
  padding:12px 14px;outline:none;transition:.15s;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
input::placeholder,textarea::placeholder{color:#5a6277}
textarea{resize:vertical;min-height:80px;line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:600;background:var(--panel2);
  color:var(--text);transition:.15s;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 22px -10px var(--accent)}
.btn.primary:hover{background:var(--accent-d)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn.danger{background:rgba(255,92,122,.15);color:#ff8da1}
.btn.block{width:100%}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:10px}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5}

/* SEGMENTED */
.seg{display:flex;gap:5px;background:var(--panel2);padding:5px;border-radius:14px;margin-bottom:16px}
.seg-btn{flex:1;border:0;background:transparent;color:var(--muted);padding:11px;border-radius:10px;
  cursor:pointer;font-weight:600;font-size:14.5px;transition:.15s}
.seg-btn.active{background:var(--panel);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.seg-btn.active[data-type="income"],.seg-btn.active[data-sheet-type="income"],.seg-btn.active[data-rec-type="income"]{color:var(--green)}
.seg-btn.active[data-type="expense"],.seg-btn.active[data-sheet-type="expense"],.seg-btn.active[data-rec-type="expense"]{color:var(--red)}

/* AMOUNT */
.amount-wrap{position:relative;margin-bottom:12px}
.amount-input{width:100%;font-size:34px;font-weight:700;letter-spacing:-.02em;padding:14px 58px 14px 18px;
  background:var(--panel2);border:1.5px solid var(--border);border-radius:16px;-moz-appearance:textfield}
.amount-input::-webkit-outer-spin-button,.amount-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.amount-cur{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:20px;font-weight:600;pointer-events:none}

/* QUICK AMOUNTS */
.quick-amounts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.quick-btn{background:var(--panel2);border:1.5px solid var(--border);border-radius:10px;
  padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--muted);transition:.15s;
  cursor:pointer;min-width:56px;text-align:center}
.quick-btn:hover{background:var(--panel3);color:var(--text);border-color:var(--accent)}
.quick-btn:active{transform:scale(.95)}

/* CATEGORY GRID */
.cat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:14px}
@media (max-width:340px){.cat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cat-cell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:13px;
  background:var(--panel2);border:1.5px solid transparent;transition:.15s;min-height:68px;justify-content:center;min-width:0}
.cat-cell:active{transform:scale(.94)}
.cat-cell .ci{font-size:22px;line-height:1}
.cat-cell .cn{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.15;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;padding:0 2px}
.cat-cell.active{background:rgba(79,140,255,.14);border-color:var(--accent)}
.cat-cell.active .cn{color:var(--text);font-weight:600}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chips-scroll{
  flex-wrap:nowrap;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  -ms-overflow-style:none;
  padding-bottom:4px;
  margin-bottom:10px;
}
.chips-scroll::-webkit-scrollbar{display:none}
.chips-scroll > .chip{flex:0 0 auto;white-space:nowrap}
.chip{border:1.5px solid var(--border);background:var(--panel2);color:var(--muted);padding:9px 14px;
  border-radius:99px;cursor:pointer;font-size:13.5px;font-weight:500;transition:.15s}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* TAGS INPUT */
.tags-input-wrap{display:flex;flex-direction:column;gap:8px}
.tags-selected{display:flex;flex-wrap:nowrap;gap:6px;min-height:0;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;-ms-overflow-style:none;padding-bottom:2px}
.tags-selected::-webkit-scrollbar{display:none}
.tags-selected:empty{display:none}
.tag-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(79,140,255,.15);
  color:var(--accent);border:1px solid rgba(79,140,255,.3);border-radius:99px;
  padding:5px 11px;font-size:12.5px;font-weight:600;flex:0 0 auto;white-space:nowrap}
.tag-chip button{color:inherit;font-size:14px;line-height:1;padding:0 0 0 2px;cursor:pointer;
  background:transparent;border:0;opacity:.7}
.tag-chip button:hover{opacity:1}
.tags-suggest{display:flex;flex-wrap:nowrap;gap:6px;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;-ms-overflow-style:none;padding-bottom:2px}
.tags-suggest::-webkit-scrollbar{display:none}
.tags-suggest:empty{display:none}
.tag-suggest{background:var(--panel2);border:1px solid var(--border);border-radius:99px;
  padding:5px 11px;font-size:12.5px;color:var(--muted);cursor:pointer;transition:.15s;
  flex:0 0 auto;white-space:nowrap}
.tag-suggest:hover{background:var(--panel3);color:var(--text);border-color:var(--accent)}
/* SEARCH */
.tx-search{margin-bottom:12px;position:relative}
.tx-search input{padding-left:38px}
.tx-search::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:14px;pointer-events:none;opacity:.6}

/* CONTEXT MENU */
.ctx-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--panel2);
  border-radius:12px;width:100%;text-align:left;font-weight:500;font-size:15px;
  margin-bottom:8px;transition:.15s;cursor:pointer;border:0;color:inherit}
.ctx-item:hover{background:var(--panel3)}
.ctx-item.danger{color:#ff8da1}
.ctx-item .ico{font-size:20px;width:24px;text-align:center}

/* GOALS */
.goal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.goal-title{font-size:17px;font-weight:700;letter-spacing:-.01em}
.goal-deadline{font-size:12.5px;color:var(--muted);margin-top:3px}
.goal-nums{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:8px;gap:10px}
.goal-nums b{font-weight:700;font-variant-numeric:tabular-nums}
.goal-plan{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);
  margin-top:14px;padding-top:14px;border-top:1px dashed var(--border)}
.goal-plan b{color:var(--text);font-variant-numeric:tabular-nums}
.forecast{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);
  display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.forecast b{color:var(--text)}
.auto-save-row{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;
  background:var(--panel2);border-radius:12px;cursor:pointer;font-size:13.5px;transition:.15s;border:1.5px solid transparent}
.auto-save-row:hover{background:var(--panel3)}
.auto-save-row.on{border-color:rgba(79,140,255,.4);background:rgba(79,140,255,.08)}
.auto-save-row .label{flex:1}
.auto-save-row .status{color:var(--accent);font-weight:700}
.deposit-row{display:flex;gap:8px;margin-top:12px}
.deposit-row input{flex:1}
.subgoals{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border)}
.subgoal{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;background:var(--panel2);
  margin-bottom:7px;transition:.15s;border:1px solid transparent}
.subgoal input[type=checkbox]{width:19px;height:19px;flex:0 0 19px;accent-color:var(--green);cursor:pointer;padding:0}
.subgoal .t{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subgoal .a{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.subgoal-actions{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.subgoal.done .t{color:var(--green);text-decoration:line-through}
.subgoal.done .a{color:var(--green)}
.subgoal.spent{background:rgba(61,220,151,.06);border-color:rgba(61,220,151,.2)}
.subgoal .spent-badge{font-size:11px;color:var(--green);background:rgba(61,220,151,.12);
  padding:2px 8px;border-radius:99px;white-space:nowrap}
.sub-add{display:flex;gap:6px;margin-top:10px}
.sub-add input:first-child{flex:1.6}
.sub-add input:nth-child(2){flex:1;min-width:0}
.goal-done-badge{display:inline-block;background:rgba(61,220,151,.15);color:var(--green);
  padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600}
.archived-badge{display:inline-block;background:rgba(139,147,167,.15);color:var(--muted);
  padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600}
.badge{display:inline-block;font-size:11.5px;color:var(--muted);background:var(--panel2);padding:3px 9px;border-radius:99px;font-weight:500}
.goal-actions{display:flex;gap:6px;margin-top:12px}
.goal-actions .btn{flex:1}

/* NOTES */
.note-card{position:relative;padding-top:16px}
.note-card input.note-title{background:transparent;border:0;padding:0 44px 8px 0;font-size:16px;font-weight:700;border-radius:0}
.note-card input.note-title:focus{border-bottom:1px solid var(--accent);box-shadow:none}
.note-card textarea{background:transparent;border:0;padding:10px 0 0;min-height:100px;font-size:14px;border-radius:0;line-height:1.55}
.note-card textarea:focus{box-shadow:none}
.note-del{position:absolute;top:8px;right:6px}

/* EMPTY */
.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:12px;opacity:.75;line-height:1}
.empty p{font-size:14px;max-width:400px;margin:0 auto 16px;line-height:1.6}

/* FAB */
.fab{position:fixed;right:18px;bottom:calc(20px + var(--safe-b));width:58px;height:58px;border-radius:50%;
  background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center;

.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:22px 22px 0 0;
  transform:translateY(100%);

<script>

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlcmFtd2djempjbWtveXJ2ZXZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNDI2MzEsImV4cCI6MjEwNTgxODYzMX0.JcgkpaPiMnIVWXGHLmQLydDmoT8D0I6P21rmmteC5lU';

/* =====================================================================

/* =====================================================================

const $  = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmt(n) {
  const v = Number(n) || 0;
  return v.toLocaleString('ru-RU', { maximumFractionDigits: 2 }) + ' ' + (state.currency || '€');
}
const todayStr = () => new Date().toISOString().slice(0, 10);

function monthsUntil(dateStr) {
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return 0;
  const diff = d - now;
  if (diff <= 0) return 0;
  return Math.max(1, Math.ceil(diff / (1000*60*60*24*30.44)));
}
function sameMonth(dateStr, ref) {
  const a = new Date(dateStr + 'T00:00:00');
  return a.getFullYear() === ref.getFullYear() && a.getMonth() === ref.getMonth();
}
function humanDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.round((now - d) / 86400000);
  if (diff === 0) return 'сегодня';
  if (diff === 1) return 'вчера';
  if (diff === -1) return 'завтра';
  return d.toLocaleDateString('ru-RU', { day:'numeric', month:'short' });
}
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}
function haptic(ms=8) { if (navigator.vibrate) try { navigator.vibrate(ms); } catch(e) {} }
function slugTag(s) {
  return String(s || '').trim().toLowerCase()
    .replace(/[^a-zа-яё0-9\s_-]/gi, '')
    .replace(/\s+/g, '_')
    .slice(0, 24);
}

/* =====================================================================
   КАТЕГОРИИ
   ===================================================================== */
const EXPENSE_CATS = [
  { id:'food',name:'Еда',icon:'🍔' },{ id:'tech',name:'Техника',icon:'💻' },
  { id:'smoke',name:'Курение',icon:'🚬' },{ id:'fun',name:'Развлечения',icon:'🎮' },
  { id:'transport',name:'Транспорт',icon:'🚗' },{ id:'home',name:'Жильё',icon:'🏠' },
  { id:'health',name:'Здоровье',icon:'💊' },{ id:'clothes',name:'Одежда',icon:'👕' },
  { id:'other',name:'Другое',icon:'📦' },
];
const INCOME_CATS = [
  { id:'salary',name:'Зарплата',icon:'💰' },{ id:'freelance',name:'Фриланс',icon:'🧑‍💻' },
  { id:'gift',name:'Подарок',icon:'🎁' },{ id:'other_in',name:'Другое',icon:'✨' },
];
const ALL_CATS = [...EXPENSE_CATS, ...INCOME_CATS];
const catById = id => ALL_CATS.find(c => c.id === id) || { name:'Без категории', icon:'❓' };

function sortCatsByUsage(cats) {
  const usage = state.categoryUsage || {};
  const any = cats.some(c => (usage[c.id] || 0) > 0);
  if (!any) return cats.slice();
  return cats.slice().sort((a, b) => (usage[b.id] || 0) - (usage[a.id] || 0));
}

function getAllTags() {
  const s = new Set();
  state.transactions.forEach(t => (t.tags || []).forEach(tag => s.add(tag)));
  return [...s].sort();
}

/* =====================================================================
   СОСТОЯНИЕ
   ===================================================================== */
const LS_KEY = 'finance_app_v2';
const SHARED_LS_KEY = 'finance_app_shared_v1';
const LAST_USER_KEY = 'finance_app_last_user';

let state = {
  transactions: [], goals: [], notes: [], currency: '€',
  budgets: {}, monthlyBudget: 0,
  recurring: [], categoryUsage: {},
};
let sharedGoals = [];
let currentUser = null;

function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {} }
function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      state = Object.assign(state, p);
      state.transactions = state.transactions || [];
      state.goals = state.goals || [];
      state.notes = state.notes || [];
      state.budgets = state.budgets || {};
      state.recurring = state.recurring || [];
      state.categoryUsage = state.categoryUsage || {};
      state.monthlyBudget = Number(state.monthlyBudget) || 0;
      /* Миграция: подцели без spentAt оставляем как есть, добавляем поле archived */
      state.goals.forEach(g => {
        if (g.archived === undefined) g.archived = false;
        if (g.archivedAt === undefined) g.archivedAt = null;
        (g.subgoals || []).forEach(s => {
          if (s.spentAt === undefined) s.spentAt = null;
        });
      });
    }
  } catch(e) { console.warn(e); }
}
function saveLocalShared() { try { localStorage.setItem(SHARED_LS_KEY, JSON.stringify(sharedGoals)); } catch(e) {} }
function loadLocalShared() {
  try {
    const raw = localStorage.getItem(SHARED_LS_KEY);
    if (raw) sharedGoals = JSON.parse(raw) || [];
  } catch(e) {}
}

/* Прогресс цели = только deposits, обрезанные по target.
   Подцели — чеклист, в прогресс НЕ идут. */
function goalBreakdown(g) {
  const deposits = Number(g.deposits) || 0;
  const target   = Number(g.target) || 0;
  const saved    = Math.min(target, deposits);
  const remaining = Math.max(0, target - saved);
  return { deposits, saved, remaining, target };
}
function goalSaved(g) { return goalBreakdown(g).saved; }

/* Активные / архивные цели */
function activeGoals()   { return state.goals.filter(g => !g.archived); }
function archivedGoals() { return state.goals.filter(g => g.archived); }

function blankState() {
  return { transactions: [], goals: [], notes: [], currency: state.currency || '€',
    budgets: {}, monthlyBudget: 0, recurring: [], categoryUsage: {} };
}

/* =====================================================================
   PERIOD
   ===================================================================== */
let uiPeriod = 'month';
function periodRange() {
  const now = new Date();
  if (uiPeriod === 'month') {
    return { start: new Date(now.getFullYear(), now.getMonth(), 1),
             end: new Date(now.getFullYear(), now.getMonth()+1, 1, 0,0,0,0),
             label: 'этот месяц' };
  }
  if (uiPeriod === 'prev') {
    return { start: new Date(now.getFullYear(), now.getMonth()-1, 1),
             end: new Date(now.getFullYear(), now.getMonth(), 1, 0,0,0,0),
             label: 'прошлый месяц' };
  }
  return { start: new Date(0), end: new Date(8640000000000000), label: 'всё время' };
}
function inPeriod(dateStr, r) {
  const d = new Date(dateStr + 'T00:00:00');
  return d >= r.start && d < r.end;
}

/* =====================================================================
   СИНХРОНИЗАЦИЯ
   ===================================================================== */
let syncTimer = null;
let syncState = 'ok';
let lastPushTimestamp = null;
let lastPushAt = 0;
let realtimeChannel = null;

function setSyncStatus(s) {
  syncState = s;
  const dot = $('#syncDot');
  if (!dot) return;
  dot.className = 'sync-dot ' + s;
  dot.title = s === 'ok' ? 'Синхронизировано' :
              s === 'pending' ? 'Ожидает сохранения' :
              s === 'syncing' ? 'Сохраняю…' : 'Ошибка синхронизации';
}
function save() {
  saveLocal();
  if (!currentUser) return;
  setSyncStatus('pending');
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushToCloud, 700);
}
async function pushToCloud() {
  if (!currentUser) return;
  setSyncStatus('syncing');
  const ts = new Date().toISOString();
  const snapshot = JSON.parse(JSON.stringify(state));
  const { error } = await sb.from('user_data').upsert({
    user_id: currentUser.id, data: snapshot, updated_at: ts,
  }, { onConflict: 'user_id' });
  if (error) { console.warn('push error', error); setSyncStatus('error'); return; }
  lastPushTimestamp = ts;
  lastPushAt = Date.now();
  setSyncStatus('ok');
}
async function pullFromCloud() {
  if (!currentUser) return { found: false };
  const { data, error } = await sb.from('user_data')
    .select('data').eq('user_id', currentUser.id).maybeSingle();
  if (error) { console.warn('pull error', error); return { found: false, error }; }
  if (data && data.data && typeof data.data === 'object') {
    state = Object.assign(blankState(), data.data);
    state.monthlyBudget = Number(state.monthlyBudget) || 0;
    state.goals.forEach(g => {
      if (g.archived === undefined) g.archived = false;
      if (g.archivedAt === undefined) g.archivedAt = null;
      (g.subgoals || []).forEach(s => { if (s.spentAt === undefined) s.spentAt = null; });
    });
    saveLocal();
    return { found: true };
  }
  return { found: false };
}

/* =====================================================================
   REALTIME
   ===================================================================== */
function subscribeRealtime() {
  if (!currentUser || realtimeChannel) return;
  realtimeChannel = sb.channel('user_data_rt')
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'user_data', filter: `user_id=eq.${currentUser.id}` },
      (payload) => {
        if (syncState !== 'ok') return;
        if (lastPushAt && Date.now() - lastPushAt < 2000) return;
        const remote = payload.new?.data;
        if (!remote || typeof remote !== 'object') return;
        state = Object.assign(blankState(), remote);
        state.monthlyBudget = Number(state.monthlyBudget) || 0;
        saveLocal();
        render();
        //toast('Обновлено с другого устройства');
      })
    .subscribe();
}
function unsubscribeRealtime() {
  if (realtimeChannel) { try { sb.removeChannel(realtimeChannel); } catch(e) {} realtimeChannel = null; }
}

/* =====================================================================
   RECURRING
   ===================================================================== */
function runRecurring() {
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  let changed = false;
  (state.recurring || []).forEach(r => {
    if (!r.active) return;
    if (r.lastRun === ym) return;
    if (now.getDate() < (r.dayOfMonth || 1)) return;
    const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    const day = Math.min(r.dayOfMonth, daysInMonth);
    const dateStr = `${ym}-${String(day).padStart(2,'0')}`;
    state.transactions.push({
      id: uid(), type: r.type, amount: r.amount, category: r.category,
      note: r.note || '', date: dateStr, createdAt: new Date().toISOString(),
      recurringId: r.id, tags: [],
    });
    state.categoryUsage[r.category] = (state.categoryUsage[r.category] || 0) + 1;
    r.lastRun = ym;
    changed = true;
  });
  if (changed) save();
}

/* =====================================================================
   SHARED GOALS
   ===================================================================== */
async function loadSharedGoals() {
  if (!currentUser) { sharedGoals = []; return; }
  const { data: goals, error } = await sb.from('shared_goals').select('*')
    .order('created_at', { ascending: false });
  if (error) { console.warn('shared goals load', error); return; }
  if (!goals || !goals.length) { sharedGoals = []; saveLocalShared(); return; }
  const ids = goals.map(g => g.id);
  const [mRes, dRes] = await Promise.all([
    sb.from('shared_goal_members').select('*').in('goal_id', ids),
    sb.from('shared_goal_deposits').select('*').in('goal_id', ids).order('date', { ascending: false }),
  ]);
  const members = mRes.data || [];
  const deposits = dRes.data || [];
  sharedGoals = goals.map(g => {
    const gm = members.filter(m => m.goal_id === g.id);
    const gd = deposits.filter(d => d.goal_id === g.id);
    return { ...g, members: gm, deposits: gd,
      total: gd.reduce((a, d) => a + Number(d.amount || 0), 0) };
  });
  saveLocalShared();
}

/* =====================================================================
   АУТЕНТИФИКАЦИЯ
   ===================================================================== */
let authMode = 'login';
function showAuth() { $('#authScreen').style.display = 'flex'; $('#appScreen').style.display = 'none'; }
function showApp() {
  $('#authScreen').style.display = 'none';

$('#authForm').addEventListener('submit', async (e) => {
  e.preventDefault(); hideAuthMsg();

  const password = $('#authPass').value;
  if (!email || !password) return;
  const btn = $('#authBtn'); const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = authMode === 'login' ? 'Вход…' : 'Создаю…';
  try {
    if (authMode === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    } else {
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
      if (data.user && !data.session) {
        showAuthMsg('Аккаунт создан. Проверь почту и перейди по ссылке для входа.', 'info');
        btn.disabled = false; btn.textContent = original; return;

    const msg = err?.message || 'Что-то пошло не так';
    let ru = msg;
    if (/Invalid login credentials/i.test(msg)) ru = 'Неверный email или пароль';
    else if (/User already registered/i.test(msg)) ru = 'Такой email уже зарегистрирован';
    else if (/Password should be at least/i.test(msg)) ru = 'Пароль слишком короткий';
    else if (/Email not confirmed/i.test(msg)) ru = 'Подтверди email';
    else if (/rate limit/i.test(msg)) ru = 'Слишком много попыток';
    showAuthMsg(ru, 'err');
    btn.disabled = false; btn.textContent = original;
  }
});

let toastTimer;
function toast(msg, withTick=true) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.innerHTML = (withTick ? '<span class="tick">✓</span>' : '') + esc(msg);
  requestAnimationFrame(() => el.classList.add('show'));

const sheet = $('#sheet'); const backdrop = $('#backdrop');
let sheetMount = null;
function openSheet(html, mount) {
  sheet.innerHTML = html; sheetMount = mount || null;
  void sheet.offsetHeight;
  sheet.classList.add('open'); backdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
  if (sheetMount) sheetMount();
  const f = sheet.querySelector('[data-autofocus]');
  if (f) setTimeout(() => f.focus({ preventScroll: true }), 340);
}
function closeSheet() {
  sheet.classList.remove('open'); backdrop.classList.remove('open');
  document.body.style.overflow = ''; sheetMount = null;
  setTimeout(() => { if (!sheet.classList.contains('open')) sheet.innerHTML = ''; }, 350);
}
backdrop.addEventListener('click', closeSheet);
document.addEventListener('click', e => { if (e.target.closest('[data-action="close-sheet"]')) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet(); });

sheet.addEventListener('focusin', (e) => {
  const t = e.target;
  if (!(t instanceof HTMLInputElement || t instanceof HTMLTextAreaElement)) return;
  setTimeout(() => {
    const body = t.closest('.sheet-body');
    if (!body) return;
    const tr = t.getBoundingClientRect();
    const br = body.getBoundingClientRect();
    if (tr.bottom > br.bottom - 24) {
      body.scrollBy({ top: tr.bottom - br.bottom + 48, behavior: 'smooth' });
    } else if (tr.top < br.top + 24) {
      body.scrollBy({ top: tr.top - br.top - 48, behavior: 'smooth' });
    }
  }, 350);
});

if (window.visualViewport) {
  const vv = window.visualViewport;
  const root = document.documentElement;
  let lastKb = -1, lastVvh = -1;
  const update = () => {
    const kb  = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    const vvh = Math.round(vv.height);
    if (kb === lastKb && vvh === lastVvh) return;
    lastKb = kb; lastVvh = vvh;
    root.style.setProperty('--kb', kb + 'px');
    root.style.setProperty('--vvh', vvh + 'px');
  };
  vv.addEventListener('resize', update);
  vv.addEventListener('scroll', update);
  update();
}

function renderTotalBudget() {
  if (!state.monthlyBudget || state.monthlyBudget <= 0) return '';
  const now = new Date();
  const spent = state.transactions
    .filter(x => x.type === 'expense' && sameMonth(x.date, now))
    .reduce((a, x) => a + x.amount, 0);
  const pct = Math.min(100, spent / state.monthlyBudget * 100);
  const over = spent > state.monthlyBudget;
  const warn = !over && pct >= 80;
  const color = over ? 'var(--red)' : warn ? 'var(--yellow)' : 'var(--green)';
  const left = Math.max(0, state.monthlyBudget - spent);
  const daysLeft = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate() - now.getDate();
  return `
    <div class="card total-budget" data-action="edit-budgets" style="margin-top:14px">
      <div class="cat-head">
        <span>💼 Бюджет на месяц</span>
        <span class="amt" style="color:${color};font-weight:600">${fmt(spent)} / ${fmt(state.monthlyBudget)}</span>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="sub">${over ? `Превышено на ${fmt(spent - state.monthlyBudget)}` : `Осталось ${fmt(left)}${daysLeft > 0 ? ` · ${daysLeft} дн.` : ''}`}</div>
    </div>
  `;
}

function renderBudgetsSection() {
  const now = new Date();
  const spent = {};
  state.transactions
    .filter(x => x.type === 'expense' && sameMonth(x.date, now))
    .forEach(x => { spent[x.category] = (spent[x.category] || 0) + x.amount; });

  const entries = Object.entries(state.budgets || {});
  if (!entries.length && !state.monthlyBudget) {
    return `
      <div class="card" style="margin-top:14px">
        <div class="section-title" style="margin-top:0">Бюджеты</div>
        <div class="hint" style="margin-top:0">Установи лимит на месяц и на категории — приложение подсветит, когда подходишь к пределу.</div>
        <button class="btn primary sm block" data-action="edit-budgets" style="margin-top:12px">Настроить бюджеты</button>
      </div>
    `;
  }
  if (!entries.length) return '';
  return `
    <div class="card" style="margin-top:14px">
      <div class="section-title" style="margin-top:0">Бюджеты по категориям</div>
      ${entries.map(([catId, limit]) => {
        const c = catById(catId);
        const s = spent[catId] || 0;
        const pct = Math.min(100, s / limit * 100);
        const over = s > limit;
        const warn = !over && pct >= 80;
        const color = over ? 'var(--red)' : warn ? 'var(--yellow)' : 'var(--green)';
        const left = Math.max(0, limit - s);
        return `
          <div class="cat-row">
            <div class="cat-head">
              <span>${c.icon} ${esc(c.name)}</span>
              <span class="amt" style="color:${color}">${fmt(s)} / ${fmt(limit)}</span>
            </div>
            <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
            ${over ? `<div class="hint" style="color:var(--red);margin-top:4px">Превышено на ${fmt(s-limit)}</div>`
                    : `<div class="hint" style="margin-top:4px">Осталось ${fmt(left)}</div>`}
          </div>
        `;
      }).join('')}
      <button class="btn ghost sm block" data-action="edit-budgets" style="margin-top:6px">Настроить</button>
    </div>
  `;
}

function renderChartSection() {
  const now = new Date();
  const months = [];
  for (let i = 5; i >= 0; i--) months.push(new Date(now.getFullYear(), now.getMonth() - i, 1));
  const data = months.map(m => {
    const sum = state.transactions
      .filter(x => x.type === 'expense' && sameMonth(x.date, m))
      .reduce((a, x) => a + x.amount, 0);
    return { date: m, sum };
  });
  const maxSum = Math.max(1, ...data.map(d => d.sum));
  const barH = 100;
  const avg = data.reduce((a, d) => a + d.sum, 0) / 6;
  return `
    <div class="card" style="margin-top:14px">
      <div class="section-title" style="margin-top:0">Расходы за 6 месяцев</div>
      <div class="chart">
        ${data.map((d, i) => {
          const h = Math.max(4, Math.round(d.sum / maxSum * barH));
          const label = d.date.toLocaleDateString('ru-RU', { month: 'short' });
          const cur = i === data.length - 1;
          return `
            <div class="chart-col">
              <div class="chart-bar ${cur ? 'current' : ''}" style="height:${h}px" title="${fmt(d.sum)}"></div>
              <div class="chart-label">${label}</div>
            </div>`;
        }).join('')}
      </div>
      <div class="hint" style="margin-top:14px">Средние траты в месяц: <b style="color:var(--text)">${fmt(avg)}</b></div>
    </div>
  `;
}

function forecastForGoal(g) {
  const bd = goalBreakdown(g);
  if (bd.remaining <= 0) return null;
  const created = new Date(g.createdAt || new Date().toISOString());
  const now = new Date();
  const daysSinceCreated = Math.max(1, (now - created) / (1000*60*60*24));
  const monthsSinceCreated = daysSinceCreated / 30.44;
  if (monthsSinceCreated < 0.5) return null;
  if (bd.saved < 1) return null;
  const rate = bd.saved / monthsSinceCreated;
  if (rate < 1) return null;
  const monthsToFinish = bd.remaining / rate;
  const forecastDate = new Date(now.getTime() + monthsToFinish * 30.44 * 24*60*60*1000);
  const extra = 50;
  const monthsToFinishWithExtra = bd.remaining / (rate + extra);
  const savedMonths = Math.round(monthsToFinish - monthsToFinishWithExtra);
  return { forecastDate, monthsToFinish, savedMonths: savedMonths >= 1 ? savedMonths : 0 };
}

function goalCard(g, opts = {}) {

  const dlText = isNaN(dl) ? '—' : dl.toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' });

  return `

      <div class="goal-head">
        <div style="min-width:0">
          <div class="goal-title">${esc(g.title)}</div>
          <div class="goal-deadline">
            ${archived ? `архивирована ${g.archivedAt ? humanDate(g.archivedAt.slice(0,10)) : ''}` : `до ${dlText} · ${months > 0 ? months + ' ' + plural(months,'месяц','месяца','месяцев') : 'срок вышел'}`}

        </div>
        <div style="display:flex;align-items:center;gap:6px;flex:0 0 auto">
          ${archived ? `<span class="archived-badge">Архив</span>` : done ? `<span class="goal-done-badge">Готово 🎉</span>` : ''}

        </div>
      </div>
      <div class="goal-nums">
        <span><b>${fmt(saved)}</b> <span style="color:var(--muted)">из ${fmt(target)}</span></span>
        <span style="color:var(--muted)">${Math.round(pct)}%</span>
      </div>
      <div class="bar"><div class="bar-fill ${done ? 'green' : ''}" style="width:${pct}%"></div></div>

      <div class="goal-plan">
        ${done ? `<span>Цель закрыта 🎉</span>` :
          `<span>Осталось: <b>${fmt(remaining)}</b></span>
           <span>В месяц: <b>${fmt(perMonth)}</b></span>`}
      </div>

      ${forecast ? `
        <div class="forecast">
          <div>Прогноз закрытия: <b>${forecast.forecastDate.toLocaleDateString('ru-RU', { day:'numeric', month:'short', year:'numeric' })}</b></div>
          ${forecast.savedMonths > 0 ? `<div>Если +50 ${state.currency}/мес — <b>на ${forecast.savedMonths} ${plural(forecast.savedMonths,'месяц','месяца','месяцев')} раньше</b></div>` : ''}
        </div>
      ` : ''}

      ${!compact && !archived ? `
        <div class="auto-save-row ${autoPct > 0 ? 'on' : ''}" data-action="edit-autosave" data-id="${g.id}">
          <span style="font-size:18px">🔄</span>

          <span class="status">${autoPct > 0 ? autoPct + '%' : 'Выкл'}</span>
        </div>
      ` : ''}

      ${!compact && (g.subgoals && g.subgoals.length) ? `
        <div class="subgoals">
          <div class="section-title" style="margin:0 0 10px">Подцели</div>
          ${g.subgoals.map(s => {
            const spent = !!s.spentAt;
            const doneCls = s.done ? 'done' : '';
            const spentCls = spent ? 'spent' : '';
            return `
              <div class="subgoal ${doneCls} ${spentCls}">
                <input type="checkbox" data-action="toggle-sub" data-goal="${g.id}" data-sub="${s.id}" ${s.done ? 'checked' : ''}>
                <span class="t">${esc(s.title)}</span>
                <span class="a">${s.amount ? fmt(s.amount) : ''}</span>
                ${spent ? `<span class="spent-badge">расход ✓</span>` : ''}

                </div>` : ''}
              </div>

        </div>
      ` : ''}
    </div>
  `;
}

function mountTxSheet() {
  const amountEl = $('#txAmount');
  const addBtn   = $('#txAddBtn');
  const catGrid  = $('#txCatGrid');
  const editing = !!sheetTx.editId;

  const updateBtn = () => {
    const v = parseFloat(amountEl.value);
    const base = editing ? 'Сохранить' : 'Добавить';
    addBtn.textContent = v > 0 ? `${base} ${fmt(v)}` : base;
  };
  amountEl.addEventListener('input', updateBtn); updateBtn();

  const quickWrap = $('#quickAmounts');
  if (quickWrap) {
    quickWrap.addEventListener('click', e => {
      const b = e.target.closest('[data-quick]');
      if (!b) return;
      const cur = parseFloat(amountEl.value) || 0;
      amountEl.value = cur + parseFloat(b.dataset.quick);
      amountEl.dispatchEvent(new Event('input'));
      haptic(8);
    });
  }

  document.querySelectorAll('[data-sheet-type]').forEach(b => {
    b.addEventListener('click', () => {
      sheetTx.type = b.dataset.sheetType;
      haptic(5);
      const v = amountEl.value;
      const n = $('#txNote')?.value || '';
      const d = $('#txDate')?.value || todayStr();
      const cats = sheetTx.type === 'expense' ? EXPENSE_CATS : INCOME_CATS;
      if (!cats.some(c => c.id === sheetTx.category)) sheetTx.category = cats[0].id;
      renderTxSheet({ amount: v, note: n, date: d });
    });
  });

  catGrid.addEventListener('click', e => {
    const c = e.target.closest('[data-sheet-cat]');
    if (!c) return;
    sheetTx.category = c.dataset.sheetCat;
    catGrid.querySelectorAll('.cat-cell').forEach(x => x.classList.toggle('active', x === c));
    haptic(5);
  });

  const tagsSelected = $('#tagsSelected');
  const tagsSuggest = $('#tagsSuggest');
  const tagInput = $('#tagInput');
  const renderTags = () => {
    tagsSelected.innerHTML = sheetTx.tags.map(t => `
      <span class="tag-chip">#${esc(t)}<button type="button" data-tag-remove="${esc(t)}">✕</button></span>
    `).join('');
  };
  const renderSuggest = () => {
    const all = getAllTags().filter(t => !sheetTx.tags.includes(t));
    if (!all.length) { tagsSuggest.innerHTML = ''; return; }
    tagsSuggest.innerHTML = all.slice(0, 12).map(t =>
      `<button type="button" class="tag-suggest" data-tag-add="${esc(t)}">#${esc(t)}</button>`
    ).join('');
  };
  const addTag = (t) => {
    t = String(t || '').trim().replace(/^#/, '').replace(/\s+/g, '_').toLowerCase();
    if (!t) return;
    if (sheetTx.tags.includes(t)) { tagInput.value = ''; return; }
    sheetTx.tags.push(t);
    renderTags(); renderSuggest();
    tagInput.value = '';
  };
  const removeTag = (t) => {
    sheetTx.tags = sheetTx.tags.filter(x => x !== t);
    renderTags(); renderSuggest();
  };
  if (tagInput) {
    tagInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault(); addTag(tagInput.value);
      } else if (e.key === 'Backspace' && !tagInput.value && sheetTx.tags.length) {
        removeTag(sheetTx.tags[sheetTx.tags.length - 1]);
      }
    });
    tagsSelected.addEventListener('click', e => {
      const b = e.target.closest('[data-tag-remove]');
      if (!b) return;
      removeTag(b.dataset.tagRemove);
    });
    tagsSuggest.addEventListener('click', e => {
      const b = e.target.closest('[data-tag-add]');
      if (!b) return;
      addTag(b.dataset.tagAdd);
    });
    renderTags(); renderSuggest();
  }

  const saveTx = () => {
    const amount = parseFloat(amountEl.value);
    if (!amount || amount <= 0) {
      amountEl.focus();
      amountEl.style.borderColor = 'var(--red)';
      setTimeout(() => amountEl.style.borderColor = '', 800);
      return;
    }
    const rawTag = tagInput?.value.trim();
    if (rawTag) addTag(rawTag);

    const data = {
      type: sheetTx.type, amount, category: sheetTx.category,
      note: $('#txNote').value.trim(),
      date: $('#txDate').value || todayStr(),
      tags: [...sheetTx.tags],
    };

    let autoSaveMessage = null;
    let txId = null;

    if (editing) {
      const t = state.transactions.find(x => x.id === sheetTx.editId);
      if (t) { Object.assign(t, data); txId = t.id; }
    } else {
      txId = uid();
      state.transactions.push({ id: txId, ...data, createdAt: new Date().toISOString() });
      state.categoryUsage[sheetTx.category] = (state.categoryUsage[sheetTx.category] || 0) + 1;

      /* Авто-отчисление — не переполняем цель */
      if (data.type === 'income') {
        let totalAuto = 0;
        state.goals.forEach(g => {
          if (g.archived) return;
          const pct = Number(g.autoSavePercent) || 0;
          if (pct <= 0) return;
          const bd = goalBreakdown(g);
          if (bd.remaining <= 0) return;
          let add = amount * pct / 100;
          if (add > bd.remaining) add = bd.remaining;
          g.deposits = (Number(g.deposits) || 0) + add;
          totalAuto += add;
        });
        if (totalAuto > 0) autoSaveMessage = `Автоотчислено ${fmt(totalAuto)} в цели`;
      }
    }

    /* Помечаем подцель как «расход записан» */
    if (sheetTx.subgoalContext) {
      const g = state.goals.find(x => x.id === sheetTx.subgoalContext.goalId);
      if (g) {
        const s = (g.subgoals || []).find(x => x.id === sheetTx.subgoalContext.subId);
        if (s) { s.spentAt = txId; s.spentDate = data.date; s.done = true; }
      }
    }

    save(); haptic(15); closeSheet();
    setTimeout(() => {
      toast(editing ? 'Сохранено' : (data.type === 'income' ? `Доход ${fmt(amount)} записан` : `Расход ${fmt(amount)} записан`));
      if (autoSaveMessage) setTimeout(() => toast(autoSaveMessage), 700);
      render();
    }, 180);
  };
  addBtn.addEventListener('click', saveTx);
  amountEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveTx(); } });
  $('#txNote').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveTx(); } });

  if (editing) {
    $('#txDelBtn').addEventListener('click', () => {
      if (confirm('Удалить операцию?')) {
        state.transactions = state.transactions.filter(x => x.id !== sheetTx.editId);
        save(); haptic(12); closeSheet();
        setTimeout(() => { toast('Удалено'); render(); }, 180);
      }
    });
  }
}

function mountLongPress() {
  document.querySelectorAll('.tx-content[data-action="edit-tx"]').forEach(el => {
    if (el._longPressMounted) return;
    el._longPressMounted = true;
    const id = el.dataset.id;
    if (!id) return;
    let timer = null, moved = false;
    const cancel = () => { clearTimeout(timer); timer = null; };
    const startTimer = () => {
      moved = false;
      cancel();
      timer = setTimeout(() => {
        if (!moved) {
          suppressEditClick = true;
          setTimeout(() => { suppressEditClick = false; }, 800);
          haptic(20); showTxMenu(id);
        }
      }, 500);
    };
    const onMove = () => { moved = true; cancel(); };
    el.addEventListener('touchstart', startTimer, { passive: true });
    el.addEventListener('touchend', cancel);
    el.addEventListener('touchmove', onMove, { passive: true });
    el.addEventListener('touchcancel', cancel);
    el.addEventListener('mousedown', e => { if (e.button !== 0) return; startTimer(); });
    el.addEventListener('mouseup', cancel);
    el.addEventListener('mouseleave', cancel);
    el.addEventListener('contextmenu', e => {
      e.preventDefault();
      suppressEditClick = true;
      setTimeout(() => { suppressEditClick = false; }, 800);
      showTxMenu(id);
    });
  });
}

/* =====================================================================
   SWIPE
   ===================================================================== */
function mountSwipe() {
  document.querySelectorAll('.tx-item').forEach(item => {
    if (item._swipeMounted) return;
    item._swipeMounted = true;
    const content = item.querySelector('.tx-content');
    if (!content) return;
    let start = null;
    item.addEventListener('touchstart', e => {
      if (e.target.closest('[data-action="del-tx"]')) return;
      start = { x: e.touches[0].clientX, y: e.touches[0].clientY, swiped: false };
    }, { passive: true });
    item.addEventListener('touchmove', e => {
      if (!start) return;
      const dx = e.touches[0].clientX - start.x;
      const dy = e.touches[0].clientY - start.y;
      if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 12) { start = null; return; }
      if (Math.abs(dx) > 8) {
        start.swiped = true;
        content.classList.add('dragging');
        const shift = Math.max(-72, Math.min(0, dx));
        content.style.transform = `translateX(${shift}px)`;
      }
    }, { passive: true });
    item.addEventListener('touchend', e => {
      if (!start) return;
      const dx = (e.changedTouches[0]?.clientX || 0) - start.x;
      content.classList.remove('dragging');
      content.style.transform = '';
      document.querySelectorAll('.tx-item').forEach(i => i.classList.remove('swiped'));
      if (start.swiped && dx < -40) {
        item.classList.add('swiped'); haptic(6);
        suppressEditClick = true;
        setTimeout(() => { suppressEditClick = false; }, 300);
      }
      start = null;
    });
  });
  document.addEventListener('touchstart', e => {
    if (!e.target.closest('.tx-item.swiped')) {
      document.querySelectorAll('.tx-item.swiped').forEach(i => i.classList.remove('swiped'));
    }
  }, { passive: true });
}

      <div class="field"><label>Нужная сумма</label>

  `;

    const titleEl = $('#gTitle'), targetEl = $('#gTarget'), dlEl = $('#gDeadline');
    const preview = $('#gPreview'), addBtn = $('#gAddBtn');
    const upd = () => {
      const target = parseFloat(targetEl.value), dl = dlEl.value;
      if (!target || !dl) { preview.textContent = 'Введи сумму и срок — покажу, сколько откладывать в месяц.'; addBtn.textContent = 'Создать цель'; return; }
      const m = monthsUntil(dl);
      if (m <= 0) { preview.textContent = 'Срок уже прошёл — выбери дату в будущем.'; return; }
      preview.innerHTML = `Нужно откладывать <b style="color:var(--accent)">${fmt(target/m)}</b> в месяц в течение ${m} ${plural(m,'месяца','месяцев','месяцев')}.`;
      addBtn.textContent = `Создать · ${fmt(target/m)}/мес`;
    };
    targetEl.addEventListener('input', upd); dlEl.addEventListener('change', upd);
    addBtn.addEventListener('click', () => {
      const title = titleEl.value.trim();
      const target = parseFloat(targetEl.value), deadline = dlEl.value;
      if (!title) { titleEl.focus(); return; }
      if (!target || target <= 0) { targetEl.focus(); return; }
      if (!deadline) { dlEl.focus(); return; }
      state.goals.push({ id: uid(), title, target, deadline, deposits: 0, subgoals: [],
        autoSavePercent: 0, archived: false, archivedAt: null,
        createdAt: new Date().toISOString() });
      save(); haptic(15); closeSheet();
      setTimeout(() => { toast('Цель создана'); render(); }, 180);
    });
  });
}

    <div class="sheet-header"><h2>Присоединиться</h2>
      <button class="sheet-close" data-action="close-sheet">✕</button></div>
    <div class="sheet-body">
      <div class="field"><label>Код приглашения</label>
        <input id="sgCode" placeholder="ABC123" data-autofocus maxlength="8"
          style="text-transform:uppercase;text-align:center;font-size:22px;font-weight:700;letter-spacing:.15em"></div>
      <div class="hint">Спроси код у того, кто создал цель.</div>
    </div>
    <div class="sheet-footer"><button class="btn primary block" id="sgJoinBtn">Присоединиться</button></div>
  `;
  openSheet(html, () => {
    const codeEl = $('#sgCode');
    setTimeout(() => codeEl.focus(), 350);
    $('#sgJoinBtn').addEventListener('click', async () => {
      const code = codeEl.value.trim().toUpperCase();
      if (!code) { codeEl.focus(); return; }
      const btn = $('#sgJoinBtn'); btn.disabled = true; btn.textContent = 'Ищу…';
      const { error } = await sb.rpc('join_shared_goal', { code });
      if (error) {
        const msg = /не найдена/i.test(error.message) ? 'Цель с таким кодом не найдена' : error.message;
        toast(msg, false);
        btn.disabled = false; btn.textContent = 'Присоединиться';
        return;
      }
      await loadSharedGoals();
      haptic(15); closeSheet();
      setTimeout(() => { toast('Присоединился!'); render(); }, 180);
    });
  });
}

function openInviteSheet(code) {
  openSheet(`
    <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
    <div class="sheet-header"><h2>Код приглашения</h2>
      <button class="sheet-close" data-action="close-sheet">✕</button></div>
    <div class="sheet-body">
      <div style="text-align:center;padding:20px 0">
        <div style="font-size:40px;font-weight:800;letter-spacing:.18em;color:var(--accent)">${esc(code)}</div>
      </div>
      <div class="hint" style="text-align:center">Отправь этот код другу — он введёт его в разделе «Общие цели».</div>
    </div>
    <div class="sheet-footer">
      <button class="btn primary block" data-action="copy-code" data-code="${esc(code)}" style="margin-bottom:8px">Скопировать</button>
      <button class="btn ghost block" data-action="share-code" data-code="${esc(code)}">Поделиться</button>
    </div>
  `);
}

/* =====================================================================
   ГЛОБАЛЬНЫЕ ДЕЙСТВИЯ
   ===================================================================== */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;

  if (a === 'del-tx') {
    e.stopPropagation();
    state.transactions = state.transactions.filter(x => x.id !== el.dataset.id);
    save(); haptic(10); render();
    toast('Удалено');
  }
  if (a === 'del-tx-from-menu') {
    if (!confirm('Удалить операцию?')) return;
    state.transactions = state.transactions.filter(x => x.id !== el.dataset.id);
    save(); haptic(12); closeSheet();
    setTimeout(() => { toast('Удалено'); render(); }, 180);
  }
  if (a === 'edit-tx') {
    if (suppressEditClick) return;
    const item = el.closest('.tx-item');
    if (item?.classList.contains('swiped')) { item.classList.remove('swiped'); return; }
    openTxEditSheet(el.dataset.id);
  }
  if (a === 'open-edit-tx') {
    closeSheet();
    setTimeout(() => openTxEditSheet(el.dataset.id), 240);
  }
  if (a === 'dup-tx') {
    const t = state.transactions.find(x => x.id === el.dataset.id);
    if (!t) return;
    closeSheet();
    setTimeout(() => {
      sheetTx = { type: t.type, category: t.category, editId: null, tags: [...(t.tags || [])], subgoalContext: null };
      renderTxSheet({ amount: t.amount, note: t.note, date: todayStr() });
    }, 240);
  }
  if (a === 'del-goal') {
    if (confirm('Удалить цель?')) {
      state.goals = state.goals.filter(g => g.id !== el.dataset.id);
      save(); render();
    }
  }
  if (a === 'archive-goal') {
    const g = state.goals.find(x => x.id === el.dataset.id);
    if (!g) return;
    g.archived = true;
    g.archivedAt = new Date().toISOString();
    save(); haptic(12); toast('Убрано в архив'); render();
  }
  if (a === 'unarchive-goal') {
    const g = state.goals.find(x => x.id === el.dataset.id);
    if (!g) return;
    g.archived = false;
    g.archivedAt = null;
    save(); haptic(12); toast('Возвращена из архива'); render();
  }
  if (a === 'del-sub') {
    e.preventDefault(); e.stopPropagation();
    const g = state.goals.find(x => x.id === el.dataset.goal);
    if (g) { g.subgoals = g.subgoals.filter(s => s.id !== el.dataset.sub); save(); haptic(10); render(); }
  }
  if (a === 'spend-sub') {
    e.preventDefault(); e.stopPropagation();
    openSpendSubgoalSheet(el.dataset.goal, el.dataset.sub);
  }
  if (a === 'new-note') {
    state.notes.unshift({ id: uid(), title: '', text: '', updated: new Date().toISOString() });
    save(); render();
    setTimeout(() => { const f = document.querySelector('.note-card input.note-title'); if (f) f.focus(); }, 30);
  }
  if (a === 'del-note') {
    state.notes = state.notes.filter(n => n.id !== el.dataset.id); save(); haptic(10); render();
  }
  if (a === 'reset') {
    if (confirm('Удалить ВСЕ данные? Это необратимо.')) {
      state = blankState();
      save(); render();
    }
  }
  if (a === 'demo') loadDemo();
  if (a === 'force-sync') { closeSheet(); pushToCloud(); }
  if (a === 'logout') {
    if (confirm('Выйти? Данные останутся в облаке.')) {
      closeSheet(); unsubscribeRealtime(); sb.auth.signOut();
    }
  }
  if (a === 'edit-budgets') openBudgetSheet();
  if (a === 'edit-autosave') openAutoSaveSheet(el.dataset.id);
  if (a === 'new-recurring') openRecurringSheet();
  if (a === 'toggle-recurring') {
    const r = state.recurring.find(x => x.id === el.dataset.id);
    if (r) { r.active = !r.active; save(); haptic(8); render(); }
  }
  if (a === 'del-recurring') {
    if (confirm('Удалить регулярный платёж?')) {
      state.recurring = state.recurring.filter(x => x.id !== el.dataset.id);
      save(); render();
    }
  }
  if (a === 'new-shared') openSharedGoalSheet();
  if (a === 'join-shared') openJoinSharedSheet();
  if (a === 'show-invite') openInviteSheet(el.dataset.code);
  if (a === 'copy-code') {
    const code = el.dataset.code;
    try { await navigator.clipboard.writeText(code); toast('Код скопирован'); }
    catch { toast('Не удалось скопировать', false); }
  }
  if (a === 'share-code') {
    const code = el.dataset.code;
    if (navigator.share) {
      try { await navigator.share({ title: 'Код для общей цели', text: `Присоединяйся: ${code}` }); } catch {}
    } else {
      try { await navigator.clipboard.writeText(code); toast('Код скопирован'); } catch {}
    }
  }
  if (a === 'leave-shared') {
    if (!confirm('Выйти из общей цели?')) return;
    const { error } = await sb.from('shared_goal_members')
      .delete().eq('goal_id', el.dataset.id).eq('user_id', currentUser.id);
    if (error) { toast('Ошибка: ' + error.message, false); return; }
    await loadSharedGoals(); haptic(12); toast('Вышел'); render();
  }
  if (a === 'del-shared') {
    if (!confirm('Удалить общую цель для всех участников?')) return;
    const { error } = await sb.from('shared_goals').delete().eq('id', el.dataset.id);
    if (error) { toast('Ошибка: ' + error.message, false); return; }
    await loadSharedGoals(); haptic(12); toast('Удалено'); render();
  }
  if (a === 'del-shared-deposit') {
    const { error } = await sb.from('shared_goal_deposits').delete().eq('id', el.dataset.id);
    if (error) { toast('Ошибка: ' + error.message, false); return; }
    await loadSharedGoals(); render();
  }
  if (a === 'goto-goals') goTab('goals');
});

document.addEventListener('click', e => {
  const c = e.target.closest('[data-period]');
  if (c) { uiPeriod = c.dataset.period; haptic(5); render(); return; }
  const gv = e.target.closest('[data-goals-view]');
  if (gv) { goalsView = gv.dataset.goalsView; haptic(5); render(); return; }
});

document.addEventListener('change', e => {
  const cb = e.target.closest('[data-action="toggle-sub"]');
  if (!cb) return;
  const g = state.goals.find(x => x.id === cb.dataset.goal);
  if (!g) return;
  const s = g.subgoals.find(x => x.id === cb.dataset.sub);
  if (!s) return;
  s.done = cb.checked;
  save(); haptic(8);
  setTimeout(render, 200);
});

document.addEventListener('submit', async e => {
  const form = e.target;
  if (form.classList.contains('sub-add')) {
    e.preventDefault();
    const g = state.goals.find(x => x.id === form.dataset.goal);
    if (!g) return;
    const title = form.querySelector('[name=title]').value.trim();
    const amount = parseFloat(form.querySelector('[name=amount]').value);
    if (!title || !amount || amount <= 0) return;
    g.subgoals = g.subgoals || [];
    g.subgoals.push({ id: uid(), title, amount, done: false, spentAt: null });
    save(); haptic(10); toast('Подцель добавлена'); render();
  }
  if (form.classList.contains('deposit-row')) {
    e.preventDefault();
    const g = state.goals.find(x => x.id === form.dataset.goal);
    if (g) {
      const bd = goalBreakdown(g);
      let amount = parseFloat(form.querySelector('[name=amount]').value);
      if (!amount || amount <= 0) return;
      if (amount > bd.remaining) {
        amount = bd.remaining;
        toast(`Отложено максимум ${fmt(amount)} — столько осталось`, false);
      }
      if (amount <= 0) return;
      g.deposits = (Number(g.deposits) || 0) + amount;
      save(); haptic(12);
      if (bd.remaining - amount > 0.001) {
        /* не последний вклад — показываем тост */
        toast(`Отложено ${fmt(amount)}`);
      }
      render();
      return;
    }
    const sgId = form.dataset.shared;
    if (sgId) {
      const amount = parseFloat(form.querySelector('[name=amount]').value);
      if (!amount || amount <= 0) return;
      const { error } = await sb.from('shared_goal_deposits').insert({
        goal_id: sgId, user_id: currentUser.id, amount, date: todayStr(),
      });
      if (error) { toast('Ошибка: ' + error.message, false); return; }
      await loadSharedGoals(); haptic(12); toast(`Отложено ${fmt(amount)}`); render();
    }
  }
});

/* =====================================================================
   СТАРТ
   ===================================================================== */
loadLocal();
loadLocalShared();

async function handleSession(session) {
  const wasUser = !!currentUser;
  currentUser = session?.user || null;

  if (currentUser && !wasUser) {
    const lastUser = localStorage.getItem(LAST_USER_KEY);
    if (lastUser && lastUser !== currentUser.id) {
      state = blankState();
      sharedGoals = [];
      saveLocalShared();
    }
    localStorage.setItem(LAST_USER_KEY, currentUser.id);

    showApp();
    $('#pageTitle').textContent = TITLES[currentTab];
    setSyncStatus('syncing');

    const { found } = await pullFromCloud();
    if (!found) await pushToCloud();

    runRecurring();
    await loadSharedGoals();

    setSyncStatus('ok');
    subscribeRealtime();
    render(true);

  } else if (!currentUser && wasUser) {
    unsubscribeRealtime();
    showAuth();
  } else if (!currentUser) {
    showAuth();
  }
}

(async () => {
  try {
    const { data: { session } } = await sb.auth.getSession();
    await handleSession(session);
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' || event === 'SIGNED_OUT' || event === 'USER_UPDATED') {
        handleSession(session);
      }
    });
  } catch (e) {
    console.error('Auth init error:', e);
    showAuth();
    showAuthMsg('Не удалось подключиться. Проверь SUPABASE_URL и ключ.', 'err');
  }
})();

let lastFocus = Date.now();
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  if (!currentUser) return;
  if (Date.now() - lastFocus < 60000) return;
  lastFocus = Date.now();
  if (syncState === 'ok') {
    const { found } = await pullFromCloud();
    if (found) render();
  }
  await loadSharedGoals();
  if (currentTab === 'goals') render();
});
