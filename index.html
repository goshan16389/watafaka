let sheetTx = { type:'expense', category:'food', editId: null, tags: [], subgoalContext: null };

function openTxSheet() {
  sheetTx = { type:'expense', category:'food', editId: null, tags: [], subgoalContext: null };
  renderTxSheet();
}
function openTxEditSheet(id) {
  const t = state.transactions.find(x => x.id === id);
  if (!t) return;
  sheetTx = { type: t.type, category: t.category, editId: id, tags: [...(t.tags || [])], subgoalContext: null };
  renderTxSheet({ amount: t.amount, note: t.note, date: t.date });
}
function openSpendSubgoalSheet(goalId, subId) {
  const g = state.goals.find(x => x.id === goalId);
  if (!g) return;
  const s = (g.subgoals || []).find(x => x.id === subId);
  if (!s) return;
  const goalTag = slugTag(g.title);
  sheetTx = {
    type: 'expense',
    category: 'other',
    editId: null,
    tags: goalTag ? [goalTag] : [],
    subgoalContext: { goalId, subId },
  };
  renderTxSheet({ amount: s.amount || '', note: s.title, date: todayStr() });
}

function renderTxSheet(prefill) {
  const cats = sortCatsByUsage(sheetTx.type === 'expense' ? getExpenseCats() : getIncomeCats());
  if (!cats.some(c => c.id === sheetTx.category)) sheetTx.category = cats[0].id;
  const editing = !!sheetTx.editId;
  const ctx = sheetTx.subgoalContext;
  const ctxGoal = ctx ? state.goals.find(x => x.id === ctx.goalId) : null;
  const ctxSub  = ctxGoal ? (ctxGoal.subgoals || []).find(s => s.id === ctx.subId) : null;

  const html = `
    <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
    <div class="sheet-header">
      <h2>${editing ? 'Редактировать' : 'Новая операция'}</h2>
      <button class="sheet-close" data-action="close-sheet">✕</button>
    </div>
    <div class="sheet-body">
      ${ctxSub ? `
        <div class="card" style="margin:0 0 14px;background:rgba(79,140,255,.08);border-color:rgba(79,140,255,.25)">
          <div class="hint" style="margin:0 0 4px">Записать расход на подцель</div>
          <div style="font-weight:600">${esc(ctxSub.title)} <span style="color:var(--muted);font-weight:400">· цель «${esc(ctxGoal.title)}»</span></div>
        </div>
      ` : ''}
      <div class="seg">
        <button class="seg-btn ${sheetTx.type==='expense'?'active':''}" data-sheet-type="expense">− Расход</button>
        <button class="seg-btn ${sheetTx.type==='income'?'active':''}" data-sheet-type="income">+ Доход</button>
      </div>
      <div class="amount-wrap">
        <input id="txAmount" class="amount-input" type="number" step="0.01" min="0"
               placeholder="0" inputmode="decimal" data-autofocus value="${prefill ? prefill.amount : ''}">
        <span class="amount-cur">${state.currency}</span>
      </div>
      <div class="quick-amounts" id="quickAmounts">
        <button type="button" class="quick-btn" data-quick="10">+10</button>
        <button type="button" class="quick-btn" data-quick="50">+50</button>
        <button type="button" class="quick-btn" data-quick="100">+100</button>
        <button type="button" class="quick-btn" data-quick="500">+500</button>
      </div>
      <div class="cat-grid" id="txCatGrid">
        ${cats.map(c => `
          <button type="button" class="cat-cell ${c.id===sheetTx.category?'active':''} ${isCustomCat(c.id)?'custom-cat':''}" data-sheet-cat="${c.id}">
            <span class="ci">${c.icon}</span><span class="cn">${esc(c.name)}</span>
          </button>`).join('')}
        <button type="button" class="cat-cell cat-add" data-sheet-cat-add>
          <span class="ci">➕</span><span class="cn">Новая</span>
        </button>
      </div>
      <div class="new-cat-form" id="newCatForm">
        <div class="section-title" style="margin:0 0 10px">Новая категория</div>
        <input id="ncName" placeholder="Название (например, Питомец)" autocomplete="off" maxlength="24" style="margin-bottom:10px">
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
          <div id="ncPreview" style="width:46px;height:46px;flex:0 0 46px;border-radius:12px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:24px">🏷️</div>
          <input id="ncIcon" maxlength="4" placeholder="🏷️" style="width:70px;text-align:center;font-size:20px;flex:0 0 auto">
          <span class="hint" style="margin:0">Тыкни эмодзи ↓ или впиши свой</span>
        </div>
        <div class="emoji-grid" id="ncEmojiGrid">
          ${EMOJI_PICKER.map(e => `<button type="button" class="emoji-btn" data-emoji="${e}">${e}</button>`).join('')}
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn ghost sm" id="ncCancel" type="button" style="flex:1">Отмена</button>
          <button class="btn primary sm" id="ncCreate" type="button" style="flex:1">Создать</button>
        </div>
      </div>
      <div class="field"><input id="txNote" placeholder="Комментарий (необязательно)" value="${prefill ? esc(prefill.note || '') : ''}"></div>
      <div class="field">
        <label>Метки (необязательно)</label>
        <div class="tags-input-wrap">
          <div class="tags-selected" id="tagsSelected"></div>
          <input id="tagInput" placeholder="Введи и Enter — добавить" autocomplete="off">
          <div class="tags-suggest" id="tagsSuggest"></div>
        </div>
      </div>
      <div class="field" style="margin-bottom:0"><input id="txDate" type="date" value="${prefill?.date || todayStr()}"></div>
    </div>
    <div class="sheet-footer">
      ${editing ? `<button class="btn danger block" id="txDelBtn" style="margin-bottom:8px">Удалить</button>` : ''}
      <button class="btn primary block" id="txAddBtn">${editing ? 'Сохранить' : 'Добавить'}</button>
    </div>
  `;
  openSheet(html, () => mountTxSheet(prefill));
}

function mountTxSheet() {
  const amountEl = $('#txAmount');
  const addBtn   = $('#txAddBtn');
  const catGrid  = $('#txCatGrid');
  const editing = !!sheetTx.editId;

  const updateBtn = () => {
    const v = parseFloat(amountEl.value);
    const base = editing ? 'Сохранить' : 'Добавить';
    addBtn.textContent = v > 0 ? `${base} ${fmt(v)}` : base;
  };
  amountEl.addEventListener('input', updateBtn); updateBtn();

  const quickWrap = $('#quickAmounts');
  if (quickWrap) {
    quickWrap.addEventListener('click', e => {
      const b = e.target.closest('[data-quick]');
      if (!b) return;
      const cur = parseFloat(amountEl.value) || 0;
      amountEl.value = cur + parseFloat(b.dataset.quick);
      amountEl.dispatchEvent(new Event('input'));
      haptic(8);
    });
  }

  document.querySelectorAll('[data-sheet-type]').forEach(b => {
    b.addEventListener('click', () => {
      sheetTx.type = b.dataset.sheetType;
      haptic(5);
      const v = amountEl.value;
      const n = $('#txNote')?.value || '';
      const d = $('#txDate')?.value || todayStr();
      const cats = sheetTx.type === 'expense' ? getExpenseCats() : getIncomeCats();
      if (!cats.some(c => c.id === sheetTx.category)) sheetTx.category = cats[0].id;
      renderTxSheet({ amount: v, note: n, date: d });
    });
  });

  const newCatForm = $('#newCatForm');
  const ncName  = $('#ncName');
  const ncIcon  = $('#ncIcon');
  const ncPreview = $('#ncPreview');
  let ncIconValue = '🏷️';
  const setNcIcon = (v) => {
    ncIconValue = (v && String(v).trim()) ? String(v).trim().slice(0,4) : '🏷️';
    ncPreview.textContent = ncIconValue;
  };

  catGrid.addEventListener('click', e => {
    const addBtnCell = e.target.closest('[data-sheet-cat-add]');
    if (addBtnCell) {
      newCatForm.style.display = 'block';
      setTimeout(() => {
        newCatForm.scrollIntoView({ behavior:'smooth', block:'center' });
        ncName.focus();
      }, 60);
      haptic(5);
      return;
    }
    const c = e.target.closest('[data-sheet-cat]');
    if (!c) return;
    sheetTx.category = c.dataset.sheetCat;
    catGrid.querySelectorAll('.cat-cell').forEach(x => x.classList.toggle('active', x === c));
    haptic(5);
  });

  ncIcon.addEventListener('input', () => setNcIcon(ncIcon.value));
  $('#ncEmojiGrid').addEventListener('click', e => {
    const b = e.target.closest('.emoji-btn');
    if (!b) return;
    ncIcon.value = b.dataset.emoji;
    setNcIcon(b.dataset.emoji);
    document.querySelectorAll('#ncEmojiGrid .emoji-btn').forEach(x =>
      x.classList.toggle('active', x === b));
    haptic(5);
  });
  $('#ncCancel').addEventListener('click', () => {
    newCatForm.style.display = 'none';
    ncName.value = ''; ncIcon.value = ''; setNcIcon('🏷️');
    document.querySelectorAll('#ncEmojiGrid .emoji-btn').forEach(x => x.classList.remove('active'));
  });
  $('#ncCreate').addEventListener('click', () => {
    const name = ncName.value.trim();
    if (!name) { ncName.focus(); return; }
    const id = 'c_' + uid();
    if (!state.customCats) state.customCats = { expense: [], income: [] };
    const bucket = sheetTx.type === 'expense' ? 'expense' : 'income';
    state.customCats[bucket] = state.customCats[bucket] || [];
    if (state.customCats[bucket].some(c => c.name.toLowerCase() === name.toLowerCase())) {
      toast('Такая категория уже есть', false);
      return;
    }
    state.customCats[bucket].push({ id, name, icon: ncIconValue, custom: true });
    sheetTx.category = id;
    awardXP(XP_REWARDS.customCat);
    save(); haptic(12);
    const v = amountEl.value;
    const n = $('#txNote')?.value || '';
    const d = $('#txDate')?.value || todayStr();
    toast('Категория добавлена');
    renderTxSheet({ amount: v, note: n, date: d });
  });

  const tagsSelected = $('#tagsSelected');
  const tagsSuggest = $('#tagsSuggest');
  const tagInput = $('#tagInput');
  const renderTags = () => {
    tagsSelected.innerHTML = sheetTx.tags.map(t => `
      <span class="tag-chip">#${esc(t)}<button type="button" data-tag-remove="${esc(t)}">✕</button></span>
    `).join('');
  };
  const renderSuggest = () => {
    const all = getAllTags().filter(t => !sheetTx.tags.includes(t));
    if (!all.length) { tagsSuggest.innerHTML = ''; return; }
    tagsSuggest.innerHTML = all.slice(0, 20).map(t =>
      `<button type="button" class="tag-suggest" data-tag-add="${esc(t)}">#${esc(t)}</button>`
    ).join('');
  };
  const addTag = (t) => {
    t = String(t || '').trim().replace(/^#/, '').replace(/\s+/g, '_').toLowerCase();
    if (!t) return;
    if (sheetTx.tags.includes(t)) { tagInput.value = ''; return; }
    sheetTx.tags.push(t);
    renderTags(); renderSuggest();
    tagInput.value = '';
  };
  const removeTag = (t) => {
    sheetTx.tags = sheetTx.tags.filter(x => x !== t);
    renderTags(); renderSuggest();
  };
  if (tagInput) {
    tagInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault(); addTag(tagInput.value);
      } else if (e.key === 'Backspace' && !tagInput.value && sheetTx.tags.length) {
        removeTag(sheetTx.tags[sheetTx.tags.length - 1]);
      }
    });
    tagsSelected.addEventListener('click', e => {
      const b = e.target.closest('[data-tag-remove]');
      if (!b) return;
      removeTag(b.dataset.tagRemove);
    });
    tagsSuggest.addEventListener('click', e => {
      const b = e.target.closest('[data-tag-add]');
      if (!b) return;
      addTag(b.dataset.tagAdd);
    });
    attachHorizontalWheel(tagsSelected);
    attachHorizontalWheel(tagsSuggest);
    renderTags(); renderSuggest();
  }

  const saveTx = () => {
    const amount = parseFloat(amountEl.value);
    if (!amount || amount <= 0) {
      amountEl.focus();
      amountEl.style.borderColor = 'var(--red)';
      setTimeout(() => amountEl.style.borderColor = '', 800);
      return;
    }
    const rawTag = tagInput?.value.trim();
    if (rawTag) addTag(rawTag);

    const data = {
      type: sheetTx.type, amount, category: sheetTx.category,
      note: $('#txNote').value.trim(),
      date: $('#txDate').value || todayStr(),
      tags: [...sheetTx.tags],
    };

    let txId = null;

    if (editing) {
      const t = state.transactions.find(x => x.id === sheetTx.editId);
      if (t) { Object.assign(t, data); txId = t.id; }
    } else {
      txId = uid();
      state.transactions.push({ id: txId, ...data, createdAt: new Date().toISOString() });
      state.categoryUsage[sheetTx.category] = (state.categoryUsage[sheetTx.category] || 0) + 1;

      awardXP(data.type === 'income' ? XP_REWARDS.income : XP_REWARDS.tx);
      bumpDaily('tx');
      bumpDaily(data.type === 'expense' ? 'expense' : 'income');
      if (data.tags.length) bumpDaily('tag', data.tags.length);
      touchStreak();
      normalizeGame();
      state.game.gold += data.type === 'income' ? 5 : 2;

      if (data.type === 'income') {
        const pending = [];
        state.goals.forEach(g => {
          if (g.archived) return;
          const pct = Number(g.autoSavePercent) || 0;
          if (pct <= 0) return;
          const bd = goalBreakdown(g);
          if (bd.remaining <= 0) return;
          let add = amount * pct / 100;
          if (add > bd.remaining) add = bd.remaining;
          if (add <= 0) return;
          pending.push({ goalId: g.id, goalTitle: g.title, amount: add });
        });
        if (pending.length) window._pendingAutoSaves = { list: pending, date: data.date };
      }
    }

    if (sheetTx.subgoalContext) {
      const g = state.goals.find(x => x.id === sheetTx.subgoalContext.goalId);
      if (g) {
        const s = (g.subgoals || []).find(x => x.id === sheetTx.subgoalContext.subId);
        if (s) { s.spentAt = txId; s.spentDate = data.date; s.done = true; }
      }
    }

    save(); haptic(15); closeSheet();
    setTimeout(() => {
      toast(editing ? 'Сохранено' : (data.type === 'income' ? `Доход ${fmt(amount)} записан` : `Расход ${fmt(amount)} записан`));
      render();
      if (window._pendingAutoSaves) {
        const p = window._pendingAutoSaves;
        window._pendingAutoSaves = null;
        setTimeout(() => openConfirmSavingsSheet(p.list, p.date, { auto: true }), 260);
      }
    }, 180);
  };
  addBtn.addEventListener('click', saveTx);
  amountEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveTx(); } });
  $('#txNote').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveTx(); } });

  if (editing) {
    $('#txDelBtn').addEventListener('click', () => {
      if (confirm('Удалить операцию?')) {
        const t = state.transactions.find(x => x.id === sheetTx.editId);
        if (t && t.goalId) {
          const g = state.goals.find(gg => gg.id === t.goalId);
          if (g) g.deposits = Math.max(0, (Number(g.deposits) || 0) - t.amount);
        }
        state.transactions = state.transactions.filter(x => x.id !== sheetTx.editId);
        save(); haptic(12); closeSheet();
        setTimeout(() => { toast('Удалено'); render(); }, 180);
      }
    });
  }
}

function mountLongPress() {
  document.querySelectorAll('.tx-content[data-action="edit-tx"]').forEach(el => {
    if (el._longPressMounted) return;
    el._longPressMounted = true;
    const id = el.dataset.id;
    if (!id) return;
    let timer = null, moved = false;
    const cancel = () => { clearTimeout(timer); timer = null; };
    const startTimer = () => {
      moved = false;
      cancel();
      timer = setTimeout(() => {
        if (!moved) {
          suppressEditClick = true;
          setTimeout(() => { suppressEditClick = false; }, 800);
          haptic(20); showTxMenu(id);
        }
      }, 500);
    };
    const onMove = () => { moved = true; cancel(); };
    el.addEventListener('touchstart', startTimer, { passive: true });
    el.addEventListener('touchend', cancel);
    el.addEventListener('touchmove', onMove, { passive: true });
    el.addEventListener('touchcancel', cancel);
    el.addEventListener('mousedown', e => { if (e.button !== 0) return; startTimer(); });
    el.addEventListener('mouseup', cancel);
    el.addEventListener('mouseleave', cancel);
    el.addEventListener('contextmenu', e => {
      e.preventDefault();
      suppressEditClick = true;
      setTimeout(() => { suppressEditClick = false; }, 800);
      showTxMenu(id);
    });
  });
}

/* =====================================================================
   SWIPE
   ===================================================================== */
function mountSwipe() {
  document.querySelectorAll('.tx-item').forEach(item => {
    if (item._swipeMounted) return;
    item._swipeMounted = true;
    const content = item.querySelector('.tx-content');
    if (!content) return;
    let start = null;
    item.addEventListener('touchstart', e => {
      if (e.target.closest('[data-action="del-tx"]')) return;
      start = { x: e.touches[0].clientX, y: e.touches[0].clientY, swiped: false };
    }, { passive: true });
    item.addEventListener('touchmove', e => {
      if (!start) return;
      const dx = e.touches[0].clientX - start.x;
      const dy = e.touches[0].clientY - start.y;
      if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 12) { start = null; return; }
      if (Math.abs(dx) > 8) {
        start.swiped = true;
        content.classList.add('dragging');
        const shift = Math.max(-72, Math.min(0, dx));
        content.style.transform = `translateX(${shift}px)`;
      }
    }, { passive: true });
    item.addEventListener('touchend', e => {
      if (!start) return;
      const dx = (e.changedTouches[0]?.clientX || 0) - start.x;
      content.classList.remove('dragging');
      content.style.transform = '';
      document.querySelectorAll('.tx-item').forEach(i => i.classList.remove('swiped'));
      if (start.swiped && dx < -40) {
        item.classList.add('swiped'); haptic(6);
        suppressEditClick = true;
        setTimeout(() => { suppressEditClick = false; }, 300);
      }
      start = null;
    });
  });
  document.addEventListener('touchstart', e => {
    if (!e.target.closest('.tx-item.swiped')) {
      document.querySelectorAll('.tx-item.swiped').forEach(i => i.classList.remove('swiped'));
    }
  }, { passive: true });
}

   ===================================================================== */
function openGoalSheet(goal) {
  const editing = !!goal;
  const defDeadline = (editing && goal.deadline) ? goal.deadline
    : new Date(Date.now() + 180*86400000).toISOString().slice(0,10);
  const html = `
    <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
    <div class="sheet-header"><h2>${editing ? 'Редактировать цель' : 'Новая цель'}</h2>
      <button class="sheet-close" data-action="close-sheet">✕</button></div>
    <div class="sheet-body">
      <div class="field"><label>На что копим</label>
        <input id="gTitle" placeholder="Например: Поездка в Европу" data-autofocus value="${esc(editing ? goal.title : '')}"></div>
      <div class="field"><label>Нужная сумма</label>
        <input id="gTarget" type="number" step="0.01" min="0" inputmode="decimal" placeholder="1500" value="${editing ? goal.target : ''}"></div>
      ${editing ? `<div class="field"><label>Уже отложено</label>
        <input id="gDeposits" type="number" step="0.01" min="0" inputmode="decimal" value="${Number(goal.deposits) || 0}"></div>` : ''}
      <div class="field"><label>Срок</label>
        <input id="gDeadline" type="date" value="${defDeadline}"></div>
      <div class="hint" id="gPreview">Введи сумму и срок — покажу, сколько откладывать в месяц.</div>
    </div>
    <div class="sheet-footer"><button class="btn primary block" id="gAddBtn">${editing ? 'Сохранить' : 'Создать цель'}</button></div>
  `;
  openSheet(html, () => {
    const titleEl = $('#gTitle'), targetEl = $('#gTarget'), dlEl = $('#gDeadline');
    const depositsEl = $('#gDeposits');
    const preview = $('#gPreview'), addBtn = $('#gAddBtn');
    const baseLabel = editing ? 'Сохранить' : 'Создать цель';
    const upd = () => {
      const target = parseFloat(targetEl.value), dl = dlEl.value;
      if (!target || !dl) {
        preview.textContent = 'Введи сумму и срок — покажу, сколько откладывать в месяц.';
        addBtn.textContent = baseLabel;
        return;
      }
      const m = monthsUntil(dl);
      if (m <= 0) { preview.textContent = 'Срок уже прошёл — выбери дату в будущем.'; return; }
      const saved = editing && depositsEl ? (parseFloat(depositsEl.value) || 0) : 0;
      const remaining = Math.max(0, target - saved);
      preview.innerHTML = `Нужно откладывать <b style="color:var(--accent)">${fmt(remaining/m)}</b> в месяц в течение ${m} ${plural(m,'месяца','месяцев','месяцев')}.`;
      addBtn.textContent = `${baseLabel} · ${fmt(remaining/m)}/мес`;
    };
    targetEl.addEventListener('input', upd);
    dlEl.addEventListener('change', upd);
    if (depositsEl) depositsEl.addEventListener('input', upd);
    upd();

    addBtn.addEventListener('click', () => {
      const title = titleEl.value.trim();
      const target = parseFloat(targetEl.value), deadline = dlEl.value;
      if (!title) { titleEl.focus(); return; }
      if (!target || target <= 0) { targetEl.focus(); return; }
      if (!deadline) { dlEl.focus(); return; }
      if (editing) {
        goal.title = title;
        goal.target = target;
        goal.deadline = deadline;
        if (depositsEl) goal.deposits = Math.max(0, parseFloat(depositsEl.value) || 0);
        save(); haptic(15); closeSheet();
        setTimeout(() => { toast('Цель обновлена'); render(); }, 180);
      } else {
        state.goals.push({ id: uid(), title, target, deadline, deposits: 0, subgoals: [],
          autoSavePercent: 0, archived: false, archivedAt: null,
          virtual: false, createdAt: new Date().toISOString() });
        awardXP(XP_REWARDS.goal);
        save(); haptic(15); closeSheet();
        setTimeout(() => { toast('Цель создана'); render(); }, 180);
      }
    });
  });
}

      <div class="field"><input id="recNote" placeholder="Комментарий (например, «Зарплата»)"></div>
      <div class="field"><label>День месяца</label>
        <input id="recDay" type="number" min="1" max="31" value="1" inputmode="numeric"></div>
      <div class="hint">Транзакция создастся автоматически при заходе в этот день или позже.</div>
    </div>
    <div class="sheet-footer"><button class="btn primary block" id="recAddBtn">Добавить</button></div>
  `;
  openSheet(html, mountRecSheet);
}
function mountRecSheet() {
  document.querySelectorAll('[data-rec-type]').forEach(b => {
    b.addEventListener('click', () => { recSheet.type = b.dataset.recType; haptic(5); renderRecSheet(); });
  });
  $('#recCatGrid').addEventListener('click', e => {
    const c = e.target.closest('[data-rec-cat]');
    if (!c) return;
    recSheet.category = c.dataset.recCat;
    $('#recCatGrid').querySelectorAll('.cat-cell').forEach(x => x.classList.toggle('active', x === c));
    haptic(5);
  });
  $('#recAddBtn').addEventListener('click', () => {
    const amount = parseFloat($('#recAmount').value);
    if (!amount || amount <= 0) { $('#recAmount').focus(); return; }
    const day = Math.max(1, Math.min(31, parseInt($('#recDay').value) || 1));
    state.recurring.push({
      id: uid(), type: recSheet.type, amount, category: recSheet.category,
      note: $('#recNote').value.trim(), dayOfMonth: day,
      active: true, lastRun: null, createdAt: new Date().toISOString(),
    });
    awardXP(XP_REWARDS.recurring);
    save(); haptic(12); closeSheet();
    setTimeout(() => { toast('Регулярный добавлен'); render(); }, 180);
  });
}

/* =====================================================================
   SHARED GOALS SHEETS
   ===================================================================== */
function openSharedGoalSheet() {
  const defDeadline = new Date(Date.now() + 180*86400000).toISOString().slice(0,10);
  const html = `
    <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
    <div class="sheet-header"><h2>Новая общая цель</h2>
      <button class="sheet-close" data-action="close-sheet">✕</button></div>
    <div class="sheet-body">
      <div class="field"><label>Название</label>
        <input id="sgTitle" placeholder="Например: Поездка на Байкал" data-autofocus></div>
      <div class="field"><label>Сумма</label>
        <input id="sgTarget" type="number" step="0.01" min="0" inputmode="decimal" placeholder="7000"></div>
      <div class="field"><label>Срок</label>
        <input id="sgDeadline" type="date" value="${defDeadline}"></div>
      <div class="hint">После создания ты получишь 6-значный код — отправь его друзьям.</div>
    </div>
    <div class="sheet-footer"><button class="btn primary block" id="sgAddBtn">Создать</button></div>
  `;
  openSheet(html, () => {
    $('#sgAddBtn').addEventListener('click', async () => {
      const title = $('#sgTitle').value.trim();
      const target = parseFloat($('#sgTarget').value);
      const deadline = $('#sgDeadline').value || null;
      if (!title) { $('#sgTitle').focus(); return; }
      if (!target || target <= 0) { $('#sgTarget').focus(); return; }
      const btn = $('#sgAddBtn'); btn.disabled = true; btn.textContent = 'Создаю…';
      const { error } = await sb.rpc('create_shared_goal', { title, target, deadline });
      if (error) { toast('Ошибка: ' + error.message, false); btn.disabled = false; btn.textContent = 'Создать'; return; }
      await loadSharedGoals();
      haptic(15); closeSheet();
      setTimeout(() => { toast('Общая цель создана'); render(); }, 180);
    });
  });
}

function openJoinSharedSheet() {
  const html = `
    <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
    <div class="sheet-header"><h2>Присоединиться</h2>
      <button class="sheet-close" data-action="close-sheet">✕</button></div>
    <div class="sheet-body">
      <div class="field"><label>Код приглашения</label>
        <input id="sgCode" placeholder="ABC123" data-autofocus maxlength="8"
          style="text-transform:uppercase;text-align:center;font-size:22px;font-weight:700;letter-spacing:.15em"></div>
      <div class="hint">Спроси код у того, кто создал цель.</div>
    </div>
    <div class="sheet-footer"><button class="btn primary block" id="sgJoinBtn">Присоединиться</button></div>
  `;
  openSheet(html, () => {
    const codeEl = $('#sgCode');
    setTimeout(() => codeEl.focus(), 350);
    $('#sgJoinBtn').addEventListener('click', async () => {
      const code = codeEl.value.trim().toUpperCase();
      if (!code) { codeEl.focus(); return; }
      const btn = $('#sgJoinBtn'); btn.disabled = true; btn.textContent = 'Ищу…';
      const { error } = await sb.rpc('join_shared_goal', { code });
      if (error) {
        const msg = /не найдена/i.test(error.message) ? 'Цель с таким кодом не найдена' : error.message;
        toast(msg, false);
        btn.disabled = false; btn.textContent = 'Присоединиться';
        return;
      }
      await loadSharedGoals();
      haptic(15); closeSheet();
      setTimeout(() => { toast('Присоединился!'); render(); }, 180);
    });
  });
}

/* =====================================================================
   ГЛОБАЛЬНЫЕ ДЕЙСТВИЯ
   ===================================================================== */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;

  if (a === 'del-tx') {
    e.stopPropagation();
    const tx = state.transactions.find(x => x.id === el.dataset.id);
    if (tx && tx.goalId) {
      const g = state.goals.find(gg => gg.id === tx.goalId);
      if (g) g.deposits = Math.max(0, (Number(g.deposits) || 0) - tx.amount);
    }
    state.transactions = state.transactions.filter(x => x.id !== el.dataset.id);
    save(); haptic(10); render();
    toast('Удалено');
  }
  if (a === 'del-tx-from-menu') {
    if (!confirm('Удалить операцию?')) return;
    const tx = state.transactions.find(x => x.id === el.dataset.id);
    if (tx && tx.goalId) {
      const g = state.goals.find(gg => gg.id === tx.goalId);
      if (g) g.deposits = Math.max(0, (Number(g.deposits) || 0) - tx.amount);
    }
    state.transactions = state.transactions.filter(x => x.id !== el.dataset.id);
    save(); haptic(12); closeSheet();
    setTimeout(() => { toast('Удалено'); render(); }, 180);
  }
  if (a === 'del-transfer') {
    if (!confirm('Удалить вклад? Депозит цели уменьшится.')) return;
    const tx = state.transactions.find(x => x.id === el.dataset.id);
    if (tx && tx.goalId) {
      const g = state.goals.find(gg => gg.id === tx.goalId);
      if (g) g.deposits = Math.max(0, (Number(g.deposits) || 0) - tx.amount);
    }
    state.transactions = state.transactions.filter(x => x.id !== el.dataset.id);
    save(); haptic(12); closeSheet();
    setTimeout(() => { toast('Вклад удалён'); render(); }, 180);
  }
  if (a === 'edit-tx') {
    if (suppressEditClick) return;
    const item = el.closest('.tx-item');
    if (item?.classList.contains('swiped')) { item.classList.remove('swiped'); return; }
    const tx = state.transactions.find(x => x.id === el.dataset.id);
    if (tx && tx.goalId && tx.category === 'savings') { showTransferSheet(tx.id); return; }
    openTxEditSheet(el.dataset.id);
  }
  if (a === 'open-edit-tx') {
    closeSheet();
    setTimeout(() => openTxEditSheet(el.dataset.id), 240);
  }
  if (a === 'dup-tx') {
    const t = state.transactions.find(x => x.id === el.dataset.id);
    if (!t) return;
    closeSheet();
    setTimeout(() => {
      sheetTx = { type: t.type, category: t.category, editId: null, tags: [...(t.tags || [])], subgoalContext: null };
      renderTxSheet({ amount: t.amount, note: t.note, date: todayStr() });
    }, 240);
  }
  if (a === 'del-goal') {
    if (confirm('Удалить цель?')) {
      state.goals = state.goals.filter(g => g.id !== el.dataset.id);
      save(); render();
    }
  }
  if (a === 'edit-goal') {
    const g = state.goals.find(x => x.id === el.dataset.id);
    if (g) openGoalSheet(g);
  }
  if (a === 'archive-goal') {
    const g = state.goals.find(x => x.id === el.dataset.id);
    if (!g) return;
    g.archived = true;
    g.archivedAt = new Date().toISOString();
    save(); haptic(12); toast('Убрано в архив'); render();
  }
  if (a === 'unarchive-goal') {
    const g = state.goals.find(x => x.id === el.dataset.id);
    if (!g) return;
    g.archived = false;
    g.archivedAt = null;
    save(); haptic(12); toast('Возвращена из архива'); render();
  }
  if (a === 'del-sub') {
    e.preventDefault(); e.stopPropagation();
    const g = state.goals.find(x => x.id === el.dataset.goal);
    if (g) { g.subgoals = g.subgoals.filter(s => s.id !== el.dataset.sub); save(); haptic(10); render(); }
  }
  if (a === 'spend-sub') {
    e.preventDefault(); e.stopPropagation();
    openSpendSubgoalSheet(el.dataset.goal, el.dataset.sub);
  }
  if (a === 'new-note') {
    state.notes.unshift({ id: uid(), title: '', text: '', updated: new Date().toISOString() });
    awardXP(XP_REWARDS.note);
    save(); render();
    setTimeout(() => { const f = document.querySelector('.note-card input.note-title'); if (f) f.focus(); }, 30);
  }
  if (a === 'del-note') {
    state.notes = state.notes.filter(n => n.id !== el.dataset.id); save(); haptic(10); render();
  }
  if (a === 'reset') {
    if (confirm('Удалить ВСЕ данные? Это необратимо.')) {
      state = blankState();
      save(); render();
    }
  }
  if (a === 'demo') loadDemo();
  if (a === 'force-sync') { closeSheet(); pushToCloud(); }
  if (a === 'logout') {
    if (confirm('Выйти? Данные останутся в облаке.')) {
      closeSheet(); unsubscribeRealtime(); sb.auth.signOut();
    }
  }
  if (a === 'edit-budgets') openBudgetSheet();
  if (a === 'edit-autosave') openAutoSaveSheet(el.dataset.id);
  if (a === 'toggle-virtual') {
    const g = state.goals.find(x => x.id === el.dataset.id);
    if (!g) return;
    g.virtual = !g.virtual;
    save(); haptic(10);
    toast(g.virtual ? 'Виртуальная копилка включена' : 'Виртуальная копилка выключена');
    render();
  }
  if (a === 'new-recurring') openRecurringSheet();
  if (a === 'toggle-recurring') {
    const r = state.recurring.find(x => x.id === el.dataset.id);
    if (r) { r.active = !r.active; save(); haptic(8); render(); }
  }
  if (a === 'del-recurring') {
    if (confirm('Удалить регулярный платёж?')) {
      state.recurring = state.recurring.filter(x => x.id !== el.dataset.id);
      save(); render();
    }
  }
  if (a === 'new-shared') openSharedGoalSheet();
  if (a === 'join-shared') openJoinSharedSheet();
  if (a === 'show-invite') openInviteSheet(el.dataset.code);
  if (a === 'copy-code') {
    const code = el.dataset.code;
    try { await navigator.clipboard.writeText(code); toast('Код скопирован'); }
    catch { toast('Не удалось скопировать', false); }
  }
  if (a === 'share-code') {
    const code = el.dataset.code;
    if (navigator.share) {
      try { await navigator.share({ title: 'Код для общей цели', text: `Присоединяйся: ${code}` }); } catch {}
    } else {
      try { await navigator.clipboard.writeText(code); toast('Код скопирован'); } catch {}
    }
  }
  if (a === 'leave-shared') {
    if (!confirm('Выйти из общей цели?')) return;
    const { error } = await sb.from('shared_goal_members')
      .delete().eq('goal_id', el.dataset.id).eq('user_id', currentUser.id);
    if (error) { toast('Ошибка: ' + error.message, false); return; }
    await loadSharedGoals(); haptic(12); toast('Вышел'); render();
  }
  if (a === 'del-shared') {
    if (!confirm('Удалить общую цель для всех участников?')) return;
    const { error } = await sb.from('shared_goals').delete().eq('id', el.dataset.id);
    if (error) { toast('Ошибка: ' + error.message, false); return; }
    await loadSharedGoals(); haptic(12); toast('Удалено'); render();
  }
  if (a === 'del-shared-deposit') {
    const { error } = await sb.from('shared_goal_deposits').delete().eq('id', el.dataset.id);
    if (error) { toast('Ошибка: ' + error.message, false); return; }
    await loadSharedGoals(); render();
  }
  if (a === 'del-custom-cat') {
    e.preventDefault(); e.stopPropagation();
    if (!confirm('Удалить категорию? Транзакции с ней останутся, но будут показываться как «Без категории».')) return;
    if (state.customCats) {
      state.customCats.expense = (state.customCats.expense || []).filter(c => c.id !== el.dataset.id);
      state.customCats.income  = (state.customCats.income  || []).filter(c => c.id !== el.dataset.id);
    }
    if (state.budgets) delete state.budgets[el.dataset.id];
    save(); haptic(10); closeSheet();
    setTimeout(() => { toast('Категория удалена'); render(); }, 200);
  }
  if (a === 'goto-goals') goTab('goals');
});

document.addEventListener('click', e => {
  const c = e.target.closest('[data-period]');
  if (c) { uiPeriod = c.dataset.period; haptic(5); render(); return; }
  const gv = e.target.closest('[data-goals-view]');
  if (gv) { goalsView = gv.dataset.goalsView; haptic(5); render(); return; }
});

document.addEventListener('change', e => {
  const cb = e.target.closest('[data-action="toggle-sub"]');
  if (!cb) return;
  const g = state.goals.find(x => x.id === cb.dataset.goal);
  if (!g) return;
  const s = g.subgoals.find(x => x.id === cb.dataset.sub);
  if (!s) return;
  s.done = cb.checked;
  save(); haptic(8);
  setTimeout(render, 200);
});

document.addEventListener('submit', async e => {
  const form = e.target;
  if (form.classList.contains('sub-add')) {
    e.preventDefault();
    const g = state.goals.find(x => x.id === form.dataset.goal);
    if (!g) return;
    const title = form.querySelector('[name=title]').value.trim();
    const amount = parseFloat(form.querySelector('[name=amount]').value);
    if (!title || !amount || amount <= 0) return;
    g.subgoals = g.subgoals || [];
    g.subgoals.push({ id: uid(), title, amount, done: false, spentAt: null });
    save(); haptic(10); toast('Подцель добавлена'); render();
  }
  if (form.classList.contains('deposit-row')) {
    e.preventDefault();
    const g = state.goals.find(x => x.id === form.dataset.goal);
    if (g) {
      const bd = goalBreakdown(g);
      const input = form.querySelector('[name=amount]');
      let amount = parseFloat(input.value);
      if (!amount || amount <= 0) return;

      if (amount > bd.remaining + 0.001) {
        input.value = bd.remaining.toFixed(2);
        toast(`Больше не отложить — максимум ${fmt(bd.remaining)}. Нажми ещё раз`, false);
        input.focus();
        haptic(8);
        return;
      }
      if (bd.remaining <= 0) return;

      applySavings([{ goalId: g.id, goalTitle: g.title, amount, auto: false }], todayStr());
      awardXP(XP_REWARDS.deposit);
      bumpDaily('deposit');
      touchStreak();
      normalizeGame();
      state.game.gold += 10;
      haptic(12);
      toast(g.virtual ? `Отложено ${fmt(amount)} (виртуально)` : `Отложено ${fmt(amount)} → Накопления`);
      render();
      return;
    }
    const sgId = form.dataset.shared;
    if (sgId) {
      const amount = parseFloat(form.querySelector('[name=amount]').value);
      if (!amount || amount <= 0) return;
      const { error } = await sb.from('shared_goal_deposits').insert({
        goal_id: sgId, user_id: currentUser.id, amount, date: todayStr(),
      });
      if (error) { toast('Ошибка: ' + error.message, false); return; }
      await loadSharedGoals(); haptic(12); toast(`Отложено ${fmt(amount)}`); render();
    }
  }
});

/* =====================================================================
   СТАРТ
   ===================================================================== */
loadLocal();
loadLocalShared();

async function handleSession(session) {
  const wasUser = !!currentUser;
  currentUser = session?.user || null;

  if (currentUser && !wasUser) {
    const lastUser = localStorage.getItem(LAST_USER_KEY);
    if (lastUser && lastUser !== currentUser.id) {
      state = blankState();
      sharedGoals = [];
      saveLocalShared();
    }
    localStorage.setItem(LAST_USER_KEY, currentUser.id);

    showApp();
    $('#pageTitle').textContent = TITLES[currentTab];
    setSyncStatus('syncing');

    const { found } = await pullFromCloud();
    if (!found) await pushToCloud();

    runRecurring();
    await loadSharedGoals();

    setSyncStatus('ok');
    subscribeRealtime();
    render(true);

  } else if (!currentUser && wasUser) {
    unsubscribeRealtime();
    showAuth();
  } else if (!currentUser) {
    showAuth();
  }
}

(async () => {
  try {
    const { data: { session } } = await sb.auth.getSession();
    await handleSession(session);
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' || event === 'SIGNED_OUT' || event === 'USER_UPDATED') {
        handleSession(session);
      }
    });
  } catch (e) {
    console.error('Auth init error:', e);
    showAuth();
    showAuthMsg('Не удалось подключиться. Проверь SUPABASE_URL и ключ.', 'err');
  }
})();

let lastFocus = Date.now();
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  if (!currentUser) return;
  if (Date.now() - lastFocus < 60000) return;
  lastFocus = Date.now();
  if (syncState === 'ok') {
    const { found } = await pullFromCloud();
    if (found) render();
  }
  await loadSharedGoals();
  if (currentTab === 'goals') render();
});
