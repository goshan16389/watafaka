<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" id="manifestLink">
<title>Финансы</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e1014;--panel:#161a22;--panel2:#1d222c;--panel3:#232936;--border:#262c3a;
  --text:#e7eaf0;--muted:#8b93a7;--accent:#4f8cff;--accent-d:#3a72d9;
  --green:#3ddc97;--red:#ff5c7a;--yellow:#ffcc66;--r:16px;
  --nav-h:62px;--safe-b:env(safe-area-inset-bottom,0px);--kb:0px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,system-ui,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;border:0;background:none}
input,textarea,select{font-family:inherit}

/* AUTH */
.auth-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 600px at 50% -10%,rgba(79,140,255,.10),transparent 60%),var(--bg);
  z-index:500;overflow-y:auto}
.auth-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);
  border-radius:20px;padding:28px 24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.auth-logo{font-size:26px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.auth-sub{color:var(--muted);font-size:14px;margin-bottom:22px;line-height:1.5}
.auth-tabs{display:flex;gap:5px;background:var(--panel2);padding:5px;border-radius:14px;margin-bottom:18px}
.auth-tab{flex:1;padding:10px;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;font-size:14px;transition:.15s}
.auth-tab.active{background:var(--panel);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.auth-field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.auth-field label{font-size:12.5px;color:var(--muted);font-weight:500}
.auth-field input{background:var(--panel2);border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;outline:none;width:100%;font-size:16px}
.auth-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
.auth-btn{width:100%;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:15px;margin-top:6px}
.auth-btn:active{transform:scale(.98)}
.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.auth-msg{margin-top:14px;padding:11px 13px;border-radius:11px;font-size:13.5px;line-height:1.45;display:none}
.auth-msg.show{display:block}
.auth-msg.err{background:rgba(255,92,122,.12);color:#ff8da1;border:1px solid rgba(255,92,122,.25)}
.auth-msg.info{background:rgba(79,140,255,.12);color:#9ec0ff;border:1px solid rgba(79,140,255,.25)}

/* LAYOUT */
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0;padding:24px 28px 80px;max-width:1080px;margin:0 auto;width:100%}

/* SIDEBAR / BOTTOM NAV */
.sidebar{width:228px;flex:0 0 228px;background:var(--panel);border-right:1px solid var(--border);
  padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;z-index:40}
.logo{font-size:17px;font-weight:700;padding:4px 10px 18px;display:flex;align-items:center;gap:9px}
.nav-btn{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;background:transparent;
  color:var(--muted);cursor:pointer;width:100%;text-align:left;transition:.15s;font-size:14.5px;font-weight:500}
.nav-btn i{font-style:normal;font-size:17px;width:20px;text-align:center}
.nav-btn:hover{background:var(--panel2);color:var(--text)}
.nav-btn.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 8px 20px -10px var(--accent)}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.topbar h1{font-size:23px;font-weight:700;letter-spacing:-.015em}
.topbar-right{display:flex;align-items:center;gap:8px}
.cur{background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:7px 10px;cursor:pointer;font-size:13px;font-weight:500}
.user-badge{display:flex;align-items:center;gap:8px;padding:5px;background:var(--panel);
  border:1px solid var(--border);border-radius:99px;position:relative;transition:.15s}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4f8cff,#7aa8ff);
  color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;text-transform:uppercase}
.sync-dot{position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--panel);transition:background .25s}
.sync-dot.ok{background:var(--green)}
.sync-dot.syncing,.sync-dot.pending{background:var(--yellow);animation:pulse 1s infinite}
.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* CARDS */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:18px}
.card + .card{margin-top:14px}
.section-title{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  font-weight:700;margin:26px 0 12px}
.section-title:first-child{margin-top:0}

/* DASHBOARD */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat .lbl{font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.stat .val{font-size:21px;font-weight:700;letter-spacing:-.02em}
.stat .sub{font-size:12px;color:var(--muted);margin-top:4px}
.pos{color:var(--green)} .neg{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.cat-row{margin-bottom:14px}
.cat-row:last-child{margin-bottom:0}
.cat-head{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:7px;gap:10px}
.cat-head .amt{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#7aa8ff);
  transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar-fill.green{background:linear-gradient(90deg,#2fbf85,var(--green))}

/* TX ITEM (со свайпом) */
.tx-item{position:relative;overflow:hidden;border-bottom:1px solid var(--border)}
.tx-item:last-child{border-bottom:0}
.tx-content{position:relative;background:var(--panel);display:flex;align-items:center;gap:12px;
  padding:11px 0;transition:transform .2s ease;will-change:transform;cursor:pointer}
.tx-item.swiped .tx-content{transform:translateX(-72px)}
.tx-content.dragging{transition:none}
.tx-delete-bg{position:absolute;right:0;top:0;bottom:0;width:72px;background:var(--red);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.tx-ico{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:var(--panel2);
  display:flex;align-items:center;justify-content:center;font-size:17px}
.tx-mid{flex:1;min-width:0}
.tx-title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:12px;color:var(--muted);margin-top:1px}
.tx-amt{font-weight:600;font-size:14.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.icon-btn{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:16px;
  padding:6px 8px;border-radius:9px;line-height:1;transition:.15s;flex:0 0 auto}
.icon-btn:hover{background:var(--panel2);color:var(--red)}

/* CHART */
.chart{display:flex;gap:8px;align-items:flex-end;padding:14px 0 0;min-height:140px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.chart-bar{width:100%;max-width:44px;background:linear-gradient(180deg,var(--accent),#2a5fc9);
  border-radius:6px 6px 2px 2px;min-height:4px;transition:height .4s;position:relative}
.chart-bar.current{background:linear-gradient(180deg,#ffcc66,#d99e2e)}
.chart-label{font-size:11px;color:var(--muted);text-transform:lowercase}

/* FORMS */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
input,textarea,select{background:var(--panel2);border:1.5px solid var(--border);border-radius:12px;
  padding:12px 14px;outline:none;transition:.15s;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
input::placeholder,textarea::placeholder{color:#5a6277}
textarea{resize:vertical;min-height:80px;line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:600;background:var(--panel2);
  color:var(--text);transition:.15s;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 22px -10px var(--accent)}
.btn.primary:hover{background:var(--accent-d)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn.danger{background:rgba(255,92,122,.15);color:#ff8da1}
.btn.block{width:100%}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:10px}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5}

/* SEGMENTED */
.seg{display:flex;gap:5px;background:var(--panel2);padding:5px;border-radius:14px;margin-bottom:16px}
.seg-btn{flex:1;border:0;background:transparent;color:var(--muted);padding:11px;border-radius:10px;
  cursor:pointer;font-weight:600;font-size:14.5px;transition:.15s}
.seg-btn.active{background:var(--panel);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.seg-btn.active[data-type="income"],.seg-btn.active[data-sheet-type="income"]{color:var(--green)}
.seg-btn.active[data-type="expense"],.seg-btn.active[data-sheet-type="expense"]{color:var(--red)}

/* AMOUNT */
.amount-wrap{position:relative;margin-bottom:16px}
.amount-input{width:100%;font-size:34px;font-weight:700;letter-spacing:-.02em;padding:14px 58px 14px 18px;
  background:var(--panel2);border:1.5px solid var(--border);border-radius:16px;-moz-appearance:textfield}
.amount-input::-webkit-outer-spin-button,.amount-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.amount-cur{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:20px;font-weight:600;pointer-events:none}

/* CATEGORY GRID */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
@media (min-width:520px){.cat-grid{grid-template-columns:repeat(4,1fr)}}
.cat-cell{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px;border-radius:14px;
  background:var(--panel2);border:1.5px solid transparent;transition:.15s;min-height:74px;justify-content:center}
.cat-cell:active{transform:scale(.94)}
.cat-cell .ci{font-size:23px;line-height:1}
.cat-cell .cn{font-size:11px;color:var(--muted);text-align:center;line-height:1.2;font-weight:500}
.cat-cell.active{background:rgba(79,140,255,.14);border-color:var(--accent)}
.cat-cell.active .cn{color:var(--text);font-weight:600}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{border:1.5px solid var(--border);background:var(--panel2);color:var(--muted);padding:9px 14px;
  border-radius:99px;cursor:pointer;font-size:13.5px;font-weight:500;transition:.15s}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* GOALS */
.goal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.goal-title{font-size:17px;font-weight:700;letter-spacing:-.01em}
.goal-deadline{font-size:12.5px;color:var(--muted);margin-top:3px}
.goal-nums{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:8px;gap:10px}
.goal-nums b{font-weight:700;font-variant-numeric:tabular-nums}
.goal-plan{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);
  margin-top:14px;padding-top:14px;border-top:1px dashed var(--border)}
.goal-plan b{color:var(--text);font-variant-numeric:tabular-nums}
.deposit-row{display:flex;gap:8px;margin-top:12px}
.deposit-row input{flex:1}
.subgoals{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border)}
.subgoal{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;background:var(--panel2);
  margin-bottom:7px;transition:.15s;cursor:pointer;border:1px solid transparent}
.subgoal input[type=checkbox]{width:19px;height:19px;flex:0 0 19px;accent-color:var(--green);cursor:pointer;padding:0}
.subgoal .t{flex:1;font-size:14px}
.subgoal .a{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.subgoal.done{background:rgba(61,220,151,.09);border-color:rgba(61,220,151,.25)}
.subgoal.done .t{color:var(--green);text-decoration:line-through}
.subgoal.done .a{color:var(--green)}
.sub-add{display:flex;gap:6px;margin-top:10px}
.sub-add input:first-child{flex:1.6}
.sub-add input:nth-child(2){flex:1;min-width:0}
.goal-done-badge{display:inline-block;background:rgba(61,220,151,.15);color:var(--green);
  padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600}
.badge{display:inline-block;font-size:11.5px;color:var(--muted);background:var(--panel2);padding:3px 9px;border-radius:99px;font-weight:500}

/* NOTES */
.note-card{position:relative;padding-top:16px}
.note-card input.note-title{background:transparent;border:0;padding:0 32px 8px 0;font-size:16px;font-weight:700;border-radius:0}
.note-card input.note-title:focus{border-bottom:1px solid var(--accent);box-shadow:none}
.note-card textarea{background:transparent;border:0;padding:10px 0 0;min-height:100px;font-size:14px;border-radius:0;line-height:1.55}
.note-card textarea:focus{box-shadow:none}
.note-del{position:absolute;top:12px;right:10px}

/* EMPTY */
.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:12px;opacity:.75;line-height:1}
.empty p{font-size:14px;max-width:400px;margin:0 auto 16px;line-height:1.6}

/* FAB */
.fab{position:fixed;right:18px;bottom:calc(20px + var(--safe-b));width:58px;height:58px;border-radius:50%;
  background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center;
  box-shadow:0 10px 28px -6px rgba(79,140,255,.55),0 4px 12px rgba(0,0,0,.35);z-index:45;transition:.15s}
.fab:active{transform:scale(.9)}
.fab svg{width:26px;height:26px;stroke-width:2.5}

/* SHEET */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:100;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--panel);border-radius:22px 22px 0 0;
  transform:translateY(100%);
  /* margin-bottom меняется мгновенно (0s), transform — плавно для open/close */
  transition:transform .34s cubic-bezier(.32,.72,0,1), margin-bottom 0s;
  z-index:101;
  /* max-height ограничен и видимой областью через --vvh */
  max-height:min(92vh, var(--vvh, 92vh));
  display:flex;flex-direction:column;
  padding-bottom:var(--safe-b);
  border-top:1px solid var(--border);
  /* сдвиг над клавиатурой — через margin, а не через bottom */
  margin-bottom:var(--kb, 0);
  will-change:transform;
}
.sheet.open{transform:translateY(0)}
.sheet-handle-wrap{padding:10px 0 6px;display:flex;justify-content:center;flex:0 0 auto}
.sheet-handle{width:42px;height:4px;border-radius:99px;background:#3a4152}
.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 12px;flex:0 0 auto}
.sheet-header h2{font-size:17px;font-weight:700}
.sheet-close{width:34px;height:34px;border-radius:50%;background:var(--panel2);color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:15px}
.sheet-body{flex:1;overflow-y:auto;padding:0 18px 4px;-webkit-overflow-scrolling:touch}
.sheet-footer{padding:14px 18px 18px;flex:0 0 auto;border-top:1px solid var(--border);background:var(--panel)}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 80px);left:50%;
  transform:translate(-50%,16px);background:var(--panel3);border:1px solid var(--border);color:var(--text);
  padding:12px 20px;border-radius:14px;font-size:14px;font-weight:500;z-index:200;opacity:0;
  transition:.25s;pointer-events:none;box-shadow:0 16px 40px rgba(0,0,0,.5);
  white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .tick{color:var(--green);margin-right:6px}

/* MOBILE */
@media (max-width:768px){
  .app{flex-direction:column}
  .sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex:none;
    flex-direction:row;justify-content:space-around;align-items:stretch;
    padding:6px 4px calc(6px + var(--safe-b));border-right:0;border-top:1px solid var(--border);
    background:rgba(22,26,34,.92);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);z-index:40;gap:0}
  .logo{display:none}
  .nav-btn{flex-direction:column;gap:2px;padding:8px 4px 6px;border-radius:12px;font-size:10px;
    font-weight:500;flex:1;max-width:84px;justify-content:center;align-items:center;text-align:center;
    background:transparent!important;box-shadow:none!important}
  .nav-btn i{font-size:21px;width:auto;line-height:1}
  .nav-btn.active{color:var(--accent)}
  .main{padding:8px 14px calc(var(--nav-h) + var(--safe-b) + 90px);max-width:none}
  .topbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--bg) 70%,rgba(14,16,20,0));
    padding:8px 0 14px;margin-bottom:8px}
  .topbar h1{font-size:22px}
  .fab{display:flex}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat .val{font-size:19px}
  .grid2{grid-template-columns:1fr;gap:12px}
  .card{padding:16px}
  .row{grid-template-columns:1fr}
  input,textarea,select{font-size:16px}
  .sub-add{flex-wrap:wrap}
  .sub-add input:first-child{flex:1 1 100%}
  .sub-add input:nth-child(2){flex:1 1 auto}
  .toast{bottom:calc(var(--nav-h) + var(--safe-b) + 100px)}
}
@media (min-width:769px){
  .sheet{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-46%) scale(.97);opacity:0;
    width:480px;max-height:85vh;border-radius:20px;transition:.24s cubic-bezier(.32,.72,0,1);
    border:1px solid var(--border);padding-bottom:0}
  .sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1}
  .sheet-handle-wrap{display:none}
  .sheet-header{padding-top:20px}
  .sheet-footer{border-radius:0 0 20px 20px}
  .tx-delete-bg{display:none}
  .tx-item .icon-btn.del-desktop{display:inline-flex}
}
@media (min-width:769px){ .tx-item .icon-btn.del-desktop{display:inline-flex} }
@media (max-width:768px){ .tx-item .icon-btn.del-desktop{display:none} }
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>

<div class="auth-screen" id="authScreen" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">💸 <span>Финансы</span></div>
    <div class="auth-sub" id="authSub">Войди, чтобы данные синхронизировались между устройствами</div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-auth-tab="login">Вход</button>
      <button class="auth-tab" data-auth-tab="register">Регистрация</button>
    </div>
    <form id="authForm" autocomplete="on">
      <div class="auth-field"><label>Email</label>

  const diff = d - now;

function sameMonth(dateStr, ref) {

  if (diff === -1) return 'завтра';
  return d.toLocaleDateString('ru-RU', { day:'numeric', month:'short' });

    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'user_data', filter: `user_id=eq.${currentUser.id}` },
      (payload) => {
        if (syncState !== 'ok') return;                    // есть локальные несинхронизированные изменения
        if (payload.new?.updated_at === lastPushTimestamp) return; // эхо нашего же пуша
        const remote = payload.new?.data;
        if (!remote || typeof remote !== 'object') return;
        state = Object.assign(
          { transactions: [], goals: [], notes: [], currency: '€', budgets: {}, recurring: [], categoryUsage: {} },
          remote
        );
        saveLocal();
        render();
        toast('Обновлено с другого устройства');

    .subscribe((status) => {
      if (status === 'SUBSCRIBED') console.log('[rt] subscribed');
      if (status === 'CHANNEL_ERROR') console.warn('[rt] channel error');
    });
}
function unsubscribeRealtime() {

}

/* =====================================================================
   REGULAR TRANSACTIONS
   ===================================================================== */
function runRecurring() {
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  let changed = false;
  (state.recurring || []).forEach(r => {
    if (!r.active) return;
    if (r.lastRun === ym) return;
    if (now.getDate() < (r.dayOfMonth || 1)) return;
    const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    const day = Math.min(r.dayOfMonth, daysInMonth);
    const dateStr = `${ym}-${String(day).padStart(2,'0')}`;
    state.transactions.push({
      id: uid(), type: r.type, amount: r.amount, category: r.category,
      note: r.note || '', date: dateStr, createdAt: new Date().toISOString(),
      recurringId: r.id,
    });
    state.categoryUsage[r.category] = (state.categoryUsage[r.category] || 0) + 1;
    r.lastRun = ym;
    changed = true;
  });
  if (changed) save();
}

async function loadSharedGoals() {

    .order('created_at', { ascending: false });
  if (error) { console.warn('shared goals load', error); return; }
  if (!goals || !goals.length) { sharedGoals = []; saveLocalShared(); return; }

  const ids = goals.map(g => g.id);
  const [mRes, dRes] = await Promise.all([
    sb.from('shared_goal_members').select('*').in('goal_id', ids),
    sb.from('shared_goal_deposits').select('*').in('goal_id', ids).order('date', { ascending: false }),
  ]);
  const members = mRes.data || [];
  const deposits = dRes.data || [];

  sharedGoals = goals.map(g => {
    const gm = members.filter(m => m.goal_id === g.id);
    const gd = deposits.filter(d => d.goal_id === g.id);
    return {
      ...g,
      members: gm,
      deposits: gd,
      total: gd.reduce((a, d) => a + Number(d.amount || 0), 0),
    };
  });
  saveLocalShared();
}

/* Когда пользователь тапнул поле ввода — прокручиваем его в видимую часть sheet.
   Работает только внутри .sheet-body, страницу не трогает. */
sheet.addEventListener('focusin', (e) => {
  const t = e.target;
  if (!(t instanceof HTMLInputElement || t instanceof HTMLTextAreaElement)) return;
  setTimeout(() => {
    const body = t.closest('.sheet-body');
    if (!body) return;
    const tr = t.getBoundingClientRect();
    const br = body.getBoundingClientRect();
    if (tr.bottom > br.bottom - 24) {
      body.scrollBy({ top: tr.bottom - br.bottom + 48, behavior: 'smooth' });
    } else if (tr.top < br.top + 24) {
      body.scrollBy({ top: tr.top - br.top - 48, behavior: 'smooth' });
    }
  }, 350);  // ждём, пока клавиатура откроется и sheet сдвинется
});

if (window.visualViewport) {
  const vv = window.visualViewport;
  const root = document.documentElement;
  let lastKb = -1, lastVvh = -1;
  const update = () => {
    const kb  = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    const vvh = Math.round(vv.height);
    if (kb === lastKb && vvh === lastVvh) return;  // игнорируем микроколебания
    lastKb = kb; lastVvh = vvh;
    root.style.setProperty('--kb', kb + 'px');
    root.style.setProperty('--vvh', vvh + 'px');
  };
  vv.addEventListener('resize', update);
  vv.addEventListener('scroll', update);
  update();
}

function render(resetScroll=false) {
  const view = $('#view');
  view.innerHTML = VIEWS[currentTab]();
  if (MOUNTS[currentTab]) MOUNTS[currentTab]();
  $('#currencySel').value = state.currency;
  if (resetScroll || lastTab !== currentTab) window.scrollTo(0, 0);
  lastTab = currentTab;
}
const VIEWS = {}; const MOUNTS = {};

/* =====================================================================
   ОБЗОР
   ===================================================================== */
VIEWS.dashboard = () => {
  const r = periodRange();
  const t = state.transactions.filter(x => inPeriod(x.date, r));
  const income  = t.filter(x => x.type === 'income').reduce((a,b) => a + b.amount, 0);
  const expense = t.filter(x => x.type === 'expense').reduce((a,b) => a + b.amount, 0);
  const balance = income - expense;
  const savedInGoals = state.goals.reduce((a,g) => a + goalSaved(g), 0);

  const byCat = {};
  t.filter(x => x.type === 'expense').forEach(x => {
    byCat[x.category] = (byCat[x.category] || 0) + x.amount;
  });
  const cats = Object.entries(byCat).sort((a,b) => b[1] - a[1]);
  const maxCat = cats.length ? cats[0][1] : 1;
  const recent = [...state.transactions]
    .sort((a,b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt)).slice(0, 6);

  return `
    <div class="chips" style="margin-bottom:16px">
      <button class="chip ${uiPeriod==='month'?'active':''}" data-period="month">Этот месяц</button>
      <button class="chip ${uiPeriod==='prev'?'active':''}" data-period="prev">Прошлый</button>
      <button class="chip ${uiPeriod==='all'?'active':''}" data-period="all">Всё время</button>
    </div>

    <div class="stats">
      <div class="card stat">
        <div class="lbl">Баланс</div>
        <div class="val ${balance >= 0 ? 'pos' : 'neg'}">${fmt(balance)}</div>
        <div class="sub">${r.label}</div>
      </div>
      <div class="card stat">
        <div class="lbl">Доходы</div>
        <div class="val pos">${fmt(income)}</div>
        <div class="sub">${r.label}</div>
      </div>
      <div class="card stat">
        <div class="lbl">Расходы</div>
        <div class="val neg">${fmt(expense)}</div>
        <div class="sub">${r.label}</div>
      </div>
      <div class="card stat">
        <div class="lbl">Отложено</div>
        <div class="val">${fmt(savedInGoals)}</div>
        <div class="sub">${state.goals.length} ${plural(state.goals.length,'цель','цели','целей')}</div>
      </div>
    </div>

    ${renderBudgetsSection()}
    ${renderChartSection()}

    ${state.transactions.length === 0 ? `
      <div class="card" style="margin-top:14px">
        <div class="empty">
          <div class="big">👋</div>
          <p>Пока пусто. Запиши зарплату или первую покупку — жми <b>+</b> внизу.</p>
          <button class="btn ghost" data-action="demo">Загрузить пример данных</button>
        </div>
      </div>
    ` : `
      <div class="grid2">
        <div class="card">
          <div class="section-title" style="margin-top:0">Расходы по категориям</div>
          ${cats.length === 0 ? `<div class="hint">За этот период расходов нет.</div>` : cats.map(([id, sum]) => {
            const c = catById(id);
            const pct = Math.round(sum / maxCat * 100);
            const share = expense ? Math.round(sum / expense * 100) : 0;
            return `
              <div class="cat-row">
                <div class="cat-head">
                  <span>${c.icon} ${esc(c.name)}</span>
                  <span class="amt">${fmt(sum)} · ${share}%</span>
                </div>
                <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
              </div>`;
          }).join('')}
        </div>
        <div class="card">
          <div class="section-title" style="margin-top:0">Последние операции</div>
          ${recent.length === 0 ? `<div class="hint">Пусто.</div>` : recent.map(x => {
            const c = catById(x.category);
            return `
              <div class="tx-item" style="border-bottom:1px solid var(--border)">
                <div class="tx-content" style="cursor:default;background:transparent">
                  <div class="tx-ico">${c.icon}</div>
                  <div class="tx-mid">
                    <div class="tx-title">${esc(x.note || c.name)}</div>
                    <div class="tx-sub">${esc(c.name)} · ${humanDate(x.date)}</div>
                  </div>
                  <div class="tx-amt ${x.type === 'income' ? 'pos' : 'neg'}">
                    ${x.type === 'income' ? '+' : '−'}${fmt(x.amount)}
                  </div>
                </div>
              </div>`;
          }).join('')}
        </div>
      </div>
    `}

    ${state.goals.length ? `
      <div class="section-title">Активные цели</div>
      ${state.goals.map(g => goalCard(g)).join('')}
    ` : ''}

    <div style="margin-top:36px;text-align:center">
      <button class="btn ghost sm" data-action="reset">Очистить все данные</button>
    </div>
  `;
};

function renderBudgetsSection() {
  const now = new Date();
  const spent = {};
  state.transactions
    .filter(x => x.type === 'expense' && sameMonth(x.date, now))
    .forEach(x => { spent[x.category] = (spent[x.category] || 0) + x.amount; });

  const entries = Object.entries(state.budgets || {});
  if (!entries.length) {
    return `
      <div class="card" style="margin-top:14px">
        <div class="section-title" style="margin-top:0">Бюджеты</div>
        <div class="hint" style="margin-top:0">Установи лимит на категории — приложение подсветит, когда подходишь к пределу.</div>
        <button class="btn primary sm block" data-action="edit-budgets" style="margin-top:12px">Настроить бюджеты</button>
      </div>
    `;
  }
  return `
    <div class="card" style="margin-top:14px">
      <div class="section-title" style="margin-top:0">Бюджеты на этот месяц</div>
      ${entries.map(([catId, limit]) => {
        const c = catById(catId);
        const s = spent[catId] || 0;
        const pct = Math.min(100, s / limit * 100);
        const over = s > limit;
        const warn = !over && pct >= 80;
        const color = over ? 'var(--red)' : warn ? 'var(--yellow)' : 'var(--green)';
        const left = Math.max(0, limit - s);
        return `
          <div class="cat-row">
            <div class="cat-head">
              <span>${c.icon} ${esc(c.name)}</span>
              <span class="amt" style="color:${color}">${fmt(s)} / ${fmt(limit)}</span>
            </div>
            <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
            ${over ? `<div class="hint" style="color:var(--red);margin-top:4px">Превышено на ${fmt(s-limit)}</div>`
                    : `<div class="hint" style="margin-top:4px">Осталось ${fmt(left)}</div>`}
          </div>
        `;
      }).join('')}
      <button class="btn ghost sm block" data-action="edit-budgets" style="margin-top:6px">Настроить</button>
    </div>
  `;
}

function renderChartSection() {
  const now = new Date();
  const months = [];
  for (let i = 5; i >= 0; i--) months.push(new Date(now.getFullYear(), now.getMonth() - i, 1));
  const data = months.map(m => {
    const sum = state.transactions
      .filter(x => x.type === 'expense' && sameMonth(x.date, m))
      .reduce((a, x) => a + x.amount, 0);
    return { date: m, sum };
  });
  const maxSum = Math.max(1, ...data.map(d => d.sum));
  const barH = 100;
  const avg = data.reduce((a, d) => a + d.sum, 0) / 6;
  return `
    <div class="card" style="margin-top:14px">
      <div class="section-title" style="margin-top:0">Расходы за 6 месяцев</div>
      <div class="chart">
        ${data.map((d, i) => {
          const h = Math.max(4, Math.round(d.sum / maxSum * barH));
          const label = d.date.toLocaleDateString('ru-RU', { month: 'short' });
          const cur = i === data.length - 1;
          return `
            <div class="chart-col">
              <div class="chart-bar ${cur ? 'current' : ''}" style="height:${h}px" title="${fmt(d.sum)}"></div>
              <div class="chart-label">${label}</div>
            </div>`;
        }).join('')}
      </div>
      <div class="hint" style="margin-top:14px">Средние траты в месяц: <b style="color:var(--text)">${fmt(avg)}</b></div>
    </div>
  `;
}

/* =====================================================================
   ОПЕРАЦИИ
   ===================================================================== */
let txFilter = 'all';
VIEWS.transactions = () => {
  const list = state.transactions
    .filter(x => txFilter === 'all' || x.type === txFilter)
    .sort((a,b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));

  return `
    <div class="chips" style="margin-bottom:16px">
      <button class="chip ${txFilter==='all'?'active':''}" data-filter="all">Все</button>
      <button class="chip ${txFilter==='expense'?'active':''}" data-filter="expense">Расходы</button>
      <button class="chip ${txFilter==='income'?'active':''}" data-filter="income">Доходы</button>
    </div>
    ${list.length === 0 ? `
      <div class="card"><div class="empty">
        <div class="big">🧾</div>
        <p>${state.transactions.length === 0 ? 'Операций пока нет. Нажми <b>+</b> внизу.' : 'По фильтру ничего не найдено.'}</p>
      </div></div>
    ` : `
      <div class="card" style="padding:0 18px">
        ${list.map(x => {
          const c = catById(x.category);
          return `
            <div class="tx-item" data-id="${x.id}">
              <div class="tx-delete-bg" data-action="del-tx" data-id="${x.id}">🗑</div>
              <div class="tx-content" data-action="edit-tx" data-id="${x.id}">
                <div class="tx-ico">${c.icon}</div>
                <div class="tx-mid">
                  <div class="tx-title">${esc(x.note || c.name)}</div>
                  <div class="tx-sub">${esc(c.name)} · ${humanDate(x.date)}</div>
                </div>
                <div class="tx-amt ${x.type === 'income' ? 'pos' : 'neg'}">
                  ${x.type === 'income' ? '+' : '−'}${fmt(x.amount)}
                </div>
                <button class="icon-btn del-desktop" data-action="del-tx" data-id="${x.id}" aria-label="Удалить">✕</button>
              </div>
            </div>`;
        }).join('')}
      </div>
    `}
    ${renderRecurringSection()}

};
MOUNTS.transactions = () => {
  document.querySelectorAll('[data-filter]').forEach(b => {
    b.addEventListener('click', () => { txFilter = b.dataset.filter; haptic(5); render(); });
  });
  mountSwipe();
};

function renderRecurringSection() {
  const list = state.recurring || [];
  return `
    <div class="section-title">Регулярные платежи</div>
    ${list.length === 0 ? `
      <div class="card"><div class="empty" style="padding:24px 12px">
        <div class="big" style="font-size:28px">🔁</div>
        <p style="font-size:13px">Зарплата, подписки, аренда — добавь один раз, дальше создастся само.</p>
        <button class="btn primary sm" data-action="new-recurring">+ Добавить</button>
      </div></div>
    ` : `
      <div class="card" style="padding:0 18px">
        ${list.map(r => {
          const c = catById(r.category);
          return `
            <div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)">
              <div class="tx-ico">${c.icon}</div>
              <div class="tx-mid">
                <div class="tx-title">${esc(r.note || c.name)}</div>
                <div class="tx-sub">каждый ${r.dayOfMonth}-го · ${r.active ? 'активно' : 'выключено'}</div>
              </div>
              <div class="tx-amt ${r.type === 'income' ? 'pos' : 'neg'}">
                ${r.type === 'income' ? '+' : '−'}${fmt(r.amount)}
              </div>
              <button class="icon-btn" data-action="toggle-recurring" data-id="${r.id}">${r.active ? '⏸' : '▶'}</button>
              <button class="icon-btn" data-action="del-recurring" data-id="${r.id}">✕</button>
            </div>`;
        }).join('')}
      </div>
      <button class="btn ghost sm block" data-action="new-recurring" style="margin-top:10px">+ Добавить регулярный</button>

/* =====================================================================
   ЦЕЛИ
   ===================================================================== */
function goalCard(g) {
  const saved     = goalSaved(g);
  const remaining = Math.max(0, g.target - saved);
  const pct       = g.target > 0 ? Math.min(100, saved / g.target * 100) : 0;
  const months    = monthsUntil(g.deadline);
  const perMonth  = months > 0 ? remaining / months : remaining;
  const done      = remaining <= 0;
  const dl = new Date(g.deadline + 'T00:00:00');
  const dlText = isNaN(dl) ? '—' : dl.toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' });
  const subSum = (g.subgoals || []).reduce((a,s) => a + (Number(s.amount) || 0), 0);
  return `
    <div class="card" style="margin-top:14px">
      <div class="goal-head">
        <div style="min-width:0">
          <div class="goal-title">${esc(g.title)}</div>
          <div class="goal-deadline">до ${dlText} · ${months > 0 ? months + ' ' + plural(months,'месяц','месяца','месяцев') : 'срок вышел'}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex:0 0 auto">
          ${done ? `<span class="goal-done-badge">Готово 🎉</span>` : ''}
          <button class="icon-btn" data-action="del-goal" data-id="${g.id}">✕</button>
        </div>
      </div>
      <div class="goal-nums">
        <span><b>${fmt(saved)}</b> <span style="color:var(--muted)">из ${fmt(g.target)}</span></span>
        <span style="color:var(--muted)">${Math.round(pct)}%</span>
      </div>
      <div class="bar"><div class="bar-fill ${done ? 'green' : ''}" style="width:${pct}%"></div></div>
      <div class="goal-plan">
        ${done ? `<span>Цель закрыта. Можно тратить 🎉</span>` :
          `<span>Осталось: <b>${fmt(remaining)}</b></span>
           <span>В месяц: <b>${fmt(perMonth)}</b></span>`}
      </div>
      ${(g.subgoals && g.subgoals.length) ? `
        <div class="subgoals">
          <div class="section-title" style="margin:0 0 10px">Подцели</div>
          ${g.subgoals.map(s => `
            <label class="subgoal ${s.done ? 'done' : ''}">
              <input type="checkbox" data-action="toggle-sub" data-goal="${g.id}" data-sub="${s.id}" ${s.done ? 'checked' : ''}>
              <span class="t">${esc(s.title)}</span>
              <span class="a">${fmt(s.amount)}</span>
              <button class="icon-btn" data-action="del-sub" data-goal="${g.id}" data-sub="${s.id}">✕</button>
            </label>
          `).join('')}
          ${subSum !== g.target ? `<div class="hint">Подцели: ${fmt(subSum)} — ${subSum < g.target ? 'остаток' : 'перебор'} ${fmt(Math.abs(g.target - subSum))}</div>` : ''}
        </div>
      ` : `<div class="hint">Разбей цель на подцели — виза, билеты, техника. Отмечаешь галочку → сумма уходит в «отложено».</div>`}
      <form class="sub-add" data-goal="${g.id}">
        <input name="title" placeholder="Подцель: виза, билеты…" required>
        <input name="amount" type="number" step="0.01" min="0" inputmode="decimal" placeholder="сумма" required>
        <button class="btn sm" type="submit">+</button>
      </form>
      <form class="deposit-row" data-goal="${g.id}">
        <input name="amount" type="number" step="0.01" inputmode="decimal" placeholder="Отложить сумму…">
        <button class="btn primary sm" type="submit">Отложить</button>
      </form>
    </div>
  `;
}

function sharedGoalCard(g) {
  const total = g.total || 0;
  const remaining = Math.max(0, g.target - total);
  const pct = Math.min(100, total / g.target * 100);
  const isOwner = g.owner_id === currentUser?.id;
  const done = remaining <= 0;
  const dl = g.deadline ? new Date(g.deadline + 'T00:00:00') : null;
  const dlText = dl && !isNaN(dl) ? dl.toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' }) : '—';
  const months = g.deadline ? monthsUntil(g.deadline) : 0;
  const perMonth = months > 0 ? remaining / months : remaining;
  return `
    <div class="card" style="margin-top:14px">
      <div class="goal-head">
        <div style="min-width:0">
          <div class="goal-title">${esc(g.title)} <span class="badge" style="margin-left:6px">👥 ${g.members.length}</span></div>
          <div class="goal-deadline">до ${dlText} · ${months > 0 ? months + ' ' + plural(months,'месяц','месяца','месяцев') : 'срок вышел'}</div>
        </div>
        <button class="icon-btn" data-action="${isOwner ? 'del-shared' : 'leave-shared'}" data-id="${g.id}" title="${isOwner ? 'Удалить' : 'Выйти'}">✕</button>
      </div>
      <div class="goal-nums">
        <span><b>${fmt(total)}</b> <span style="color:var(--muted)">из ${fmt(g.target)}</span></span>
        <span style="color:var(--muted)">${Math.round(pct)}%</span>
      </div>
      <div class="bar"><div class="bar-fill ${done ? 'green' : ''}" style="width:${pct}%"></div></div>
      <div class="goal-plan">
        ${done ? `<span>🎉 Цель закрыта</span>` :
          `<span>Осталось: <b>${fmt(remaining)}</b></span>
           ${months > 0 ? `<span>В месяц: <b>${fmt(perMonth)}</b></span>` : ''}`}
      </div>
      <div class="subgoals" style="border-top:1px dashed var(--border)">
        <div class="section-title" style="margin:0 0 10px">Вклады</div>
        ${g.deposits.length === 0 ? `<div class="hint">Пока никто не отложил.</div>` :
          g.deposits.slice(0, 12).map(d => {
            const m = g.members.find(x => x.user_id === d.user_id);
            const name = (m?.email || '?').split('@')[0];
            return `
              <div style="display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--border)">
                <span style="flex:1;font-size:13.5px">${esc(name)}${d.note ? ` · ${esc(d.note)}` : ''}</span>
                <span style="font-size:13px;font-variant-numeric:tabular-nums">${fmt(d.amount)}</span>
                ${d.user_id === currentUser?.id ? `<button class="icon-btn" data-action="del-shared-deposit" data-goal="${g.id}" data-id="${d.id}">✕</button>` : ''}
              </div>`;
          }).join('')}
      </div>
      <form class="deposit-row" data-shared="${g.id}" style="margin-top:12px">
        <input name="amount" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="Сумма">
        <button class="btn primary sm" type="submit">Отложить</button>
      </form>
      <button class="btn ghost sm block" data-action="show-invite" data-code="${g.invite_code}" style="margin-top:10px">
        Пригласить · код ${g.invite_code}
      </button>
    </div>
  `;
}

VIEWS.goals = () => {
  const totalTarget = state.goals.reduce((a,g) => a + g.target, 0);
  const totalSaved  = state.goals.reduce((a,g) => a + goalSaved(g), 0);
  return `
    ${state.goals.length ? `
      <div class="stats" style="grid-template-columns:1fr 1fr;margin-bottom:8px">
        <div class="card stat">
          <div class="lbl">Всего нужно</div>
          <div class="val">${fmt(totalTarget)}</div>
        </div>
        <div class="card stat">
          <div class="lbl">Уже отложено</div>
          <div class="val pos">${fmt(totalSaved)}</div>
          <div class="sub">${totalTarget ? Math.round(totalSaved/totalTarget*100) : 0}% от всех целей</div>
        </div>
      </div>
      <div class="section-title">Мои цели</div>
      ${state.goals.map(g => goalCard(g)).join('')}
    ` : `
      <div class="card"><div class="empty">
        <div class="big">🎯</div>
        <p>Целей пока нет. Нажми <b>+</b> внизу — приложение само посчитает, сколько откладывать в месяц.</p>
      </div></div>
    `}

    <div class="section-title">Общие цели</div>
    ${sharedGoals.length === 0 ? `
      <div class="card"><div class="empty" style="padding:28px 16px">
        <div class="big" style="font-size:30px">👥</div>
        <p style="font-size:13.5px">Копите вместе с друзьями: создай общую цель и отправь код, или присоединись по чужому коду.</p>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button class="btn primary sm" data-action="new-shared">+ Создать</button>
          <button class="btn ghost sm" data-action="join-shared">Присоединиться</button>
        </div>
      </div></div>
    ` : `
      ${sharedGoals.map(g => sharedGoalCard(g)).join('')}
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn primary sm" data-action="new-shared" style="flex:1">+ Создать</button>
        <button class="btn ghost sm" data-action="join-shared" style="flex:1">Присоединиться</button>
      </div>
    `}
  `;
};

/* =====================================================================
   ЗАМЕТКИ
   ===================================================================== */
VIEWS.notes = () => {
  if (state.notes.length === 0) {
    return `
      <div class="card"><div class="empty">
        <div class="big">📝</div>
        <p>Заметки — про всё, что не деньги: что взять в поездку, какой язык подтянуть, к какому числу сделать визу.</p>
        <button class="btn primary" data-action="new-note">+ Создать заметку</button>
      </div></div>
    `;
  }
  return `
    <button class="btn primary" data-action="new-note" style="margin-bottom:16px">+ Новая заметка</button>
    ${state.notes.map(n => `
      <div class="card note-card" data-note="${n.id}">

function mountTxSheet() {
  const amountEl = $('#txAmount');
  const addBtn   = $('#txAddBtn');

  const editing = !!sheetTx.editId;

  const updateBtn = () => {
    const v = parseFloat(amountEl.value);
    const base = editing ? 'Сохранить' : 'Добавить';
    addBtn.textContent = v > 0 ? `${base} ${fmt(v)}` : base;
  };
  amountEl.addEventListener('input', updateBtn); updateBtn();

  document.querySelectorAll('[data-sheet-type]').forEach(b => {
    b.addEventListener('click', () => {
      sheetTx.type = b.dataset.sheetType;
      haptic(5);
      const v = amountEl.value;
      const n = $('#txNote')?.value || '';
      const d = $('#txDate')?.value || todayStr();
      const cats = sheetTx.type === 'expense' ? EXPENSE_CATS : INCOME_CATS;

      renderTxSheet({ amount: v, note: n, date: d });

  catGrid.addEventListener('click', e => {
    const c = e.target.closest('[data-sheet-cat]');
    if (!c) return;
    sheetTx.category = c.dataset.sheetCat;
    catGrid.querySelectorAll('.cat-cell').forEach(x => x.classList.toggle('active', x === c));
    haptic(5);
  });

  const saveTx = () => {
    const amount = parseFloat(amountEl.value);
    if (!amount || amount <= 0) {
      amountEl.focus();
      amountEl.style.borderColor = 'var(--red)';
      setTimeout(() => amountEl.style.borderColor = '', 800);

    }
    const data = {
      type: sheetTx.type, amount, category: sheetTx.category,
      note: $('#txNote').value.trim(),
      date: $('#txDate').value || todayStr(),
    };
    if (editing) {

      if (t) Object.assign(t, data);
    } else {
      state.transactions.push({ id: uid(), ...data, createdAt: new Date().toISOString() });
      state.categoryUsage[sheetTx.category] = (state.categoryUsage[sheetTx.category] || 0) + 1;
    }
    save(); haptic(15); closeSheet();
    setTimeout(() => {
      toast(editing ? 'Сохранено' : (data.type === 'income' ? `Доход ${fmt(amount)} записан` : `Расход ${fmt(amount)} записан`));
      render();

  $('#txNote').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveTx(); } });

  if (editing) {
    $('#txDelBtn').addEventListener('click', () => {
      if (confirm('Удалить операцию?')) {
        state.transactions = state.transactions.filter(x => x.id !== sheetTx.editId);
        save(); haptic(12); closeSheet();
        setTimeout(() => { toast('Удалено'); render(); }, 180);
      }
    });
  }
}

/* =====================================================================
   SWIPE TO DELETE
   ===================================================================== */
function mountSwipe() {
  let touch = null;
  const items = document.querySelectorAll('.tx-item');

  items.forEach(item => {
    item.addEventListener('touchstart', e => {
      const content = e.target.closest('.tx-content');
      if (!content || e.target.closest('[data-action="del-tx"]')) return;
      touch = { content, item, x: e.touches[0].clientX, y: e.touches[0].clientY, swiped: false };
    }, { passive: true });

    item.addEventListener('touchmove', e => {
      if (!touch || touch.item !== item) return;
      const dx = e.touches[0].clientX - touch.x;
      const dy = e.touches[0].clientY - touch.y;
      if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 12) { touch = null; return; }
      if (Math.abs(dx) > 8) {
        touch.swiped = true;
        touch.content.classList.add('dragging');
        const shift = Math.max(-72, Math.min(0, dx));
        touch.content.style.transform = `translateX(${shift}px)`;
      }
    }, { passive: true });

    item.addEventListener('touchend', e => {
      if (!touch || touch.item !== item) return;
      const dx = (e.changedTouches[0]?.clientX || 0) - touch.x;
      touch.content.classList.remove('dragging');
      touch.content.style.transform = '';
      document.querySelectorAll('.tx-item').forEach(i => i.classList.remove('swiped'));
      if (touch.swiped && dx < -40) {
        item.classList.add('swiped');
        haptic(6);
      }
      // предотвращаем клик-переход в edit если был свайп
      if (touch.swiped) {
        item.addEventListener('click', ev => { ev.stopPropagation(); ev.preventDefault(); }, { capture: true, once: true });
      }
      touch = null;
    });
  });

  // Тап в любое место (кроме свайпнутого) — закрываем открытые свайпы
  document.addEventListener('touchstart', e => {
    if (!e.target.closest('.tx-item.swiped')) {
      document.querySelectorAll('.tx-item.swiped').forEach(i => i.classList.remove('swiped'));
    }
  }, { passive: true });
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;

  if (a === 'del-tx') {
    e.stopPropagation();
    state.transactions = state.transactions.filter(x => x.id !== el.dataset.id);
    save(); haptic(10); render();
    toast('Удалено');
  }
  if (a === 'edit-tx') {
    // не открываем если строка свайпнута
    const item = el.closest('.tx-item');
    if (item?.classList.contains('swiped')) return;
    openTxEditSheet(el.dataset.id);
  }
  if (a === 'del-goal') {
    if (confirm('Удалить цель?')) {
      state.goals = state.goals.filter(g => g.id !== el.dataset.id);
      save(); render();
    }
  }
  if (a === 'del-sub') {
    e.preventDefault(); e.stopPropagation();
    const g = state.goals.find(x => x.id === el.dataset.goal);
    if (g) { g.subgoals = g.subgoals.filter(s => s.id !== el.dataset.sub); save(); haptic(10); render(); }
  }
  if (a === 'new-note') {
    state.notes.unshift({ id: uid(), title: '', text: '', updated: new Date().toISOString() });
    save(); render();
    setTimeout(() => { const f = document.querySelector('.note-card input.note-title'); if (f) f.focus(); }, 30);
  }
  if (a === 'del-note') {
    state.notes = state.notes.filter(n => n.id !== el.dataset.id); save(); haptic(10); render();
  }
  if (a === 'reset') {
    if (confirm('Удалить ВСЕ данные? Это необратимо.')) {
      state = { transactions: [], goals: [], notes: [], currency: state.currency, budgets: {}, recurring: [], categoryUsage: {} };
      save(); render();
    }
  }
  if (a === 'demo') loadDemo();
  if (a === 'force-sync') { closeSheet(); pushToCloud().then(() => toast('Синхронизировано')); }
  if (a === 'logout') {
    if (confirm('Выйти? Данные останутся в облаке.')) {
      closeSheet(); unsubscribeRealtime(); sb.auth.signOut();
    }
  }
  if (a === 'edit-budgets') openBudgetSheet();
  if (a === 'new-recurring') openRecurringSheet();
  if (a === 'toggle-recurring') {
    const r = state.recurring.find(x => x.id === el.dataset.id);
    if (r) { r.active = !r.active; save(); haptic(8); render(); }
  }
  if (a === 'del-recurring') {
    if (confirm('Удалить регулярный платёж?')) {
      state.recurring = state.recurring.filter(x => x.id !== el.dataset.id);
      save(); render();
    }
  }
  if (a === 'new-shared') openSharedGoalSheet();
  if (a === 'join-shared') openJoinSharedSheet();
  if (a === 'show-invite') openInviteSheet(el.dataset.code);
  if (a === 'copy-code') {
    const code = el.dataset.code;
    try { await navigator.clipboard.writeText(code); toast('Код скопирован'); }
    catch { toast('Не удалось скопировать', false); }
  }
  if (a === 'share-code') {
    const code = el.dataset.code;
    if (navigator.share) {
      try { await navigator.share({ title: 'Код для общей цели', text: `Присоединяйся: ${code}` }); }
      catch {}
    } else {
      try { await navigator.clipboard.writeText(code); toast('Код скопирован'); } catch {}
    }
  }
  if (a === 'leave-shared') {
    if (!confirm('Выйти из общей цели?')) return;
    const { error } = await sb.from('shared_goal_members')
      .delete().eq('goal_id', el.dataset.id).eq('user_id', currentUser.id);
    if (error) { toast('Ошибка: ' + error.message, false); return; }
    await loadSharedGoals(); haptic(12); toast('Вышел'); render();
  }
  if (a === 'del-shared') {
    if (!confirm('Удалить общую цель для всех участников?')) return;
    const { error } = await sb.from('shared_goals').delete().eq('id', el.dataset.id);
    if (error) { toast('Ошибка: ' + error.message, false); return; }
    await loadSharedGoals(); haptic(12); toast('Удалено'); render();
  }
  if (a === 'del-shared-deposit') {
    const { error } = await sb.from('shared_goal_deposits').delete().eq('id', el.dataset.id);
    if (error) { toast('Ошибка: ' + error.message, false); return; }
    await loadSharedGoals(); render();
  }
});

/* Period chips */
document.addEventListener('click', e => {
  const c = e.target.closest('[data-period]');
  if (!c) return;
  uiPeriod = c.dataset.period;
  haptic(5); render();
});

/* Checkbox подцелей */
document.addEventListener('change', e => {
  const cb = e.target.closest('[data-action="toggle-sub"]');
  if (!cb) return;
  const g = state.goals.find(x => x.id === cb.dataset.goal);
  if (!g) return;
  const s = g.subgoals.find(x => x.id === cb.dataset.sub);
  if (!s) return;
  s.done = cb.checked; save(); haptic(8);
  setTimeout(render, 220);
});

/* Формы */
document.addEventListener('submit', async e => {
  const form = e.target;

  if (form.classList.contains('sub-add')) {
    e.preventDefault();
    const g = state.goals.find(x => x.id === form.dataset.goal);
    if (!g) return;
    const title = form.querySelector('[name=title]').value.trim();
    const amount = parseFloat(form.querySelector('[name=amount]').value);
    if (!title || !amount || amount <= 0) return;
    g.subgoals = g.subgoals || [];
    g.subgoals.push({ id: uid(), title, amount, done: false });
    save(); haptic(10); toast('Подцель добавлена'); render();
  }

  if (form.classList.contains('deposit-row')) {
    e.preventDefault();
    const g = state.goals.find(x => x.id === form.dataset.goal);
    if (g) {
      const amount = parseFloat(form.querySelector('[name=amount]').value);
      if (!amount) return;
      g.deposits = (Number(g.deposits) || 0) + amount;
      save(); haptic(12); toast(`Отложено ${fmt(amount)}`); render();
      return;
    }
    // общая цель
    const sgId = form.dataset.shared;
    if (sgId) {
      const amount = parseFloat(form.querySelector('[name=amount]').value);
      if (!amount || amount <= 0) return;
      const { error } = await sb.from('shared_goal_deposits').insert({
        goal_id: sgId, user_id: currentUser.id, amount,
        date: todayStr(),
      });
      if (error) { toast('Ошибка: ' + error.message, false); return; }
      await loadSharedGoals(); haptic(12); toast(`Отложено ${fmt(amount)}`); render();
    }
  }
});

/* =====================================================================
   СТАРТ
   ===================================================================== */
loadLocal();
loadLocalShared();

async function handleSession(session) {
  const wasUser = !!currentUser;
  currentUser = session?.user || null;

  if (currentUser && !wasUser) {
    const lastUser = localStorage.getItem(LAST_USER_KEY);
    if (lastUser && lastUser !== currentUser.id) {
      state = { transactions: [], goals: [], notes: [], currency: '€', budgets: {}, recurring: [], categoryUsage: {} };
      sharedGoals = [];
      saveLocalShared();
    }
    localStorage.setItem(LAST_USER_KEY, currentUser.id);

    showApp();
    $('#pageTitle').textContent = TITLES[currentTab];
    setSyncStatus('syncing');

    const { found } = await pullFromCloud();
    if (!found) await pushToCloud();

    runRecurring();
    await loadSharedGoals();

    setSyncStatus('ok');
    subscribeRealtime();
    render(true);

  } else if (!currentUser && wasUser) {
    unsubscribeRealtime();
    showAuth();
  } else if (!currentUser) {
    showAuth();
  }
}

(async () => {
  try {
    const { data: { session } } = await sb.auth.getSession();
    await handleSession(session);
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' || event === 'SIGNED_OUT' || event === 'USER_UPDATED') {
        handleSession(session);
      }
    });
  } catch (e) {
    console.error('Auth init error:', e);
    showAuth();
    showAuthMsg('Не удалось подключиться. Проверь SUPABASE_URL и ключ.', 'err');
  }
})();

/* Подтягиваем свежие общие цели при возврате на вкладку */
let lastFocus = Date.now();
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  if (!currentUser) return;
  if (Date.now() - lastFocus < 60000) return;
  lastFocus = Date.now();
  if (syncState === 'ok') {
    const { found } = await pullFromCloud();
    if (found) render();
  }
  await loadSharedGoals();
  if (currentTab === 'goals') render();
});
